  // ── Records personnels par distance (v2.3, 12 juillet 2026 ; saisie h/min/sec
  // séparée depuis v2.14, 18/07/2026) ────────────────────────────────────────
  // Un temps de référence par distance, mémorisé une fois pour toutes dans
  // profilCoureur.records — le wizard n'a plus besoin de le redemander à
  // chaque nouveau plan, il choisit automatiquement le record le plus
  // pertinent pour la distance visée (avec repli sur Riegel si aucun
  // record exact n'existe, cf. section 2.3 du doc de convergence).
  //
  // Saisie par 3 champs numériques (h/min/sec) plutôt qu'un champ texte
  // libre "mm:ss" — plus facile à remplir au clavier (surtout mobile,
  // pavé numérique direct) et supprime toute ambiguïté de format sur les
  // temps ≥ 1h (Semi/Marathon). Le format texte stocké (compatible
  // parseTimeToSeconds du moteur, "mm:ss" ou "h:mm:ss") ne change pas —
  // seule la saisie change, pas le schéma de données ni ce que consomme
  // le reste de l'app (Riegel, wizard).
  //
  // Réutilisée telle quelle par l'onboarding (auth.classic.js /
  // v2/engine/auth.js) — factorisée ici plutôt que dupliquée, cf. principe
  // "un seul fichier modifié couvre tous les modes" (inventaire, section
  // Key learnings).
  // ── Composant roulette (wheel picker) — 31/07/2026 ─────────────────────
  // Même principe que public/v2/index.html (cf. son en-tête pour le détail
  // complet) : une colonne scrollable par unité, item centré dans la
  // fenêtre de sélection = valeur retenue, calcul direct de scrollTop
  // (jamais scrollIntoView, peu fiable sur un conteneur pas encore
  // affiché — cf. Réglages caché derrière d'autres onglets au chargement).
  // Porté ici séparément du wizard (fichier distinct, pas de dépendance
  // inter-fichiers) — hauteurs différentes (picker 120px/item 36px/pad
  // 42px ici, vs 150/44/53 côté wizard), cf. CSS .roulette-* de ce fichier.
  function creerColonneRouletteRecglages(conteneurId, valeurs, valeurInitiale, onSelect){
    const conteneur = document.getElementById(conteneurId);
    if (!conteneur) return null;
    conteneur.innerHTML = '';
    const padHaut = document.createElement('div'); padHaut.className = 'roulette-pad';
    conteneur.appendChild(padHaut);
    const items = valeurs.map(v => {
      const item = document.createElement('div');
      item.className = 'roulette-item';
      item.textContent = String(v).padStart(2,'0');
      item.dataset.valeur = v;
      conteneur.appendChild(item);
      return item;
    });
    const padBas = document.createElement('div'); padBas.className = 'roulette-pad';
    conteneur.appendChild(padBas);

    let valeurActuelle = valeurInitiale;
    let timerScrollFin = null;
    const HAUTEUR_ITEM = 36, HAUTEUR_PAD = 42, HAUTEUR_PICKER = 120; // cf. CSS .roulette-*
    // CORRECTIF (31/07/2026) — même bug/cause que public/v2/index.html (cf.
    // son en-tête pour le détail complet) : rootMargin restreint la zone
    // d'intersection à la fenêtre de sélection (36px centrés) au lieu de
    // tout le conteneur (120px), sinon l'item marqué actif n'était pas
    // celui réellement centré dans la fenêtre grise.
    const margeVerticale = (HAUTEUR_PICKER - HAUTEUR_ITEM) / 2;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entree => {
        if (entree.isIntersecting && entree.intersectionRatio > 0.5) {
          items.forEach(it => it.classList.remove('actif'));
          entree.target.classList.add('actif');
        }
      });
    }, { root: conteneur, rootMargin: `-${margeVerticale}px 0px -${margeVerticale}px 0px`, threshold: [0, 0.5, 1] });
    items.forEach(it => observer.observe(it));

    conteneur.addEventListener('scroll', () => {
      clearTimeout(timerScrollFin);
      timerScrollFin = setTimeout(() => {
        const itemActif = conteneur.querySelector('.roulette-item.actif');
        if (!itemActif) return;
        const nouvelleValeur = parseInt(itemActif.dataset.valeur, 10);
        if (nouvelleValeur !== valeurActuelle) {
          valeurActuelle = nouvelleValeur;
          onSelect(nouvelleValeur);
        }
      }, 120);
    }, { passive: true });

    const api = {
      definirValeur(v, animer, tentative){
        const index = items.findIndex(it => parseInt(it.dataset.valeur,10) === v);
        if (index === -1) return;
        valeurActuelle = v;
        const cible = HAUTEUR_PAD + index * HAUTEUR_ITEM - (HAUTEUR_PICKER - HAUTEUR_ITEM) / 2;
        if (animer === false) conteneur.scrollTop = cible;
        else conteneur.scrollTo({ top: cible, behavior: 'smooth' });
        items.forEach(it => it.classList.remove('actif'));
        items[index].classList.add('actif');
        // CORRECTIF (31/07/2026, bug confirmé par inspection console avec
        // Laurent : scrollTop restait à 0 au tout PREMIER rendu d'un
        // écran, mais fonctionnait normalement au rendu suivant du même
        // écran — cause exacte non identifiée malgré plusieurs
        // hypothèses de timing testées, cf. historique du fichier) —
        // vérification défensive : si scrollTop ne correspond pas à la
        // cible visée après un cycle de peinture, on retente jusqu'à 5
        // fois. N'a aucun effet perceptible dans le cas normal (le
        // premier essai suffit), rattrape silencieusement le cas où il
        // échoue.
        if (animer === false && cible > 0) {
          const tentativeActuelle = tentative ?? 0;
          if (tentativeActuelle < 5) {
            requestAnimationFrame(() => {
              if (Math.abs(conteneur.scrollTop - cible) > 2) {
                api.definirValeur(v, false, tentativeActuelle + 1);
              }
            });
          }
        }
      },
      valeur(){ return valeurActuelle; },
    };
    api.definirValeur(valeurInitiale, false);
    return api;
  }

  // Instancie les 3 colonnes h/min/sec pour un préfixe donné et les
  // synchronise vers les inputs cachés idPrefix+"-h/-m/-s" (dispatch d'un
  // vrai événement 'input' à chaque changement, cohérent avec le pattern
  // du wizard — mais ici rien n'écoute cet event pour l'instant, les
  // valeurs sont lues directement au clic sur "Enregistrer").
  //
  // heuresMax (31/07/2026, demande de Laurent : 24h identique pour les 4
  // distances de record jugé abusé) — borne la colonne heures à une plage
  // réaliste selon la distance concernée. Repli sur 24 si non fourni, pour
  // rester rétrocompatible avec un éventuel appelant qui ne le précise pas.
  // Registre des instances de roulette actives, indexé par idPrefix
  // (31/07/2026) — nécessaire pour le bouton "Effacer" (cf.
  // creerChampsTempsHMS), qui doit pouvoir repositionner visuellement une
  // roulette déjà créée sans la reconstruire entièrement.
  const roulettesActivesReglages = {};

  window.initRouletteHMS = function(idPrefix, hInit, mInit, sInit, heuresMax = 24){
    const inputH = document.getElementById(idPrefix + '-h');
    const inputM = document.getElementById(idPrefix + '-m');
    const inputS = document.getElementById(idPrefix + '-s');
    if (!inputH || !inputM || !inputS) return; // DOM pas encore attaché, cf. setTimeout appelant

    const declencherInput = (input, valeur) => {
      input.value = String(valeur);
      input.dispatchEvent(new Event('input', { bubbles:true }));
    };

    const colH = creerColonneRouletteRecglages(idPrefix + '-rouletteH', Array.from({length:heuresMax+1},(_,i)=>i), hInit, v => declencherInput(inputH, v));
    const colM = creerColonneRouletteRecglages(idPrefix + '-rouletteM', Array.from({length:60},(_,i)=>i), mInit, v => declencherInput(inputM, v));
    const colS = creerColonneRouletteRecglages(idPrefix + '-rouletteS', Array.from({length:60},(_,i)=>i), sInit, v => declencherInput(inputS, v));
    roulettesActivesReglages[idPrefix] = { h: colH, m: colM, s: colS };

    // Boutons +/- (31/07/2026, demande de Laurent) — incrémentent/
    // décrémentent la colonne d'une unité, avec bouclage (0 <-> max) plutôt
    // que de bloquer aux bornes : cohérent avec le geste de scroll de la
    // roulette elle-même, qui permet déjà de boucler en swipant au-delà
    // des extrémités. definirValeur() seule ne déclenche jamais onSelect
    // (elle repositionne juste visuellement le scroll, cf. son
    // commentaire) — on appelle donc explicitement declencherInput() en
    // plus, pour que la nouvelle valeur soit bien persistée comme si
    // l'utilisateur avait scrollé lui-même.
    //
    // CORRECTIF (31/07/2026, bug signalé par Laurent : "le chiffre se met
    // en gras dans la liste mais ne se met pas au centre") — la valeur
    // était bien mise à jour (classe .actif posée sur le bon item), mais
    // le scroll animé (definirValeur(v, true) -> scrollTo({behavior:
    // 'smooth'})) entre en conflit avec scroll-snap-type:y mandatory posé
    // en CSS sur .roulette-colonne : le navigateur tente de "recorriger"
    // la position vers l'ancrage snap le plus proche PENDANT l'animation,
    // ce qui peut annuler/bloquer le mouvement avant qu'il n'atteigne sa
    // cible. Passé à animer=false (scrollTop direct, instantané) — même
    // mode déjà utilisé pour le positionnement initial de la roulette
    // (cf. api.definirValeur(valeurInitiale, false) plus haut), qui ne
    // souffre pas de ce conflit.
    function cablerBoutonIncrement(idBouton, colApi, inputCible, maxValeur) {
      const btn = document.getElementById(idBouton);
      if (!btn || !colApi) return;
      btn.addEventListener('click', avecRetourTactile(() => {
        const actuelle = colApi.valeur();
        const nouvelle = (actuelle + 1) % (maxValeur + 1);
        colApi.definirValeur(nouvelle, false);
        declencherInput(inputCible, nouvelle);
      }));
    }
    function cablerBoutonDecrement(idBouton, colApi, inputCible, maxValeur) {
      const btn = document.getElementById(idBouton);
      if (!btn || !colApi) return;
      btn.addEventListener('click', avecRetourTactile(() => {
        const actuelle = colApi.valeur();
        const nouvelle = (actuelle - 1 + maxValeur + 1) % (maxValeur + 1);
        colApi.definirValeur(nouvelle, false);
        declencherInput(inputCible, nouvelle);
      }));
    }
    cablerBoutonIncrement(idPrefix+'-plusH', colH, inputH, heuresMax);
    cablerBoutonDecrement(idPrefix+'-moinsH', colH, inputH, heuresMax);
    cablerBoutonIncrement(idPrefix+'-plusM', colM, inputM, 59);
    cablerBoutonDecrement(idPrefix+'-moinsM', colM, inputM, 59);
    cablerBoutonIncrement(idPrefix+'-plusS', colS, inputS, 59);
    cablerBoutonDecrement(idPrefix+'-moinsS', colS, inputS, 59);
  };

  window.parserTempsRecordEnHMS = function(str) {
    // "50:21" -> {h:0,m:50,s:21} ; "3:45:00" -> {h:3,m:45,s:0}
    if (!str) return { h: null, m: null, s: null };
    const parts = str.split(':').map(Number);
    if (parts.length === 2) return { h: null, m: parts[0] || null, s: parts[1] ?? null };
    if (parts.length === 3) return { h: parts[0] || null, m: parts[1] ?? null, s: parts[2] ?? null };
    return { h: null, m: null, s: null };
  };
  window.formaterHMSEnTempsRecord = function(h, m, s) {
    // Repli sur 0 uniquement pour min/sec si l'un des deux est renseigné
    // (évite un format "::30" invalide) — mais si les 3 champs sont vides,
    // retourne null plutôt qu'un "0:00" trompeur.
    const hNum = parseInt(h) || 0;
    const mNum = parseInt(m) || 0;
    const sNum = parseInt(s) || 0;
    if (!h && !m && !s) return null;
    const mm = String(mNum).padStart(2, '0');
    const ss = String(sNum).padStart(2, '0');
    return hNum > 0 ? `${hNum}:${mm}:${ss}` : `${mNum}:${ss}`;
  };

  // Construit les 3 champs h/min/sec pour une distance donnée — remplacés
  // par une roulette à défilement le 31/07/2026 (demande de Laurent, même
  // composant que public/v2/index.html — cf. son en-tête pour le détail
  // du principe general). Les inputs number d'origine restent dans le DOM
  // en <input type="hidden">, avec les MÊMES ids (idPrefix+"-h/-m/-s") —
  // le bouton "Enregistrer" (plus bas dans ce fichier) les lit directement
  // via document.getElementById, aucune modification nécessaire côté
  // lecture.
  //
  // idPrefix sert à générer des ids uniques (ex. "rec-temps-10K" ->
  // "rec-temps-10K-h/-m/-s").
  //
  // NOTE : le commentaire précédent de cette fonction affirmait qu'elle
  // était "réutilisée telle quelle par l'onboarding" — vérifié inexact le
  // 31/07/2026 : v2/engine/auth.js a en réalité sa PROPRE logique de
  // saisie h/min/sec dupliquée (commentaire explicite dans ce fichier :
  // "pas d'accès à window.creerChampsTempsHMS d'index.html, chargé après
  // ce module"), pour ne pas créer de dépendance d'ordre de chargement
  // entre les deux fichiers. La roulette de l'onboarding est donc portée
  // séparément dans auth.js, avec son propre CSS/JS — cohérent avec cette
  // contrainte déjà actée, pas une régression de ce chantier.
  // Bornes de la colonne heures par distance (31/07/2026, demande de
  // Laurent : 24h identique pour les 4 distances jugé abusé — un 5K ne
  // dépasse jamais 1h en pratique, même marché). Valeurs pensées pour
  // couvrir les cas extrêmes réalistes (marche/course incluse), pas la
  // moyenne : 5K/10K restent courts par nature, Semi/Marathon peuvent
  // légitimement dépasser plusieurs heures pour un débutant ou une
  // approche marche/course. Repli sur 9h si la distance n'est pas
  // reconnue (garde-fou, ne devrait jamais arriver avec les 4 clés
  // ci-dessous).
  const HEURES_MAX_PAR_DISTANCE = { "5K": 1, "10K": 2, "Semi": 4, "Marathon": 9 };

  window.creerChampsTempsHMS = function(idPrefix, valeurInitiale) {
    const { h, m, s } = window.parserTempsRecordEnHMS(valeurInitiale);
    // Extrait la distance depuis idPrefix (toujours "rec-temps-"+dist à
    // l'unique site d'appel actuel) plutôt que d'ajouter un paramètre
    // distance séparé — évite de changer la signature de cette fonction
    // pour un éventuel autre appelant existant.
    const distDepuisPrefix = idPrefix.replace(/^rec-temps-/, '');
    const heuresMax = HEURES_MAX_PAR_DISTANCE[distDepuisPrefix] ?? 9;
    const wrap = document.createElement("div");
    wrap.id = idPrefix + "-wrap";
    wrap.style.cssText = "display:flex;align-items:center;gap:4px;flex-shrink:0;";

    const roulette = document.createElement("div");
    roulette.className = "roulette-temps";
    // Largeur réduite (31/07/2026, bug signalé par Laurent avec capture
    // d'écran : disposition écrasée, boutons +/- empilés au lieu d'être
    // côte à côte) — 150px ne tenait plus dans l'espace réel d'une carte
    // de la grille 2x2 des records (~149px utiles sur mobile, calculé
    // après le passage à ce nouveau layout compact), laissant à peine de
    // place pour 3 mini-colonnes de boutons. Réduit à 130px, avec les
    // boutons +/- eux-mêmes réduits en proportion (28px -> 24px de large).
    roulette.style.cssText = "flex-shrink:0;width:130px;";
    const fenetre = document.createElement("div"); fenetre.className = "roulette-fenetre";

    // Boutons +/- au-dessus et en dessous de chaque colonne (31/07/2026,
    // demande de Laurent) — chaque colonne est enveloppée dans une
    // mini-colonne verticale (bouton +, colonne roulette, bouton -), au
    // lieu d'être un enfant direct de .roulette-temps. Les clics sont
    // câblés plus bas dans initRouletteHMS (où l'objet api de chaque
    // colonne, avec definirValeur()/valeur(), devient disponible) — cette
    // fonction-ci ne fait QUE construire la structure DOM et poser des id
    // ciblables (idPrefix+"-plusH" etc.), pas la logique d'incrément.
    function creerColonneAvecBoutons(idColonne, idBoutonPlus, idBoutonMoins) {
      // Disposition verticale (31/07/2026, clarifiée après un premier essai
      // à côté de la colonne qui ne correspondait pas à la demande) : +
      // au-dessus, colonne roulette (chiffre actif seul visible, cf. CSS
      // .roulette-item{opacity:0}/.actif{opacity:1}) au centre, - en
      // dessous. Le geste de défilement tactile reste pleinement
      // fonctionnel — ces boutons sont un raccourci en plus, pas un
      // remplacement du scroll.
      const mini = document.createElement("div");
      mini.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;";
      const btnPlus = document.createElement("button");
      btnPlus.type = "button"; btnPlus.id = idBoutonPlus; btnPlus.textContent = "+";
      btnPlus.style.cssText = "width:24px;height:18px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:12px;font-weight:700;cursor:pointer;padding:0;line-height:1;flex-shrink:0;";

      // Viewport réduit (31/07/2026, bug signalé par Laurent : "grand
      // espace entre les chiffres et les +/-") — .roulette-colonne garde sa
      // vraie hauteur de 120px en interne (nécessaire au mécanisme de
      // scroll/scroll-snap, cf. HAUTEUR_PICKER=120 dans initRouletteHMS/
      // definirValeur, jamais changé), mais n'est visible qu'à travers une
      // fenêtre de 44px (overflow:hidden), centrée sur la bande de
      // sélection interne via un décalage négatif calculé une fois pour
      // toutes (-38px = moitié viewport - moitié colonne). Depuis que seul
      // le chiffre actif reste visible (opacity:0 sur les autres, ajouté
      // plus tôt le même jour), les ~84px de colonne restants au-dessus/
      // en-dessous de la fenêtre de sélection n'avaient plus aucune raison
      // d'être visibles à l'écran.
      const viewport = document.createElement("div");
      viewport.style.cssText = "height:44px;overflow:hidden;position:relative;";
      const col = document.createElement("div");
      col.className = "roulette-colonne"; col.id = idColonne;
      col.style.marginTop = "-38px";
      viewport.appendChild(col);

      const btnMoins = document.createElement("button");
      btnMoins.type = "button"; btnMoins.id = idBoutonMoins; btnMoins.textContent = "−";
      btnMoins.style.cssText = btnPlus.style.cssText;
      mini.appendChild(btnPlus); mini.appendChild(viewport); mini.appendChild(btnMoins);
      return mini;
    }

    const colHWrap = creerColonneAvecBoutons(idPrefix+"-rouletteH", idPrefix+"-plusH", idPrefix+"-moinsH");
    const sepH = document.createElement("span"); sepH.className = "roulette-sep"; sepH.textContent = ":";
    const colMWrap = creerColonneAvecBoutons(idPrefix+"-rouletteM", idPrefix+"-plusM", idPrefix+"-moinsM");
    const sepM = document.createElement("span"); sepM.className = "roulette-sep"; sepM.textContent = ":";
    const colSWrap = creerColonneAvecBoutons(idPrefix+"-rouletteS", idPrefix+"-plusS", idPrefix+"-moinsS");
    roulette.appendChild(fenetre); roulette.appendChild(colHWrap); roulette.appendChild(sepH);
    roulette.appendChild(colMWrap); roulette.appendChild(sepM); roulette.appendChild(colSWrap);

    const hInp = document.createElement("input");
    hInp.type = "hidden"; hInp.id = idPrefix + "-h"; hInp.value = h ?? "";
    const mInp = document.createElement("input");
    mInp.type = "hidden"; mInp.id = idPrefix + "-m"; mInp.value = m ?? "";
    const sInp = document.createElement("input");
    sInp.type = "hidden"; sInp.id = idPrefix + "-s"; sInp.value = s ?? "";

    wrap.appendChild(roulette);
    wrap.appendChild(hInp); wrap.appendChild(mInp); wrap.appendChild(sInp);

    // Retire l'état "effacé" dès que l'utilisateur retouche la roulette
    // après un clic sur Effacer (accidentel ou changement d'avis) — les 3
    // inputs cachés reçoivent un vrai événement 'input' à chaque défilement
    // (cf. declencherInput dans initRouletteHMS), donc ce listener suffit
    // à couvrir n'importe quelle colonne (h/m/s) sans les cibler une par
    // une.
    [hInp, mInp, sInp].forEach(inp => {
      inp.addEventListener('input', () => { delete wrap.dataset.recordEfface; });
    });

    // Bouton "Effacer" (31/07/2026, demande de Laurent) — avec la roulette,
    // il n'existe plus d'état "champ vide" naturel comme avec l'ancien
    // champ texte (elle affiche toujours une valeur numérique, y compris
    // "0:00" après un scroll complet vers le haut). Sans ce bouton,
    // remettre la roulette à 0:00 aurait été interprété comme un vrai
    // temps saisi de 0 seconde — à la fois faux (aucun coureur n'a un
    // record à 0:00) et bloqué à tort par le garde-fou record du monde
    // (0:00 est toujours < n'importe quel record réel). data-record-efface
    // sur wrap distingue explicitement "l'utilisateur veut supprimer ce
    // record" de "l'utilisateur a saisi 0:00" — retiré dès que la roulette
    // est de nouveau manipulée (listener ci-dessus), donc revenir sur la
    // roulette après un clic Effacer accidentel annule l'effacement.
    //
    // NOTE : le clic sur ce bouton appelle définirValeur(0) sur chaque
    // colonne, ce qui déclenche onSelect -> declencherInput -> dispatch
    // 'input' -> le listener ci-dessus retirerait immédiatement l'attribut
    // qu'on vient de poser. On pose donc recordEfface APRÈS avoir
    // repositionné les roulettes, pas avant.
    const btnEffacer = document.createElement("button");
    btnEffacer.type = "button";
    btnEffacer.className = "btn-effacer-record";
    btnEffacer.textContent = "✕";
    btnEffacer.title = "Effacer ce record";
    btnEffacer.style.cssText = "flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--border-soft);color:var(--text-muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;";
    btnEffacer.addEventListener("click", () => {
      const rouletteRef = roulettesActivesReglages[idPrefix];
      if (rouletteRef) {
        rouletteRef.h?.definirValeur(0, false);
        rouletteRef.m?.definirValeur(0, false);
        rouletteRef.s?.definirValeur(0, false);
      }
      hInp.value = "0"; mInp.value = "0"; sInp.value = "0";
      wrap.dataset.recordEfface = "true";
    });

    // Bouton "✓ Valider" (31/07/2026, remplace l'auto-sauvegarde par
    // debounce sur demande de Laurent : "la validation est toujours trop
    // rapide" — même avec le correctif du bug de listener manquant, un
    // debounce de 400ms validait chaque changement de colonne sans que
    // l'utilisateur ait fini d'ajuster les 3 valeurs h/m/s, et fermait la
    // carte en cours de saisie). Regroupé verticalement au-dessus du
    // bouton Effacer, dans le même wrapper — la sauvegarde ne se déclenche
    // plus QUE sur un clic explicite ici, jamais automatiquement pendant
    // le défilement de la roulette.
    const btnValider = document.createElement("button");
    btnValider.type = "button";
    btnValider.className = "btn-valider-record";
    btnValider.textContent = "✓";
    btnValider.title = "Valider ce record";
    btnValider.style.cssText = "flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--border-accent, var(--accent));background:rgba(var(--accent-rgb),0.13);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin-bottom:4px;";

    const boutonsValidation = document.createElement("div");
    boutonsValidation.style.cssText = "display:flex;flex-direction:column;align-items:center;flex-shrink:0;";
    boutonsValidation.appendChild(btnValider);
    boutonsValidation.appendChild(btnEffacer);
    wrap.appendChild(boutonsValidation);

    // Positionnement différé de la roulette au bon moment (31/07/2026,
    // bug corrigé après plusieurs tentatives) — au tout premier rendu
    // d'un écran (mais pas aux suivants), le chiffre actif restait
    // bloqué visuellement sur "00" malgré des données correctes en
    // interne : scrollTop assigné ne prenait pas effet. Ni setTimeout(0),
    // ni un double requestAnimationFrame, ni un délai fixe de 100ms
    // n'ont suffi à résoudre ça de façon fiable — un appel manuel via la
    // console, après quelques secondes, fonctionnait pourtant toujours,
    // ce qui écartait un problème de logique du composant lui-même.
    // Résolu en vérifiant une vraie condition avant d'agir plutôt qu'en
    // devinant un délai : l'élément doit être RÉELLEMENT visible
    // (offsetParent non null, signe qu'aucun ancêtre n'est display:none
    // et que l'élément est bien attaché au document) — condition
    // vérifiée en boucle toutes les 16ms, jusqu'à confirmation (abandon
    // après 2s si jamais atteinte, cas anormal qui ne devrait pas se
    // produire en pratique).
    // CORRECTIF (01/08/2026, bug signalé par Laurent : roulette de record
    // invisible/vide dans la section "Records personnels", un groupe
    // accordéon) — diagnostic en direct (console) a montré un cas
    // inattendu : offsetParent restait null indéfiniment sur cet élément
    // alors que getBoundingClientRect() renvoyait des dimensions et une
    // position parfaitement normales (largeur/hauteur non nulles,
    // document.body.contains() true, toute la chaîne d'ancêtres avec
    // display/visibility corrects). La cause exacte de cette divergence
    // offsetParent vs getBoundingClientRect dans ce contexte précis
    // (accordéon) n'a pas pu être identifiée malgré plusieurs
    // vérifications ciblées (position, content-visibility, doublon de
    // nœud, élément détaché — toutes écartées) — remplacé par un test basé
    // sur getBoundingClientRect().width > 0, seul critère confirmé fiable
    // dans ce cas par des tests directs en console. offsetParent reste en
    // repli secondaire (OU logique) pour ne rien casser ailleurs où
    // l'ancien test fonctionnait déjà correctement.
    (function attendreEtInitialiser(tentative) {
      const conteneurTest = document.getElementById(idPrefix + '-rouletteM');
      const visible = conteneurTest && (conteneurTest.offsetParent !== null || conteneurTest.getBoundingClientRect().width > 0);
      if (visible) {
        window.initRouletteHMS(idPrefix, h ?? 0, m ?? 0, s ?? 0, heuresMax);
        return;
      }
      if (tentative > 120) return; // ~2s, abandon — cas anormal (groupe accordéon fermé au chargement : normal, cf. callback onOuverture qui construit la roulette à la demande dans ce cas)
      setTimeout(() => attendreEtInitialiser((tentative ?? 0) + 1), 16);
    })(0);

    return wrap;
  };

  // Auto-sauvegarde d'un record personnel individuel (31/07/2026, demande
  // de Laurent : "les RP devraient être autovalidés dès qu'ils sont
  // saisis") — même logique de garde-fou record du monde que l'ancien
  // handler saveBtn (ci-dessous).
  //
  // Le badge "record_battu" a été RETIRÉ d'ici le 02/08/2026 (bug signalé
  // par Laurent : le badge apparaissait alors qu'aucune course n'avait
  // été validée dans le plan). Il ne se déclenche désormais que lors de
  // la validation d'un vrai résultat de course (cf. resultatCard,
  // renderCourse) — une simple saisie/correction manuelle de record
  // personnel dans Réglages ne doit jamais compter comme "record battu"
  // au sens du badge, même si techniquement le temps saisi est meilleur
  // que l'ancien (ça peut être une simple correction d'erreur de saisie,
  // ou un ancien record retrouvé après coup, pas une performance
  // "célébrable" au moment de la saisie).
  function sauvegarderUnRecord(dist) {
    profilCoureur.records = profilCoureur.records || {};
    const hInp = document.getElementById("rec-temps-"+dist+"-h");
    const mInp = document.getElementById("rec-temps-"+dist+"-m");
    const sInp = document.getElementById("rec-temps-"+dist+"-s");
    const dateInp = document.getElementById("rec-date-"+dist);
    const wrapRecord = document.getElementById("rec-temps-"+dist+"-wrap");
    const estEfface = wrapRecord?.dataset.recordEfface === "true";
    const tempsFormate = estEfface
      ? null
      : ((hInp || mInp || sInp) ? window.formaterHMSEnTempsRecord(hInp?.value, mInp?.value, sInp?.value) : null);

    if (tempsFormate) {
      try {
        const secondesSaisies = parseTimeToSeconds(tempsFormate);
        const recordMonde = RECORDS_MONDE_SECONDES[dist];
        if (recordMonde && secondesSaisies < recordMonde) {
          alert(`Temps plus rapide que le record du monde actuel sur : ${dist} — non enregistré, vérifie ta saisie.`);
          return; // ne sauvegarde pas, laisse la roulette dans son état actuel
        }
      } catch (e) { /* format de temps invalide, ignoré ici — non bloquant pour ce garde-fou précis */ }
    }

    if (tempsFormate) {
      profilCoureur.records[dist] = { temps: tempsFormate, date: dateInp?.value || null };
    } else {
      profilCoureur.records[dist] = null;
    }
    sauvegarderProfilCoureur();

    // CORRECTIF (31/07/2026, bug signalé par Laurent : "le temps ne
    // s'enregistre pas") — la sauvegarde fonctionnait bien en interne
    // (profilCoureur.records mis à jour, sauvegarderProfilCoureur()
    // appelée), mais rien ne rafraîchissait la carte compacte affichée
    // (le résumé temps/date construit dans recordsSection) : sans ce
    // render(), l'ancien ancien état restait visible à l'écran jusqu'à
    // ce que l'utilisateur navigue ailleurs et revienne, donnant
    // l'impression trompeuse que rien n'avait été enregistré.
    render();
  }

  const recordsSection = el("div",{style:{marginBottom:"16px"}},
    el("div",{class:"label"},"🏅 Records personnels"),
    (()=>{
      // Grille 2x2 (31/07/2026, simplifiée sur demande de Laurent après un
      // premier essai avec carte résumé cliquable : "on peut peut-être
      // mettre que la roulette et la date saisissable et pas la valeur en
      // fixe maintenant") — chaque distance affiche directement sa
      // roulette + son champ date, sans étape de clic intermédiaire pour
      // révéler l'édition.
      const grille = document.createElement("div");
      grille.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:10px;";

      ["5K","10K","Semi","Marathon"].forEach((dist) => {
        const rec = profilCoureur.records?.[dist];
        const carteWrap = document.createElement("div");
        carteWrap.style.cssText = "background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;";

        const labelDist = document.createElement("div");
        labelDist.style.cssText = "font-size:13px;color:var(--text-muted);margin-bottom:6px;text-align:center;";
        labelDist.textContent = dist;
        carteWrap.appendChild(labelDist);

        const champsHMS = window.creerChampsTempsHMS("rec-temps-"+dist, rec?.temps);
        champsHMS.style.justifyContent = "center";
        const dateInp = document.createElement("input");
        dateInp.type = "date"; dateInp.id = "rec-date-"+dist;
        dateInp.value = rec?.date || "";
        dateInp.style.cssText = "background:var(--border-soft);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text-muted);font-size:13px;width:100%;box-sizing:border-box;margin-top:8px;";
        // Ne sauvegarde pas immédiatement au changement (31/07/2026,
        // validation explicite uniquement) — la date attend elle aussi le
        // clic sur "✓ Valider", lue directement depuis dateInp.value au
        // moment de sauvegarderUnRecord().
        carteWrap.appendChild(champsHMS); carteWrap.appendChild(dateInp);

        grille.appendChild(carteWrap);

        // Validation explicite (31/07/2026) — la sauvegarde ne se
        // déclenche que sur un clic explicite du bouton "✓ Valider" (cf.
        // creerChampsTempsHMS, juste au-dessus du bouton Effacer), jamais
        // automatiquement pendant le défilement de la roulette.
        const btnValiderRecord = champsHMS.querySelector(".btn-valider-record");
        if (btnValiderRecord) {
          btnValiderRecord.addEventListener("click", avecRetourTactile(() => sauvegarderUnRecord(dist)));
        }
        // Bouton "Effacer" — marque juste l'état "effacé" visuellement
        // (cf. creerChampsTempsHMS, wrap.dataset.recordEfface), la vraie
        // suppression n'est persistée qu'au clic explicite sur "✓ Valider"
        // ensuite. Son comportement de marquage reste câblé dans
        // creerChampsTempsHMS, rien à faire de plus ici.
      });

      const note = document.createElement("p");
      note.className = "muted"; note.style.cssText = "font-size:13px;margin-top:10px;margin-bottom:0;";
      note.textContent = "Ajuste le temps, puis valide avec ✓.";

      const conteneurGlobal = document.createElement("div");
      conteneurGlobal.appendChild(grille);
      conteneurGlobal.appendChild(note);
      return conteneurGlobal;
    })(),
  );


    // Réglage source de données par défaut (docs/source-donnees-seances.md) —
    // n'est qu'une préférence d'affichage sur la carte du jour, pas un mode
    // exclusif : la correction manuelle reste toujours possible ensuite,
    // et le prédicteur agrège les deux sources sans hiérarchie (section 2).
    const DATA_SOURCE_OPTS = [
      { id:"strava", label:"Strava", desc:"Synchro auto, allures et FC détaillées", icon:"🟠", available:true },
      { id:"manuel", label:"Saisie manuelle", desc:"Tu entres allure et FC toi-même après chaque séance", icon:"✏️", available:true },
      { id:"montre", label:"Garmin, Coros, Polar…", desc:"Bientôt disponible", icon:"⌚", available:false },
      // Renommé "Import GPX" -> "Import FIT" (18/07/2026, v2.15) : un GPX pur
      // n'a pas de laps, donc pas de décomposition possible des séances
      // qualité (échauffement/effort/récup) — .fit contient nativement ces
      // laps, mêmes principe que Strava (getLapsAffichage/getEffortLaps).
      // Activée (available:true) : le composant d'upload correspondant est
      // ajouté ci-dessous (importFitSection).
      { id:"fit", label:"Import FIT", desc:"Fichier exporté de ta montre, un par un", icon:"📁", available:true },
    ];
    const dataSourceSection = el("div",{style:{marginBottom:"24px"}},
      el("div",{class:"label"},"Source de données"),
      card(
        ...DATA_SOURCE_OPTS.map((opt,i)=>{
          const actif = dataSource===opt.id;
          const row = el("div",{style:{
            display:"flex",alignItems:"center",gap:"12px",
            padding:"10px 4px",
            marginTop:i>0?"6px":"0",
            borderRadius:"8px",
            background:actif?"rgba(var(--accent-rgb),0.1)":"transparent",
            border:`1px solid ${actif?"var(--accent)":"transparent"}`,
            cursor:opt.available?"pointer":"default",
            opacity:opt.available?"1":"0.5"
          }},
            el("span",{style:{fontSize:"18px"}},opt.icon),
            el("div",{style:{flex:"1"}},
              el("div",{style:{color:"var(--text)",fontSize:"14px",fontWeight:actif?"700":"400"}},opt.label),
              el("div",{class:"muted",style:{fontSize:"12px"}},opt.desc)
            ),
            !opt.available?el("span",{style:{fontSize:"11px",color:"var(--text-muted)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"6px",padding:"2px 6px"}},"À venir"):null
          );
          if (opt.available) {
            row.addEventListener("click", avecRetourTactile(()=>{
              dataSource = opt.id;
              save(clePourPlan("lk_data_source"), dataSource);
              render();
            }));
          }
          return row;
        }),
        el("div",{class:"muted",style:{fontSize:"12px",marginTop:"10px",paddingTop:"10px",borderTop:"1px solid var(--border)"}},
          "Change à tout moment. Le suivi du plan fonctionne dans tous les cas — cette option affine surtout l'estimation 10K. La synchro automatique Strava ne se déclenche que si cette source est sélectionnée ici (le bouton \"Synchroniser avec Strava\" ci-dessous reste toujours disponible manuellement)."
        )
      )
    );

    const stravaSection=el("div",{style:{marginBottom:"24px"}},
    el("div",{class:"label"},"Strava"),
    stravaToken
      ?card(
          el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"12px"}},
            el("div",{style:{width:"8px",height:"8px",borderRadius:"50%",background:"var(--warn)",flexShrink:"0"}}),
            // Ajouté le 18/07/2026 (bug signalé par Laurent) : ce bloc
            // (Réglages) n'affichait jamais la date de dernière synchro,
            // contrairement au bloc équivalent du dashboard (ligne ~3039,
            // syncAgo/syncAgoStr) qui l'affiche déjà correctement — deux
            // blocs distincts et redondants pas maintenus en cohérence.
            // Réutilise le même calcul que le dashboard plutôt que d'en
            // écrire un deuxième.
            el("div",{style:{color:"var(--warn)",fontSize:"15px",fontWeight:"600"}},
              "Connecté · "+stravaActivities.length+" activité"+(stravaActivities.length!==1?"s":"")
              +(lastSyncTime > 0 ? (
                  (()=>{ const m = Math.round((Date.now()-lastSyncTime)/60000);
                    return m < 1 ? " · synchro à l'instant" : m < 60 ? " · synchro il y a "+m+" min" : " · synchro il y a "+Math.round(m/60)+"h";
                  })()
                ) : "")
            )
          ),
          syncMsg?el("div",{style:{fontSize:"14px",color:syncMsg.startsWith("✅")?"var(--accent2)":"var(--text2)",marginBottom:"10px",padding:"8px 10px",background:"var(--border-soft)",borderRadius:"8px"}},syncMsg):null,
          stravaAuthInvalide
            ?el("a",{href:"/api/strava/auth",style:{display:"block",background:"rgba(var(--warn-rgb),0.13)",border:"1px solid rgba(var(--warn-rgb),0.33)",borderRadius:"10px",padding:"11px",cursor:"pointer",color:"var(--warn)",fontWeight:"700",fontSize:"15px",marginBottom:"8px",textAlign:"center",textDecoration:"none",display:"block"}},
              "🔄 Reconnecter Strava")
            :null,
          el("button",{
            style:{width:"100%",background:syncing?"var(--bg)":"rgba(var(--warn-rgb),0.13)",border:"1px solid rgba(var(--warn-rgb),0.33)",borderRadius:"10px",padding:"11px",cursor:"pointer",color:"var(--warn)",fontWeight:"700",fontSize:"15px",marginBottom:"8px"},
            feedback:true,
            onClick:()=>{ if(!syncing) syncStrava(true); }
          },syncing?"⏳ "+syncMsg:"🔄 Synchroniser avec Strava"),
          el("button",{style:{background:"none",border:"none",color:"var(--text2)",fontSize:"14px",cursor:"pointer",padding:"0",marginTop:"12px",paddingTop:"12px",borderTop:"1px solid var(--border)"},
            onClick:()=>{ stravaToken=null;stravaRefresh=null;stravaExpires=0;stravaActivities=[];window.stravaActivities=[];save("lk_strava_token",null);save("lk_strava_refresh",null);save("lk_strava_expires",0);save("lk_strava_activities",[]);render(); }
          },"🔓 Déconnecter Strava")
        )
      :el("a",{href:"/api/strava/auth",style:{display:"block",background:"rgba(var(--warn-rgb),0.13)",border:"1px solid rgba(var(--warn-rgb),0.33)",borderRadius:"10px",padding:"12px 16px",color:"var(--warn)",fontWeight:"700",fontSize:"15px",textAlign:"center",textDecoration:"none"}},"🔗 Connecter Strava")
  );

  // ── Import FIT (v2.15, 18/07/2026) ────────────────────────────────────
  // Affichée seulement si dataSource === "fit" (pas un mode permanent visible
  // en dur comme stravaSection — évite de montrer un contrôle d'upload à

  const urlParamsAbonnement = new URLSearchParams(window.location.search);

  if (retourStripeSucces && !window.__abonnementCacheInvalideApresCheckout__) {
    window.__abonnementCacheInvalideApresCheckout__ = true; // ne le refaire qu'une fois
    window.__abonnementStatutCache__ = undefined; // force le refetch ci-dessous
    urlParamsAbonnement.delete("stripe");
    const nouvelleUrl = window.location.pathname + (urlParamsAbonnement.toString() ? "?"+urlParamsAbonnement.toString() : "");
    window.history.replaceState({}, "", nouvelleUrl);
  }
  if (typeof window.__abonnementStatutCache__ === "undefined") {
    window.__abonnementStatutCache__ = null;
    (async () => {
      if (!window.__UTILISATEUR__?.id || !LkAuth?.supabase) { window.__abonnementStatutCache__ = 'none'; return; }

        const { data, error } = await LkAuth.supabase

          .maybeSingle();

      } catch (e) {
        console.warn("Lecture abonnement échouée :", e.message);
        window.__abonnementStatutCache__ = 'none';
      }
    })();
  }
  const abonnementStatutActuel = window.__abonnementStatutCache__;
  async function demarrerCheckout(plan) {
    if (!LkAuth?.supabase) return;
    const boutonClique = document.getElementById("abonnement-btn-"+plan);
    if (boutonClique) { boutonClique.disabled = true; boutonClique.textContent = "Chargement..."; }
    try {
      const { data: { session } } = await LkAuth.supabase.auth.getSession();
      const token = session?.access_token;
      if (!token) { alert("Merci de te reconnecter."); return; }
      const resp = await fetch("/api/stripe-checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ plan })
      });
      const data = await resp.json();
      if (data.success && data.url) {
        window.open(data.url, "_blank");
      } else {
        alert(data.message || "Impossible de démarrer le paiement.");
      }
    } catch (e) {
      console.warn("Erreur démarrage Checkout :", e.message);

  // CORRECTIF MANUEL TEMPORAIRE (07/08/2026, demande explicite de

  // au résumé de préparation (onglet Course), qui relit stravaActivities
  // en direct à chaque affichage, ce cumul est un compteur PERSISTANT —
  // sans un vrai mécanisme de recalcul automatique (non implémenté,

  // l'instant plutôt qu'un chantier de recalcul systématique à chaque
  // synchro), ce bouton permet de le resynchroniser manuellement à la
  // demande. Reconstruit kmComptesParUid ET kmCumulesTotal depuis zéro, à
  // partir des SEULES séances validées du PLAN ACTUEL (pas tous plans
  // confondus comme le veut le badge en principe — limitation actée avec

  // respectifs depuis Supabase, un vrai chantier à part). Bouton
  // volontairement discret (style secondaire, pas d'icône), à retirer
  // si un vrai mécanisme de recalcul automatique est développé plus tard.
  const recalcKmSection = el("div",{style:{marginBottom:"24px"}},
    el("div",{class:"label"},"🔧 Maintenance"),
    el("div",{style:{background:"var(--bg)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"10px",padding:"14px"}},
      el("div",{class:"muted",style:{fontSize:"12px",marginBottom:"10px",lineHeight:"1.5"}},
        "Si le badge \"km cumulés\" (Stats/Badges) ne correspond plus à tes séances réellement validées, recalcule-le ici — tous plans confondus."
      ),
      el("button",{style:{width:"100%",background:"var(--border-soft)",border:"1px solid var(--border)",borderRadius:"8px",padding:"10px",color:"var(--text)",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
        onClick: async (e)=>{
          if (!confirm("Recalculer le badge km cumulés à partir de TOUS tes plans (celui-ci et les précédents) ? Cette action peut prendre quelques secondes.")) return;
          const btn = e.target;
          const texteOriginal = btn.textContent;
          btn.disabled = true; btn.textContent = "Calcul en cours…";
          try {
            // CORRECTIF (07/08/2026, v2 — évolution demandée par Laurent
            // après la v1 limitée au plan actuel) — le badge est en
            // principe "tous plans confondus" (cf. commentaire sur
            // recalculerKmComptesPourUid, décision du 05/08/2026), donc ce
            // recalcul doit maintenant reparcourir TOUS les plans du
            // compte, pas seulement celui affiché. Le plan ACTUEL est
            // traité à partir des variables déjà en mémoire (statuses/
            // manualPerf/ALL_SESSIONS), garanties à jour même si pas
            // encore synchronisées vers Supabase — les AUTRES plans sont
            // lus directement depuis plan_donnees (Supabase), sans jamais
            // passer par precharger()/localStorage ni modifier
            // window.__PLAN_BRUT__, pour ne jamais perturber l'affichage
            // ou l'état de la session en cours. stravaActivities reste la
            // même variable globale pour tous les plans (jamais préfixée
            // par plan), donc réutilisable telle quelle.
            let totalGlobal = 0;
            let nouveauKmComptesParUidPlanActuel = {};

            ALL_SESSIONS.forEach(s => {
              const statut = statuses[s.uid] || "—";
              if (statut !== "✅" && statut !== "⚠️" && statut !== "❌") return;
              let km = 0;
              if (manualPerf[s.uid]?.distance) {
                km = manualPerf[s.uid].distance;
              } else {
                const run = getStravaRunSiPasManuel(s.date, s.uid);
                if (run?.distance) km = run.distance / 1000;
              }
              if (km > 0) {
                nouveauKmComptesParUidPlanActuel[s.uid] = km;
                totalGlobal += km;
              }
            });

            const tousLesPlans = window.__UTILISATEUR__?.id
              ? await LkSync.chargerPlansSupabase(window.__UTILISATEUR__.id)
              : [];
            const autresPlans = tousLesPlans.filter(p => p.id && p.id !== window.__PLAN_BRUT__?.id);

            for (const plan of autresPlans) {
              try {
                const { data, error } = await LkAuth.supabase
                  .from("plan_donnees")
                  .select("data")
                  .eq("plan_id", plan.id)
                  .maybeSingle();
                if (error || !data?.data) continue;
                const statutsAutrePlan = data.data.lk_statuses || {};
                const manualPerfAutrePlan = data.data.lk_manual_perf || {};
                const planTraduit = window._v1BridgeModule.traduirePlanVersFormatV1(plan);
                if (!planTraduit?.length) continue;
                planTraduit.forEach(semaine => {
                  semaine.sessions.forEach((s, i) => {
                    const uid = `${semaine.week}-${i}`;
                    const statut = statutsAutrePlan[uid] || "—";
                    if (statut !== "✅" && statut !== "⚠️" && statut !== "❌") return;
                    let km = 0;
                    if (manualPerfAutrePlan[uid]?.distance) {
                      km = manualPerfAutrePlan[uid].distance;
                    } else if (!manualPerfAutrePlan[uid]) {
                      const run = stravaActivities.find(a =>
                        (a.type==="Run"||a.sport_type==="Run") && a.start_date_local?.slice(0,10) === s.date
                      );
                      if (run?.distance) km = run.distance / 1000;
                    }
                    if (km > 0) totalGlobal += km;
                  });
                });
              } catch (err) {
                console.warn("Recalcul badge : lecture d'un plan précédent échouée, ignoré :", plan.id, err.message);
              }
            }

            kmComptesParUid = nouveauKmComptesParUidPlanActuel;
            save(clePourPlan("lk_km_comptes_par_uid"), kmComptesParUid);
            profilCoureur.kmCumulesTotal = Math.round(totalGlobal * 10) / 10;
            sauvegarderProfilCoureur();
            alert("Badge recalculé (tous plans confondus) : "+profilCoureur.kmCumulesTotal+" km.");
            render();
          } catch (err) {
            alert("Le recalcul a échoué : "+err.message);
            btn.disabled = false; btn.textContent = texteOriginal;
          }
        }
      },"Recalculer le badge km cumulés")
    )

  const pdfSection=el("div",{style:{marginBottom:"24px"}},

  // Doublon corrigé (31/07/2026, signalé pendant la restructuration en

function compressActivities(activities) {
  return activities.filter(a => a.type === "Run").map(a => {
    const effortLaps = (() => {
      if (!a.laps?.length) return undefined;
      const speeds = a.laps.map(l => l.average_speed).sort((x,y) => x-y);
      const p70 = speeds[Math.floor(speeds.length * 0.70)];
      return a.laps.filter(l => l.average_speed >= p70 && l.average_speed > 0 && (1000/l.average_speed) < 360)
        .map(l => ({ average_speed: l.average_speed, distance: l.distance, average_heartrate: l.average_heartrate }));
    })();
    return {
      id_str: a.id_str,
      type: a.type,
      start_date_local: a.start_date_local,
      distance: a.distance,
      moving_time: a.moving_time,
      average_speed: a.average_speed,
      average_heartrate: a.average_heartrate,
      max_heartrate: a.max_heartrate,
      start_latlng: a.start_latlng,
      laps: effortLaps,
    };
  });
}

// STRAVA

async function ensureFreshToken() {
  if (!stravaToken) return false;
  if (Date.now()/1000 < stravaExpires-60) return true;
  try {
    const resp = await fetch("/api/strava/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:stravaRefresh})});
    const data = await resp.json();
    // 20 juillet 2026 : si le refresh_token lui-même est révoqué/invalide
    // côté Strava, /api/strava/refresh répond avec {errors:[...]} sans
    // access_token — jusqu'ici jamais détecté : la fonction affectait quand
    // même stravaToken=undefined et retournait true, faisant échouer l'appel
    // suivant à /api/strava/activities avec la même erreur "access_token
    // invalid" côté Strava, mais après un aller-retour réseau inutile et
    // sans garantie que le message "Connexion Strava expirée" s'affiche de
    // façon fiable. Détecté ici explicitement, même traitement que le cas
    // déjà géré dans syncStrava() (cf. inventaire §18.2).
    if (!data.access_token) {
      stravaAuthInvalide = true;
      return false;
    }
    stravaToken=data.access_token; stravaRefresh=data.refresh_token; stravaExpires=data.expires_at;
    save("lk_strava_token",stravaToken); save("lk_strava_refresh",stravaRefresh); save("lk_strava_expires",stravaExpires);
    return true;
  } catch { return false; }
}
