// Change le palier marche-course d'un plan grand-débutant depuis le
// dashboard (bannière "Prêt·e pour la suite ?" ou section palier permanente,
// 17.4/17.5, 15/07/2026). Corrige un bug latent : l'ancien code lisait
// window.__PLAN_BRUT__.profilOrigine/paramsOrigine, qui n'existent PAS pour
// un plan grand-débutant (généré par generatePlanFormeMarcheCourse dans
// plan-forme.js, lequel ne stocke ni profil ni params d'origine sur le plan
// résultant — cf. §17.1/§17.9 de l'inventaire) — le bouton "Palier suivant"
// plantait donc systématiquement en pratique. Reconstruit profil/params à
// partir des données réellement disponibles : jours d'entraînement déduits
// des séances déjà placées dans le plan courant (assignment), reste du
// profil lu depuis lk_profil_coureur.
async function changerPalierGrandDebutant(nouveauPalierId) {
  const planCourant = window.__PLAN_BRUT__;
  if (!planCourant || planCourant.sousMode !== 'marche-course') return;

  const premiereSemaine = planCourant.semaines?.[0];
  const joursDisponibles = premiereSemaine
    ? Object.keys(premiereSemaine.assignment).map(Number)
    : [1, 3, 5]; // repli raisonnable si jamais aucune semaine n'existe (ne devrait pas arriver)

  let profilStocke;
  try { profilStocke = JSON.parse(localStorage.getItem('lk_profil_coureur')); } catch { profilStocke = null; }

  const profil = {
    niveau: 'grand-debutant',
    anneeNaissance: profilStocke?.anneeNaissance || undefined,
    fcMaxConnue: profilStocke?.fcMax || undefined,
    joursDisponiblesHabituels: joursDisponibles,
    palierMarcheCourse: nouveauPalierId
  };
  const params = {
    dateDebut: planCourant.dateDebut,
    dateCloture: planCourant.dateCloture,
    nbSemainesBloc: planCourant.tailleBlocSemaines
  };

  let nouveauPlan;
  try {
    nouveauPlan = generatePlanForme(profil, params);
  } catch (e) {
    alert("Erreur lors du changement de palier : " + e.message);
    console.error(e);
    return;
  }
  nouveauPlan.id = planCourant.id;
  nouveauPlan.nom = planCourant.nom;
  nouveauPlan.statuses = planCourant.statuses;

  // ── Garde-fou : préserver les séances déjà passées (17/07/2026) ──────────
  // Demande explicite de Laurent : une régénération de plan (changement de
  // palier, ou toute future régénération complète) ne doit JAMAIS modifier
  // le contenu des séances dont la date est déjà passée — même si le nouveau
  // plan généré (nouveauPlan) les définit différemment. Trouvé en pratique
  // le 17/07/2026 : une séance "2×8×30-30" observée dans l'app était devenue
  // "4×30-30" après une régénération antérieure, changeant rétroactivement
  // ce que Laurent avait réellement couru par rapport à ce que l'app affiche
  // désormais avoir été prévu — trompeur pour l'analyse a posteriori (dont
  // le Module 2 du moteur de décision, qui compare la séance réalisée à ce
  // que le plan dit avoir été prévu ce jour-là).
  //
  // Principe : pour chaque semaine du plan, si TOUTES ses séances ont une
  // date strictement antérieure à aujourd'hui, on reprend cette semaine
  // telle qu'elle existait dans planCourant (l'ancien plan), pas celle du
  // nouveauPlan fraîchement généré. Une semaine partiellement passée (ex.
  // semaine en cours) suit le nouveauPlan en entier — un mélange jour par
  // jour au sein d'une même semaine serait plus risqué à maintenir cohérent
  // (numérotation, structure) pour un gain marginal (seuls les jours déjà
  // passés de cette semaine seraient concernés, généralement 0-6 jours).
  // Même calcul de date que déjà utilisé ailleurs pour convertir
  // semaine.semaineNum + jourIndex en date réelle (cf. ~ligne 837,
  // vérifierMeteoPourSeance).
  (function preserverSemainesPassees() {
    const debutCourant = new Date(planCourant.dateDebut + 'T00:00:00Z');
    const aujourdhui = new Date();
    const aujourdhuiStr = new Date(Date.UTC(aujourdhui.getFullYear(), aujourdhui.getMonth(), aujourdhui.getDate())).toISOString().slice(0, 10);

    const semainesCourantesParNum = {};
    (planCourant.semaines || []).forEach(s => { semainesCourantesParNum[s.semaineNum] = s; });

    (nouveauPlan.semaines || []).forEach((semaine, index) => {
      const semaineCourante = semainesCourantesParNum[semaine.semaineNum];
      if (!semaineCourante) return; // semaine nouvelle (au-delà de l'ancien plan) : rien à préserver

      const datesJours = Object.keys(semaineCourante.assignment || {}).map(jourIndex => {
        const d = new Date(debutCourant);
        d.setUTCDate(debutCourant.getUTCDate() + (semaineCourante.semaineNum - 1) * 7 + Number(jourIndex));
        return d.toISOString().slice(0, 10);
      });
      if (datesJours.length === 0) return; // semaine sans séance assignée, rien à comparer

      const toutesPassees = datesJours.every(d => d < aujourdhuiStr);
      if (toutesPassees) {
        // Remplace la semaine du nouveauPlan par celle de l'ancien plan,
        // en gardant semaineNum du nouveauPlan pour la cohérence de
        // numérotation (devrait être identique de toute façon).
        nouveauPlan.semaines[index] = { ...semaineCourante, semaineNum: semaine.semaineNum };
      }
    });
  })();

  window.__PLAN_BRUT__ = nouveauPlan;
  window.__PLAN_GENERE__ = traduirePlanVersFormatV1(window.__PLAN_BRUT__);
  PLAN = window.__PLAN_GENERE__;
  ALL_SESSIONS = recalculerAllSessions();

  // Même pattern de sauvegarde que la clôture de plan (Réglages) : Supabase
  // comme mécanisme principal (§17.11).
  try {
    if (window.__UTILISATEUR__?.id && window.LkSync?.mettreAJourPlanSupabase && window.__PLAN_BRUT__.id) {
      await window.LkSync.mettreAJourPlanSupabase(window.__PLAN_BRUT__.id, window.__PLAN_BRUT__);
    }
  } catch (e) {
    console.warn('Palier changé localement, sauvegarde Supabase échouée :', e.message);
  }
  render();
}

// Rangée de boutons de statut (✅/❌/⚠️/😴), réutilisable — extraite le
// 8 juillet 2026 pour aussi l'utiliser sur la carte "Aujourd'hui" du
// dashboard (Laurent signale qu'il fallait aller dans le détail de semaine
// juste pour valider la séance du jour, pourtant déjà affichée).
// ══════════════════════════════════════════════════════════════════════════════
// TEST SEMI-COOPER — capture du résultat (Mode Forme sans référence, 21/07/2026)
// ══════════════════════════════════════════════════════════════════════════════
// Bloc dédié, volontairement séparé du système manualPerf général (qui gère
// la saisie manuelle récurrente pour toutes les séances qualité d'un plan
// course tout au long de sa durée) — le test semi-Cooper est un événement
// unique par bloc généré sans référence, une seule donnée à capter (distance
// parcourue en 6min), pas besoin de la même infrastructure.
//
// Détection Strava : réutilise getLapsAffichage(activite, structureIntervalles)
// déjà utilisé pour toutes les séances qualité — la structureIntervalles du
// test (1 seul bloc, 1 répétition, dureeRecupSec:0) fait que le lap détecté
// correspond exactement à l'effort de 6min, à condition que l'utilisateur ait
// programmé sa montre en 3 laps manuels (échauffement/effort/retour au calme),
// comme pour toute autre séance qualité.
function renderTestSemiCooperRow(uid, seance, stravaRun) {
  if (statuses[uid] && statuses[uid] !== '—') return null; // déjà validé, plus rien à afficher ici

  const effortLaps = stravaRun ? getLapsAffichage(stravaRun, seance.structureIntervalles) : [];
  const distanceDetectee = effortLaps.length === 1 ? Math.round(effortLaps[0].distance) : null;

  const validerResultat = (distanceMetres) => {
    if (!distanceMetres || distanceMetres < 200 || distanceMetres > 3000) {
      alert("Distance invalide — vérifie la valeur (attendu entre 200m et 3000m environ pour 6 minutes de course).");
      return;
    }
    const { refTimeSeconds, refDistanceKm, vmaKmh } = estimerReferenceDepuisSemiCooper(distanceMetres);
    // Stocké préfixé par plan (comme le reste des données de plan), lu
    // ensuite par la génération des semaines 2-4 (étape 4 du chantier).
    save(clePourPlan("lk_resultat_test_forme"), { refTimeSeconds, refDistanceKm, vmaKmh, distanceMetres, dateTest: today() });
    statuses[uid] = "✅";
    save(clePourPlan("lk_statuses"), statuses);
    ALL_SESSIONS = recalculerAllSessions(); // cf. correctif 26/07/2026 (bug badge 😴)
    render();
  };

  if (distanceDetectee) {
    return el("div",{style:{background:"rgba(var(--accent-rgb),0.07)",border:"1px solid rgba(var(--accent-rgb),0.2)",borderRadius:"10px",padding:"12px",marginTop:"8px"}},
      el("div",{style:{fontSize:"14px",color:"var(--text)",marginBottom:"8px"}},
        "📍 Détecté sur Strava : "+distanceDetectee+"m parcourus en 6min"
      ),
      el("button",{style:{width:"100%",background:"var(--accent)",border:"none",borderRadius:"8px",padding:"10px",color:"var(--bg)",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
        onClick: () => validerResultat(distanceDetectee)
      },"Confirmer ce résultat")
    );
  }

  // Repli manuel — pas de Strava, ou détection ratée (structure non
  // programmée correctement sur la montre, activité absente, etc.)
  const inputDistance = el("input",{type:"number",id:"input-distance-test-vma",name:"input-distance-test-vma",placeholder:"ex: 1400",style:{
    flex:"1",background:"var(--border-soft)",border:"1px solid var(--border)",borderRadius:"8px",
    padding:"9px 10px",color:"var(--text)",fontSize:"15px"
  }});

  return el("div",{style:{background:"var(--border-soft)",borderRadius:"10px",padding:"12px",marginTop:"8px"}},
    el("div",{style:{fontSize:"13px",color:"var(--text-muted)",marginBottom:"8px"}},
      "Distance parcourue en 6 minutes (mètres)"
    ),
    el("div",{style:{display:"flex",gap:"8px"}},
      inputDistance,
      el("button",{style:{background:"var(--accent)",border:"none",borderRadius:"8px",padding:"9px 16px",color:"var(--bg)",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
        onClick: () => validerResultat(parseInt(inputDistance.value, 10))
      },"Valider")
    )
  );
}

function renderStatusRow(uid, dateSeance) {
  const wrapper = el("div",{style:{display:"flex",flexDirection:"column",gap:"8px",marginTop:"4px",width:"100%"}});
  const estFuture = dateSeance && dateSeance > today();
  // Correctif 26/07/2026 (demande Laurent) : une séance future n'affiche
  // plus du tout la rangée de boutons statut (auparavant affichée
  // désactivée/grisée). Le bouton "—" n'a plus besoin de rester cliquable
  // pour "annuler un statut mal placé après déplacement" — vérifié que
  // getAvailableSlots() bloque déjà tout swap impliquant une séance ayant
  // un vrai statut posé (aTraceActivite), dans les deux sens : ce cas ne
  // peut donc jamais se produire.
  if (estFuture) {
    wrapper.appendChild(el("div",{style:{fontSize:"12px",color:"var(--text-muted)"}},"📅 Séance à venir — disponible le jour J"));
    return wrapper;
  }
  const statusRow=el("div",{style:{display:"flex",gap:"6px",flexWrap:"nowrap",width:"100%"}});
  const boutons = [];
  const majApparenceBoutons = () => {
    const cur = statuses[uid]||"—";
    boutons.forEach(({b, opt}) => {
      const actif = cur===opt;
      // Fond renforcé le 22/07/2026 (demande Laurent : bouton sélectionné
      // pas assez visible) — 33 (≈20% opacité) était trop discret,
      // notamment sur mobile en plein soleil. Couleur pleine + texte clair
      // pour un vrai contraste, cohérent avec le style déjà utilisé ailleurs
      // dans l'app pour les états "actif" (ex. checklist course).
      b.style.background = actif ? SCOLORS[opt] : "var(--border-soft)";
      b.style.border = `1px solid ${actif ? SCOLORS[opt] : "var(--border)"}`;
      b.style.color = actif ? "#F8FAFC" : "var(--text-muted)";
      b.style.fontWeight = actif ? "700" : "400";
    });
  };
  SOPTS.forEach(opt=>{
    const cur=statuses[uid]||"—";
    const b=el("button",{style:{flex:"1",background:cur===opt?SCOLORS[opt]:"var(--border-soft)",border:`1px solid ${cur===opt?SCOLORS[opt]:"var(--border)"}`,borderRadius:"8px",padding:"8px 0",cursor:"pointer",color:cur===opt?"#F8FAFC":"var(--text-muted)",fontSize:"32px",fontWeight:cur===opt?"700":"400"}},opt==="—"?"–":opt);
    boutons.push({ b, opt });
    b.addEventListener("click",avecRetourTactile(()=>{
      statuses[uid]=opt; save(clePourPlan("lk_statuses"),statuses);
      // Bug corrigé le 26/07/2026 (signalé par Laurent : badge 😴 restait
      // affiché sur des séances passées pourtant déjà validées ✅/⚠️/❌,
      // dans la vue Semaine). Cause identifiée via log de debug :
      // ALL_SESSIONS (et son champ statutEffectif calculé par
      // recalculerAllSessions) n'était JAMAIS recalculée à cet endroit —
      // seul render() était rappelé, qui redessine depuis la valeur déjà en
      // mémoire sans jamais la rafraîchir. Le "😴" auto-inféré (séance
      // passée sans statut saisi, cf. recalculerAllSessions) restait donc
      // figé même après avoir cliqué un vrai statut, jusqu'au prochain des
      // rares recalculs complets (changement de plan, swap...). Recalcul
      // immédiat ici, avant tout render(), pour que statutEffectif reflète
      // toujours le tout dernier clic.
      ALL_SESSIONS = recalculerAllSessions();
      // Bug corrigé le 8 juillet 2026 : setTimeout(render, 2500) gelait
      // TOUT l'affichage de l'app pendant 2.5s, pas seulement le repli de
      // cette carte (render() reconstruit toute la vue). Corrigé : met à
      // jour immédiatement l'apparence des boutons de CETTE rangée
      // uniquement (sans render() global), puis planifie le vrai render()
      // complet (qui déclenchera le repli de la carte via isDoneSession)
      // après le délai — seul le repli est retardé, pas le reste de l'app.
      majApparenceBoutons();
      // Bug corrigé le 17/07/2026 (signalé par Laurent) : le message coach
      // restait figé sur la description de la séance générée au premier
      // chargement du jour (coachDate===today() empêche tout refetch, cf.
      // fetchCoachMsg), même après avoir marqué la séance du jour comme
      // faite plus tard dans la journée — le coach continuait de parler
      // d'une séance déjà validée, ou de la séance clé du lendemain calculée
      // avant validation. Ne concerne QUE la séance d'AUJOURD'HUI (dateSeance
      // === today()) — corriger le statut d'une séance passée ne doit pas
      // redéclencher un appel coach inutile.
      if (dateSeance === today()) {
        coachMsg = null; coachDate = "";
        save(clePourPlan("lk_coach_msg"), null);
        save(clePourPlan("lk_coach_date"), "");
      }
      if (opt==="✅"||opt==="⚠️") { setTimeout(()=>{ render(); fetchCoachMsg(); }, 2500); }
      else { render(); if (dateSeance === today()) fetchCoachMsg(); }
    }));
    statusRow.appendChild(b);
  });
  wrapper.appendChild(statusRow);
  // Pastille d'ambiguïté (24/07/2026) — plusieurs activités Strava ce jour,
  // aucune validation automatique tant que le coureur n'a pas choisi
  // laquelle associer (cf. obtenirActivitesAmbigues, showSessionMenu).
  // N'affiche rien pour une séance déjà validée manuellement (statut posé
  // indépendamment de Strava) — l'ambiguïté ne concerne que la validation
  // automatique, pas une saisie déjà faite par ailleurs.
  if (!statuses[uid] || statuses[uid]==="—") {
    const { ambigu } = obtenirActivitesAmbigues(uid, dateSeance);
    if (ambigu) {
      wrapper.appendChild(el("div",{style:{fontSize:"12px",color:"var(--warn)",display:"flex",alignItems:"center",gap:"4px"}},
        "❓ Plusieurs activités ce jour — choisis la bonne dans le menu de la séance"
      ));
    }
  }
  // Sélecteur RPE unifié — 17/07/2026, cf. déclaration de sessionRpe et
  // RPE_OPTIONS plus haut. Visible uniquement si un statut "la séance a eu
  // lieu" est déjà posé (✅/⚠️/❌) — noter un ressenti n'a pas de sens sur
  // "—" (non renseigné) ni "😴" (repos/sauté, aucun effort à ressentir).
  const statutActuel = statuses[uid] || "—";
  let rpeWrapperStatut = null;
  if (["✅", "⚠️", "❌"].indexOf(statutActuel) !== -1) {
    let rpeValStatut = sessionRpe[uid] || null;
    const rpeRowStatut = el("div",{style:{display:"flex",gap:"6px",width:"100%",flexWrap:"nowrap"}});
    // Libellé + référence CR-10 de l'option sélectionnée, affiché sous le
    // rang de boutons — remplace le tooltip natif (attribut title), qui ne
    // se déclenche jamais sur mobile faute de survol souris (signalé par
    // Laurent le 19/07/2026). Vide tant qu'aucune option n'est choisie.
    const rpeLabelStatut = el("div",{style:{fontSize:"12px",color:"var(--text-muted)",marginTop:"4px",minHeight:"16px"}});
    const rebuildRpeStatut = () => {
      rpeRowStatut.innerHTML = "";
      const optionActuelle = RPE_OPTIONS.find(o=>o.v===rpeValStatut);
      rpeLabelStatut.textContent = optionActuelle ? optionActuelle.label : "";
      RPE_OPTIONS.forEach(o=>{
        // Fond renforcé le 22/07/2026 (même correctif que renderStatusRow :
        // 0.13 d'opacité trop discret) — couleur pleine sur sélection.
        const rb = el("button",{title:o.label,style:{
          flex:"1",padding:"10px 0",fontSize:"18px",cursor:"pointer",
          background:rpeValStatut===o.v?"var(--warn)":"var(--border-soft)",
          border:`1px solid ${rpeValStatut===o.v?"var(--warn)":"var(--border)"}`,borderRadius:"8px"
        }}, o.e);
        rb.addEventListener("click", avecRetourTactile((e)=>{
          e.stopPropagation();
          rpeValStatut = rpeValStatut===o.v ? null : o.v;
          sessionRpe[uid] = rpeValStatut;
          save(clePourPlan("lk_session_rpe"), sessionRpe);
          rebuildRpeStatut();
        }));
        rpeRowStatut.appendChild(rb);
      });
    };
    rebuildRpeStatut();
    rpeWrapperStatut = el("div",{style:{width:"100%"}},
      el("div",{style:{fontSize:"11px",color:"var(--text2)",marginBottom:"4px"}},"Ressenti"),
      rpeRowStatut,
      rpeLabelStatut
    );
    wrapper.appendChild(rpeWrapperStatut);
  }
  return wrapper;
}

// Icône ✏️ compacte pour le header de la carte "Aujourd'hui" (26/07/2026) —
// remplace visuellement l'ancienne ligne pleine largeur "Saisir ou corriger
// manuellement" quand la séance n'est pas encore validée. Coloration pleine
// (var(--accent)) si une saisie manuelle existe déjà pour cette séance, pour
// la distinguer d'un coup d'œil du stylo neutre (aucune saisie).
function renderIconeSaisieManuelle(uid, s, stravaRun) {
  const wrap = el("div",{style:{position:"relative"}});
  const manuelExiste = !!manualPerf[uid];
  const icone = el("span",{title: manuelExiste ? "Saisie manuelle active" : "Saisir ou corriger manuellement", style:{
    cursor:"pointer",fontSize:"15px",lineHeight:"1",display:"inline-flex",
    background: manuelExiste ? "var(--accent)" : "var(--border-soft)",
    color: manuelExiste ? "#F8FAFC" : "var(--text-muted)",
    border: manuelExiste ? "1px solid var(--accent)" : "1px solid var(--border)",
    borderRadius:"6px",padding:"5px 7px"
  }},"✏️");
  const popover = el("div",{style:{
    display:"none",position:"absolute",top:"24px",right:"0",zIndex:"20",
    background:"var(--bg)",boxShadow:"0 4px 16px var(--shadow1), 0 2px 6px var(--shadow2)",
    border:"1px solid var(--border)",borderRadius:"8px",padding:"10px 12px",width:"240px"
  }});
  let open = false;
  icone.addEventListener("click", avecRetourTactile((e)=>{
    e.stopPropagation();
    open = !open;
    if (open) {
      popover.innerHTML = "";
      popover.appendChild(renderManualPerfRow(uid, s, stravaRun, true));
    }
    popover.style.display = open ? "block" : "none";
  }));
  wrap.appendChild(icone);
  wrap.appendChild(popover);
  return wrap;
}

// Saisie/correction manuelle de performance pour une séance SPEC/VMA
// (docs/source-donnees-seances.md). Toujours affichée (pas conditionnée à
// dataSource) — l'utilisateur choisit d'ouvrir le détail s'il veut
// saisir/corriger. Dès qu'une entrée manualPerf existe pour ce uid, elle
// prime automatiquement sur Strava pour le prédicteur (section 2 du doc),
// sans confirmation : c'est un acte volontaire du coureur.
function renderManualPerfRow(uid, s, stravaRun, forceOpen) {
  let expanded = !!forceOpen;
  const hasManualNow = () => !!manualPerf[uid];

  const summaryLine = el("div",{style:{
    display:"flex",alignItems:"center",justifyContent:"space-between",
    marginTop:"8px",padding:"9px 12px",
    borderRadius:"8px",cursor:"pointer"
  }});
  const rebuildSummary = () => {
    const manual = hasManualNow();
    summaryLine.style.background = manual ? "rgba(var(--accent-rgb),0.13)" : "rgba(var(--accent-rgb),0.08)";
    summaryLine.style.border = `1px solid ${manual ? "var(--accent)" : "rgba(var(--accent-rgb),0.33)"}`;
    summaryLine.innerHTML = "";
    summaryLine.appendChild(el("span",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"14px",fontWeight:"700",color:"var(--accent)"}},
      el("span",{style:{fontSize:"15px"}},"✏️"),
      manual
        ? "Saisie manuelle · "+fmtPace(manualPerf[uid].average_speed)+"/km"+(stravaRun?" (prime sur Strava)":"")
        : "Saisir ou corriger manuellement"
    ));
    summaryLine.appendChild(el("span",{style:{fontSize:"13px",color:"var(--accent)"}}, expanded?"▲":"▼"));
  };
  rebuildSummary();

  const formWrap = el("div",{style:{display:"none",marginTop:"8px",background:"var(--border-soft)",borderRadius:"8px",padding:"10px 12px"}});

  const rebuildForm = () => {
    formWrap.innerHTML = "";
    const cur = manualPerf[uid] || {};
    // Pré-remplissage à l'allure cible du plan pour ce type de séance
    // (SESSION_TARGETS, déjà en sec/km) plutôt qu'un champ vide — l'idée
    // n'est pas de forcer cette valeur mais de donner un point de départ
    // réaliste à ajuster, pour réduire le risque d'une saisie de mémoire
    // trop imprécise (impact non négligeable sur le prédicteur, voir test
    // de sensibilité mené avant ce choix). Repli à 6:00/km si le type n'a
    // pas de cible définie (EF, LONGUE...).
    const target = SESSION_TARGETS[s.type];
    const paceInitSec = cur.average_speed ? Math.round(1000/cur.average_speed)
      : target ? Math.round((target.targetMin+target.targetMax)/2) : 360;
    let paceSec = paceInitSec;

    const paceValueEl = el("span",{style:{fontSize:"18px",fontWeight:"700",color:"var(--text)",minWidth:"64px",textAlign:"center"}}, fmtPace(1000/paceSec)+"/km");
    const stepBtn = (delta, label) => {
      const b = el("button",{type:"button",style:{
        width:"38px",height:"38px",fontSize:"18px",fontWeight:"700",
        background:"var(--bg)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",
        color:"var(--text-muted)",cursor:"pointer"
      }}, label);
      b.addEventListener("click", avecRetourTactile(()=>{
        paceSec = Math.max(120, paceSec + delta); // plancher 2:00/km, garde-fou anti-saisie absurde
        paceValueEl.textContent = fmtPace(1000/paceSec)+"/km";
      }));
      return b;
    };
    const paceStepper = el("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"10px"}},
      stepBtn(+5,"−"), // -5s/km = plus rapide, affiché à gauche comme "diminuer l'allure affichée"
      paceValueEl,
      stepBtn(-5,"+") // +5s/km = plus lent
    );
    if (target) {
      formWrap.appendChild(el("div",{style:{fontSize:"11px",color:"var(--text2)",textAlign:"center",marginTop:"2px"}},
        "cible plan : "+fmtPace(1000/target.targetMin)+"–"+fmtPace(1000/target.targetMax)+"/km"));
    }

    const hrInput = el("input",{type:"number",id:"input-fc-manuelle",name:"input-fc-manuelle",placeholder:"165",value:cur.average_heartrate||"",
      style:{width:"100%",background:"var(--bg)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"6px",padding:"6px 8px",color:"var(--text)",fontSize:"14px",textAlign:"center"}});

    // Durée totale RÉELLE de la séance (17/07/2026) — distincte de la durée
    // prévue au plan (échauffement+effort+récup+RAC). Sert à dériver la
    // distance totale (échauffement/RAC/récup à l'allure EF du coureur,
    // cf. distanceTotaleAvecRecup) plutôt que de se limiter aux seuls blocs
    // d'effort structurés comme le faisait distanceEffortStructure() seule.
    // Pré-remplissage avec la durée prévue au plan comme point de départ
    // ajustable, cohérent avec le même principe déjà appliqué à l'allure.
    const dureePrevueSec = (structureIntervalles=>{
      if (!structureIntervalles) return null;
      const nbSeries = structureIntervalles.nbSeries || 1;
      let total = (structureIntervalles.echauffementSec||0) + (structureIntervalles.retourCalmeSec||0);
      structureIntervalles.blocs.forEach(b=>{ total += ((b.dureeEffortSec||0)+(b.dureeRecupSec||0))*(b.repetitions||1)*nbSeries; });
      return total;
    })(s.structureIntervalles);
    const dureeInput = el("input",{type:"number",id:"input-duree-manuelle",name:"input-duree-manuelle",placeholder:"31",
      value: cur.dureeSaisieMin || (dureePrevueSec ? Math.round(dureePrevueSec/60) : ""),
      style:{width:"100%",background:"var(--bg)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"6px",padding:"6px 8px",color:"var(--text)",fontSize:"14px",textAlign:"center"}});

    formWrap.appendChild(el("div",{style:{fontSize:"12px",color:"var(--text-muted)",marginBottom:"10px"}},
      stravaRun ? "Strava a une activité ce jour-là — ta saisie primera dessus si tu valides." :
        "Pas de donnée Strava ce jour-là. Ajuste l'allure ci-dessous si besoin."));

    formWrap.appendChild(el("div",{style:{fontSize:"11px",color:"var(--text2)",textAlign:"center",marginBottom:"4px"}},"Allure effort"));
    formWrap.appendChild(paceStepper);
    if (s.structureIntervalles) {
      formWrap.appendChild(el("div",{style:{marginTop:"12px"}},
        el("div",{style:{fontSize:"11px",color:"var(--text2)",marginBottom:"4px"}},"Durée totale de la séance (min)"),dureeInput
      ));
    }
    formWrap.appendChild(el("div",{style:{marginTop:"12px"}},
      el("div",{style:{fontSize:"11px",color:"var(--text2)",marginBottom:"4px"}},"FC moyenne (optionnel)"),hrInput
    ));
    // Sélecteur RPE retiré d'ici le 17/07/2026 (chantier RPE unifié,
    // remarque de Laurent : doublon avec le sélecteur déjà présent dans
    // renderStatusRow, visible dès qu'un statut ✅/⚠️/❌ est posé — le
    // ressenti se saisit désormais à un seul endroit, jamais deux).

    const btnRow = el("div",{style:{display:"flex",gap:"8px",marginTop:"10px"}});
    const saveBtn = el("button",{type:"button",style:{flex:"1",background:"rgba(var(--accent-rgb),0.13)",border:"1px solid rgba(var(--accent-rgb),0.33)",borderRadius:"8px",padding:"8px",color:"var(--accent)",fontWeight:"700",fontSize:"14px",cursor:"pointer"}},"✓ Enregistrer");
    saveBtn.addEventListener("click", avecRetourTactile(()=>{
      const speed = 1000/paceSec;
      const hr = hrInput.value ? parseFloat(hrInput.value) : null;
      const dureeSaisieMin = s.structureIntervalles && dureeInput.value ? parseFloat(dureeInput.value) : null;
      // Distance dérivée de la durée totale RÉELLE saisie (échauffement +
      // effort + récup à l'allure EF + RAC) quand elle est renseignée —
      // repli sur l'ancien calcul (blocs d'effort seuls, sans échauffement
      // ni récup ni RAC) si le coureur laisse le champ durée vide.
      const distance = dureeSaisieMin
        ? distanceTotaleAvecRecup(s.structureIntervalles, dureeSaisieMin*60, window.__PLAN_BRUT__?.allures?.E)
        : (s.structureIntervalles ? distanceEffortStructure(s.structureIntervalles) : null);
      manualPerf[uid] = { average_speed: speed, distance: distance||null, average_heartrate: hr, dureeSaisieMin: dureeSaisieMin||null };
      save(clePourPlan("lk_manual_perf"), manualPerf);
      rebuildPredHistory();
      expanded = false;
      formWrap.style.display = "none";
      rebuildSummary();
    }));
    btnRow.appendChild(saveBtn);
    // Annuler (17/07/2026, remarque de Laurent) : supprime toute saisie
    // manuelle existante pour cette séance ET décoche le statut posé
    // (✅/⚠️/❌ → —), pour que le coureur reparte d'une page blanche et
    // relance lui-même une synchro Strava plutôt que de garder un statut
    // qui referait référence à une donnée qui vient d'être effacée.
    // Toujours affiché (pas seulement si hasManualNow()) : utile aussi pour
    // fermer le formulaire sans rien enregistrer.
    const cancelBtn = el("button",{type:"button",style:{flex:"1",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"8px",color:"var(--text-muted)",fontWeight:"700",fontSize:"14px",cursor:"pointer"}},"✕ Annuler");
    cancelBtn.addEventListener("click", avecRetourTactile(()=>{
      const avaitAllure = !!manualPerf[uid]?.average_speed;
      delete manualPerf[uid];
      save(clePourPlan("lk_manual_perf"), manualPerf);
      delete statuses[uid];
      save(clePourPlan("lk_statuses"), statuses);
      ALL_SESSIONS = recalculerAllSessions(); // cf. correctif 26/07/2026 (bug badge 😴)
      if (avaitAllure) rebuildPredHistory(); // ré-agréger sans cette saisie (Strava reprend la main s'il existe)
      expanded = false;
      formWrap.style.display = "none";
      rebuildSummary();
      render(); // reflète immédiatement le statut décoché (—) dans la carte du jour / détail semaine
      syncStrava(); // relance une synchro pour retrouver l'activité Strava du jour si elle existe — no-op si dataSource !== "strava" (cf. garde-fou dans syncStrava())
    }));
    btnRow.appendChild(cancelBtn);
    formWrap.appendChild(btnRow);
  };

  summaryLine.addEventListener("click", avecRetourTactile(()=>{
    expanded = !expanded;
    if (expanded) rebuildForm();
    formWrap.style.display = expanded ? "block" : "none";
    rebuildSummary();
  }));

  // Auto-ouverture (26/07/2026, refonte carte "Aujourd'hui") : quand on
  // valide un statut ✅/⚠️/❌ sans Strava ET sans saisie déjà existante, le
  // formulaire s'ouvre directement au premier rendu — pas besoin du clic
  // supplémentaire sur summaryLine. rebuildSummary() reflète déjà expanded
  // via le "▲"/"▼" ; on affiche juste le form dès la construction.
  if (forceOpen) {
    rebuildForm();
    formWrap.style.display = "block";
  }

  return el("div",{}, summaryLine, formWrap);
}

// Bloc "Réalisé" de la carte "Aujourd'hui" (26/07/2026) — affiché dès qu'un
// statut ✅/⚠️/❌ est posé, à la place de l'ancien tiroir "voir les détails".
// Résumé chiffré (distance/durée/allure/FC) toujours visible ; répétitions
// individuelles repliées derrière "▼ détail" (déplié au clic). Le lien
// "Corriger" réouvre le même formulaire que renderManualPerfRow, avec la
// donnée existante (Strava ou manuelle) comme point de départ.
function renderBlocRealise(uid, s, stravaRun, effortLaps, manuelExistant) {
  if (!stravaRun && !manuelExistant) {
    // Aucune donnée du tout (ni Strava ni manuelle) : lien discret vers la
    // saisie plutôt qu'un bloc vide.
    const wrap2 = el("div",{style:{marginTop:"4px"}});
    const lien = el("a",{href:"#",style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"13px",color:"var(--text-muted)",textDecoration:"none",paddingTop:"8px",borderTop:"1px solid var(--border)"}},
      "✏️ Aucune donnée — saisir");
    const formSlot = el("div",{style:{display:"none",marginTop:"8px"}});
    let openManuel = false;
    lien.addEventListener("click", avecRetourTactile((e)=>{
      e.preventDefault(); e.stopPropagation();
      openManuel = !openManuel;
      if (openManuel) {
        formSlot.innerHTML = "";
        formSlot.appendChild(renderManualPerfRow(uid, s, stravaRun, true));
      }
      formSlot.style.display = openManuel ? "block" : "none";
    }));
    wrap2.appendChild(lien);
    wrap2.appendChild(formSlot);
    return wrap2;
  }

  const wrap = el("div",{style:{borderTop:"1px solid var(--border)",paddingTop:"10px",marginTop:"4px"}});

  // En-tête résumé + lien Corriger / Strava
  const correctionSlot = el("div",{style:{display:"none",marginTop:"8px"}});
  const correctionLink = el("a",{href:"#",style:{color:"var(--accent)",fontSize:"12px",fontWeight:"700",textDecoration:"none",cursor:"pointer"}},"✏️ Corriger");
  let correctionOpen = false;
  correctionLink.addEventListener("click", avecRetourTactile((e)=>{
    e.preventDefault(); e.stopPropagation();
    correctionOpen = !correctionOpen;
    if (correctionOpen) {
      correctionSlot.innerHTML = "";
      correctionSlot.appendChild(renderManualPerfRow(uid, s, stravaRun, true));
    }
    correctionSlot.style.display = correctionOpen ? "block" : "none";
  }));
  const liensDroite = el("div",{style:{display:"flex",gap:"12px"}}, correctionLink);
  if (stravaRun) {
    liensDroite.appendChild(el("a",{href:"https://www.strava.com/activities/"+stravaRun.id_str,target:"_blank",style:{color:"var(--warn)",fontSize:"12px",fontWeight:"700",textDecoration:"none"}},"Strava 🔗"));
  }
  wrap.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
    el("span",{class:"muted",style:{fontSize:"12px",textTransform:"uppercase",letterSpacing:"0.5px"}},"Réalisé"),
    liensDroite
  ));

  // Résumé chiffré : Strava si dispo, sinon la saisie manuelle
  if (stravaRun) {
    const isIntensive = effortLaps.length > 0;
    const dispPace = isIntensive ? effortLaps.reduce((s2,l)=>s2+l.average_speed,0)/effortLaps.length : stravaRun.average_speed;
    const paceLabel = isIntensive ? "allure interv." : "allure moy.";
    const hrVals = isIntensive ? effortLaps.filter(l=>l.average_heartrate) : null;
    const dispHr = isIntensive ? (hrVals.length ? hrVals.reduce((s2,l)=>s2+l.average_heartrate,0)/hrVals.length : null) : stravaRun.average_heartrate;
    const hrLabel = isIntensive ? "FC interv." : "FC moy.";
    wrap.appendChild(el("div",{style:{display:"flex",gap:"14px",flexWrap:"wrap",marginBottom:"8px"}},
      el("div",{},el("div",{style:{color:"var(--warn)",fontSize:"15px",fontWeight:"700"}},(stravaRun.distance/1000).toFixed(2)+"km"),el("div",{class:"muted",style:{fontSize:"12px"}},"distance")),
      el("div",{},el("div",{style:{color:"var(--warn)",fontSize:"15px",fontWeight:"700"}},fmtTime(stravaRun.moving_time)),el("div",{class:"muted",style:{fontSize:"12px"}},"durée")),
      el("div",{},el("div",{style:{color:"var(--warn)",fontSize:"15px",fontWeight:"700"}},fmtPace(dispPace)+"/km"),el("div",{class:"muted",style:{fontSize:"12px"}},paceLabel)),
      dispHr?el("div",{},el("div",{style:{color:"var(--warn)",fontSize:"15px",fontWeight:"700"}},Math.round(dispHr)+" bpm"),el("div",{class:"muted",style:{fontSize:"12px"}},hrLabel)):null
    ));
  } else if (manuelExistant) {
    wrap.appendChild(el("div",{style:{display:"flex",gap:"14px",flexWrap:"wrap",marginBottom:"8px"}},
      el("div",{},el("div",{style:{color:"var(--accent)",fontSize:"15px",fontWeight:"700"}},fmtPace(manuelExistant.average_speed)+"/km"),el("div",{class:"muted",style:{fontSize:"12px"}},"allure (saisie)")),
      manuelExistant.distance?el("div",{},el("div",{style:{color:"var(--accent)",fontSize:"15px",fontWeight:"700"}},(manuelExistant.distance/1000).toFixed(2)+"km"),el("div",{class:"muted",style:{fontSize:"12px"}},"distance")):null,
      manuelExistant.average_heartrate?el("div",{},el("div",{style:{color:"var(--accent)",fontSize:"15px",fontWeight:"700"}},Math.round(manuelExistant.average_heartrate)+" bpm"),el("div",{class:"muted",style:{fontSize:"12px"}},"FC moy.")):null
    ));
  }

  // Répétitions : résumé cliquable qui déplie le détail lap-par-lap
  if (effortLaps.length > 0) {
    const detailLaps = el("div",{style:{display:"none",borderTop:"1px solid rgba(var(--warn-rgb),0.13)",paddingTop:"8px",marginTop:"8px"}});
    const { driftEl } = computeFcDrift(effortLaps);
    const rows = effortLaps.map((lap,i)=>renderLapRow(lap,i,s.type));
    rows.forEach(r=>detailLaps.appendChild(r));
    if (driftEl) detailLaps.appendChild(driftEl);

    const tgt = SESSION_TARGETS[s.type];
    const nb = tgt ? effortLaps.filter(l=>(1000/l.average_speed)<=tgt.okPace).length : null;
    let lapsOpen = false;
    const summaryRow = el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--border-soft)",borderRadius:"8px",padding:"8px 10px",cursor:"pointer"}},
      el("span",{style:{color:"var(--text2)",fontSize:"13px"}},effortLaps.length+" répétition"+(effortLaps.length>1?"s":"")),
      el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
        nb!==null?el("span",{style:{color:nb===effortLaps.length?"var(--accent2)":"var(--warn)",fontSize:"13px",fontWeight:"700"}},nb+"/"+effortLaps.length+" dans la cible"):null,
        el("span",{class:"muted",style:{fontSize:"12px"}},"▼ détail")
      )
    );
    summaryRow.addEventListener("click", avecRetourTactile((e)=>{
      e.stopPropagation();
      lapsOpen = !lapsOpen;
      detailLaps.style.display = lapsOpen ? "block" : "none";
      summaryRow.lastChild.lastChild.textContent = lapsOpen ? "▲ masquer" : "▼ détail";
    }));
    wrap.appendChild(summaryRow);
    wrap.appendChild(detailLaps);
  }

  wrap.appendChild(correctionSlot);
  return wrap;
}

// Distance totale d'effort (hors récups/échauffement) déduite d'une
// structureIntervalles, utilisée quand l'utilisateur ne précise que
// l'allure en saisie manuelle (docs/source-donnees-seances.md, section 4).
// CORRECTIF (17/07/2026, trouvé en testant le Module 2 avec Laurent) : cette
// fonction ne lisait QUE bloc.distanceM, ignorant silencieusement tout bloc
// défini en DURÉE (bloc.dureeEffortSec + bloc.allure, ex. "5×30s-30s @
// 4:18/km" — protocole courant en VMA, type 30-30). Résultat : total restait
// à 0 pour toute séance en durée, la fonction retournait null, et
// analyserSeanceQualite() (Module 2) affichait systématiquement "Volume non
// disponible" pour ces séances. Ajout du calcul distance = (durée/allure)
// quand distanceM est absent mais dureeEffortSec + allure sont présents.
// Distance totale d'une séance de qualité à partir d'une durée totale RÉELLE
// saisie par le coureur (pas les durées prévues au plan), en répartissant le
// temps entre : blocs d'effort (allure du bloc, connue), récup entre
// répétitions (allure EF du coureur, __PLAN_BRUT__.allures.E — décision
// actée le 17/07/2026, test de validation sur une vraie séance VMA du
// coureur : écart de 5m sur 5202m réels), et tout le reste du temps saisi
// (échauffement + retour au calme) également à l'allure EF. Volontairement
// distinct de distanceEffortStructure() (qui ne calcule QUE les blocs
// d'effort, jamais utilisée seule pour une distance totale de séance).
function distanceTotaleAvecRecup(structureIntervalles, dureeTotaleSec, allureEFStr) {
  if (!structureIntervalles?.blocs?.length || !dureeTotaleSec) return null;
  const nettoye = (allureEFStr||"6:10/km").replace('/km','').trim();
  const parts = nettoye.split(':').map(Number);
  const allureEFSec = (parts.length===2 && !parts.some(isNaN)) ? parts[0]*60+parts[1] : 370;

  const nbSeries = structureIntervalles.nbSeries || 1;
  let distanceEffort = 0, dureeEffortSeuleSec = 0, dureeRecupSeuleSec = 0;
  for (let serie=0; serie<nbSeries; serie++) {
    structureIntervalles.blocs.forEach(bloc=>{
      const reps = bloc.repetitions || 1;
      if (bloc.dureeEffortSec && bloc.allure) {
        const n2 = bloc.allure.replace('/km','').trim();
        const p2 = n2.split(':').map(Number);
        if (p2.length===2 && !p2.some(isNaN)) {
          const allureBlocSec = p2[0]*60+p2[1];
          if (allureBlocSec>0) distanceEffort += (bloc.dureeEffortSec/allureBlocSec)*1000*reps;
        }
        dureeEffortSeuleSec += bloc.dureeEffortSec*reps;
      } else if (bloc.distanceM) {
        distanceEffort += bloc.distanceM*reps;
        // Distance connue mais pas de durée associée pour ce bloc — la récup
        // liée reste comptée dans le "reste" ci-dessous (approximation
        // acceptée, cas rare : la plupart des blocs qualité sont en durée,
        // pas en distance fixe, cf. §5.2 doc archi et bug corrigé §27 inventaire).
      }
      if (bloc.dureeRecupSec) dureeRecupSeuleSec += bloc.dureeRecupSec*reps;
    });
  }
  // Récup entre répétitions à l'allure EF (demande explicite du 17/07/2026,
  // plutôt que de l'ignorer comme le faisait l'ancien distanceEffortStructure).
  const distanceRecup = (dureeRecupSeuleSec/allureEFSec)*1000;

  const dureeResteSec = Math.max(0, dureeTotaleSec - dureeEffortSeuleSec - dureeRecupSeuleSec);
  const distanceReste = (dureeResteSec/allureEFSec)*1000; // échauffement + retour au calme

  return Math.round(distanceEffort + distanceRecup + distanceReste) || null;
}

// Retourne l'activité Strava du jour correspondant à une séance, SAUF si
// une saisie manuelle existe déjà pour cette séance (manualPerf[uid]) — dans
// ce cas Strava est totalement ignoré, quelle que soit l'utilisation en aval
// (prédicteur, moteur de décision, affichage détail séance). Décision du
// 17/07/2026 : une saisie manuelle signale souvent une donnée Strava
// corrompue ou absente ce jour-là, elle ne doit jamais coexister avec
// Strava — remplace le principe précédent ("la saisie manuelle prime
// dessus") par une vraie exclusion. Point d'entrée UNIQUE à utiliser partout
// où on cherche l'activité Strava d'une séance par date — ne jamais
// réintroduire un stravaActivities.find(...) direct par date de séance.
function getStravaRunSiPasManuel(date, uid, activites) {
  if (uid && manualPerf[uid]) return null;
  const source = activites || stravaActivities;
  return source.find(a => a.start_date_local?.slice(0,10) === date) || null;
}

function distanceEffortStructure(structureIntervalles) {
  if (!structureIntervalles?.blocs?.length) return null;
  const nbSeries = structureIntervalles.nbSeries || 1;
  let total = 0;
  for (let serie=0; serie<nbSeries; serie++) {
    structureIntervalles.blocs.forEach(bloc=>{
      const reps = bloc.repetitions || 1;
      if (bloc.distanceM) {
        total += bloc.distanceM * reps;
      } else if (bloc.dureeEffortSec && bloc.allure) {
        // Bloc défini en durée (ex. 30-30) : distance déduite de l'allure
        // cible du bloc. allure au format "M:SS/km" ou "M:SS", même parsing
        // que paceStringVersSecondes (DecisionEngineSessionAnalysis) — dupliqué
        // ici car cette fonction vit côté index.html, pas dans le module.
        const nettoye = bloc.allure.replace('/km', '').trim();
        const parts = nettoye.split(':').map(Number);
        if (parts.length === 2 && !parts.some(isNaN)) {
          const allureSec = parts[0] * 60 + parts[1];
          if (allureSec > 0) {
            const distanceBlocM = (bloc.dureeEffortSec / allureSec) * 1000;
            total += distanceBlocM * reps;
          }
        }
      }
    });
  }
  return total || null;
}

function renderWeekDetail(weekNum) {
  const week=PLAN.find(w=>w.week===weekNum);
  if (!week) return el("div",{},"—");
  const t=today();
  const weekDates=week.sessions.map(s=>s.date);
  const weekRuns=stravaActivities.filter(a=>a.type==="Run"&&weekDates.includes(a.start_date_local?.slice(0,10)));

  const cards=week.sessions.map((s,i)=>{
    const uid=`${weekNum}-${i}`;
    const isHidden = !!hiddenSessions[uid];
    // Session effective (apres swap eventuel)
    const effSess = getEffectiveSession(week, i) || week.sessions[i];
    if (!effSess) return null;
    const isToday=s.date===today(), isPast=s.date<today();
    const st=STYPES[effSess.type]||STYPES.REPOS;
    const stravaRun=getStravaRunSiPasManuel(s.date, uid, weekRuns);
    const effortLaps=stravaRun?getLapsAffichage(stravaRun, effSess.structureIntervalles):[];

    // Seance masquee
    if (isHidden) {
      const hCard = el("div",{style:{background:"rgba(var(--bg-rgb),0.4)",border:"1px dashed var(--border)",borderRadius:"12px",padding:"10px 14px",marginBottom:"8px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",opacity:"0.5"}},
        el("span",{class:"muted",style:{fontSize:"13px"}},"[supprimee] "+effSess.type+" - "+effSess.session.slice(0,30)),
        el("span",{class:"muted",style:{fontSize:"11px"}},s.date)
      );
      let lpH=null;
      hCard.addEventListener("touchstart",()=>{lpH=setTimeout(()=>{lpH=null;showSessionMenu(week,i);},600);},{passive:true});
      hCard.addEventListener("touchend",()=>{if(lpH){clearTimeout(lpH);lpH=null;}});
      hCard.addEventListener("touchmove",()=>{if(lpH){clearTimeout(lpH);lpH=null;}});
      hCard.addEventListener("contextmenu",e=>{e.preventDefault();showSessionMenu(week,i);});
      return hCard;
    }

    // statutEffectif (22/07/2026) lu depuis ALL_SESSIONS[uid] — même
    // calcul centralisé que la garde du swap ci-dessus (getAvailableSlots),
    // plutôt que de le refaire localement ici comme dans une première
    // tentative non aboutie : la valeur vient maintenant d'un seul endroit
    // (recalculerAllSessions), garantissant la même lecture partout dans
    // l'app (stats, moteur de décision, garde du swap, badge visuel ici).
    const sessionDansAllSessions = ALL_SESSIONS.find(as => as.uid === uid);
    const statutEffectif = sessionDansAllSessions?.statutEffectif ?? (statuses[uid] || "—");
    // isDoneSession élargi (22/07/2026) : couvre désormais les 4 vrais
    // statuts (✅/❌/⚠️/😴), pas seulement ✅/⚠️ — un badge doit apparaître
    // peu importe le statut réel, c'est le bug remonté par Laurent ("on
    // voit seulement l'onglet validé vert").
    const isDoneSession = ["✅","❌","⚠️","😴"].includes(statutEffectif) && effSess.type!=="REPOS";
    // id ajouté (31/07/2026, demande de Laurent : le clic sur un jour de
    // la grille récapitulative de l'onglet Semaines doit ouvrir directement
    // la carte de la séance, pas juste faire défiler jusqu'en haut de la
    // semaine) — cf. renderGrilleJoursSemaine, qui scrolle vers cet id
    // après avoir changé de vue. Basé sur uid (déjà unique et stable dans
    // tout le fichier, cf. statuses[uid]/ALL_SESSIONS), préfixé "carte-"
    // pour éviter toute collision avec un id existant ailleurs dans le DOM.
    const card=el("div",{id:"carte-"+uid,style:{
      background:isToday?"var(--border-soft)":"var(--bg)",
      border:`1px solid ${isToday?"rgba(var(--accent-rgb),0.2)":st.colorSoft+"0.13)"}`,
      borderTop:`3px solid ${st.color}`,
      borderRadius:"12px",
      boxShadow:`0 6px 24px ${st.colorSoft}0.1), 0 2px 8px rgba(0,0,0,0.4)`,
      padding:"12px 14px",marginBottom:"8px"
    }},
      el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}},
        el("div",{style:{color:isPast?"var(--text-muted)":"var(--text2)",fontSize:"13px",fontWeight:"700",minWidth:"60px"}},s.day+" "+s.date.slice(8)),
        isToday?el("span",{style:{background:"rgba(var(--accent-rgb),0.2)",color:"var(--accent)",fontSize:"13px",fontWeight:"700",padding:"1px 5px",borderRadius:"3px"}},"AUJOURD\'HUI"):null,
        badge(effSess.type),
        el("div",{style:{flex:"1"}}),
        // Refonte ergonomique (26/07/2026, cohérente avec la carte
        // "Aujourd'hui") : icônes ⌚/✏️ compactes affichées uniquement pour
        // une séance non encore validée ET pas future (mêmes règles que le
        // bloc saisie manuelle/notes plus bas). Remplacent l'ancien bouton
        // pleine largeur "📱 À programmer sur ta montre" et la ligne "✏️
        // Saisir ou corriger manuellement".
        (!isDoneSession && s.date<=today() && effSess.type!=="REPOS" && effSess.type!=="RACE" && effSess.structureIntervalles) ? renderIconeStructureMontre(effSess.structureIntervalles) : null,
        (!isDoneSession && s.date<=today() && effSess.type!=="REPOS" && effSess.type!=="RACE") ? renderIconeSaisieManuelle(uid, s, stravaRun) : null,
        // Badge de statut (22/07/2026) : rond coloré pour ✅/❌/⚠️, icône
        // directe (pas de rond) pour 😴.
        isDoneSession ? (
          statutEffectif === "😴"
            ? el("span",{style:{fontSize:"16px",flexShrink:"0"}}, "😴")
            : el("span",{style:{
                background:statutEffectif==="✅"?"var(--accent2)":"var(--warn)",
                color:statutEffectif==="✅"?"#fff":"var(--bg)",
                borderRadius:"50%",width:"20px",height:"20px",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:"14px",fontWeight:"900",flexShrink:"0"
              }}, statutEffectif==="✅"?"✓":"!")
        ) : null
      ),
      el("div",{style:{color:"var(--text)",fontSize:"15px",fontWeight:"600",marginBottom:"4px"}},effSess.session),
      (effSess.warmup||effSess.cooldown)?el("div",{style:{display:"flex",gap:"12px",marginBottom:"6px",flexWrap:"wrap"}},
        effSess.warmup?el("div",{class:"muted",style:{fontSize:"13px"}},"▶ "+effSess.warmup):null,
        effSess.cooldown?el("div",{class:"muted",style:{fontSize:"13px"}},"◀ "+effSess.cooldown):null
      ):null,
      effSess.notes?el("div",{style:{color:"rgba(var(--accent-rgb),0.8)",fontSize:"14px",marginBottom:"8px",fontStyle:"italic"}},"💡 "+effSess.notes):null,
      // Allures/FC cibles remontées ici, sans repli (26/07/2026) — cohérent
      // avec la carte "Aujourd'hui", seulement si séance non validée et non
      // future (rien à cibler pour une séance qui n'a pas encore de plan
      // proche, cf. décision garde-fou plus haut).
      (!isDoneSession && s.date<=today() && PACE_REFS[effSess.type]) ? el("div",{style:{background:"rgba(var(--accent-rgb),0.07)",border:"1px solid rgba(var(--accent-rgb),0.2)",borderRadius:"8px",padding:"10px 12px",marginBottom:"8px"}},
        el("div",{style:{color:"var(--accent)",fontSize:"12px",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"8px",fontWeight:"700"}},"⚡ Allures cibles"),
        el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},
          el("span",{class:"muted",style:{fontSize:"14px"}},"Effort"),
          el("div",{style:{textAlign:"right"}},
            el("span",{style:{color:"var(--text)",fontSize:"15px",fontWeight:"700"}},PACE_REFS[effSess.type].effort),
            el("span",{class:"muted",style:{fontSize:"13px",marginLeft:"6px"}},PACE_REFS[effSess.type].tolerance)
          )
        ),
        el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          el("span",{class:"muted",style:{fontSize:"14px"}},"Récupération"),
          el("span",{class:"muted",style:{fontSize:"15px",fontWeight:"700"}},PACE_REFS[effSess.type].recup)
        )
      ) : null,
      (!isDoneSession && s.date<=today() && FC_ZONES[effSess.type]) ? el("div",{style:{background:FC_ZONES[effSess.type].color+"11",border:"1px solid "+FC_ZONES[effSess.type].color+"33",borderRadius:"8px",padding:"8px 10px",marginBottom:"8px"}},
        el("div",{class:"muted",style:{fontSize:"12px",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"4px"}},"FC cible"),
        el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
          el("div",{style:{color:FC_ZONES[effSess.type].color,fontSize:"15px",fontWeight:"700"}},FC_ZONES[effSess.type].min+"–"+FC_ZONES[effSess.type].max+" bpm"),
          el("div",{class:"muted",style:{fontSize:"13px"}},FC_ZONES[effSess.type].label+" · FC max "+FC_MAX)
        )
      ) : null,
      // Refonte ergonomique (26/07/2026) : le résumé Strava enrichi est
      // remplacé par renderBlocRealise (même fonction que la carte
      // "Aujourd'hui") — résumé toujours visible + laps repliés + lien
      // Corriger, plutôt que ce bloc entièrement affiché ou entièrement cousu
      // au système "childrenToHide" plus bas. Affiché seulement si la séance
      // est validée (✅/⚠️/❌/😴) ou a une donnée quelconque (Strava/manuelle),
      // jamais pour une séance future.
      (s.date<=today() && effSess.type!=="REPOS" && effSess.type!=="RACE" && (isDoneSession || stravaRun || manualPerf[uid]))
        ? renderBlocRealise(uid, effSess, stravaRun, effortLaps, manualPerf[uid])
        : null,
      // Météo au départ (spécifique à cette vue, absente de la carte du
      // jour) — affichée seulement si une activité Strava géolocalisée
      // existe pour cette séance.
      stravaRun&&stravaRun.start_latlng?.length===2&&s.date?
        el("div",{style:{fontSize:"13px",color:"var(--text2)",paddingTop:"4px",paddingBottom:"4px"}},
          historicalWeatherCache[s.date]!=null
            ? "🌡️ "+historicalWeatherCache[s.date]+"°C au départ"+(historicalWeatherCache[s.date]>28?" 🔥":"")
            : el("span",{style:{color:"var(--text-muted)",fontStyle:"italic"}},"🌡️ Chargement météo...")
        ):null
    );

    // effSess.type==="RACE" : aucun bloc dédié ici — effSess.session
    // (déjà affiché plus haut dans la carte, titre principal de la
    // séance) contient déjà le texte complet généré par
    // genererContenuRace() (segments/allures), cohérent avec l'onglet
    // Course depuis le fix du 19/07/2026. Un bloc "Jour J" avait été
    // ajouté ici puis retiré le même jour : il dupliquait mot pour mot
    // ce texte déjà visible, sans valeur ajoutée (signalé par Laurent).
    if (effSess.type!=="RACE" && effSess.type!=="REPOS") {
      // Raison du statut ❌ ou ⚠️
      const reason = stravaRun ? validateReason({...s, uid}, stravaRun) : null;
      if (reason) {
        card.appendChild(el("div",{style:{
          background: statuses[uid]==="❌" ? "rgba(var(--warn-rgb),0.07)" : "rgba(var(--warn-rgb),0.07)",
          border: `1px solid ${statuses[uid]==="❌" ? "rgba(var(--warn-rgb),0.2)" : "rgba(var(--warn-rgb),0.2)"}`,
          borderRadius:"6px", padding:"6px 10px", marginTop:"4px", marginBottom:"4px",
          color: statuses[uid]==="❌" ? "var(--warn)" : "var(--warn)",
          fontSize:"13px"
        }}, (statuses[uid]==="❌"?"❌ ":"⚠️ ")+reason));
      }
      const statusRow=renderStatusRow(uid, s.date);
      card.appendChild(statusRow);
      // Correctif 26/07/2026 (signalé par Laurent) : saisie manuelle et
      // notes n'ont pas de sens pour une séance FUTURE (rien ne s'est
      // encore passé) — même garde que renderStatusRow (estFuture), qui ne
      // bloquait jusqu'ici que les boutons de statut, pas ces deux blocs.
      const estFutureSeance = s.date > today();
      if (!estFutureSeance) {
        // Saisie/correction manuelle (docs/source-donnees-seances.md) — même
        // bloc que sur la carte du jour, pour pouvoir corriger une séance
        // passée depuis le détail de semaine.
        card.appendChild(renderManualPerfRow(uid, s, stravaRun));
        const noteInput=el("input",{type:"text",id:"note-"+uid,name:"note-"+uid,placeholder:"💬 Note sur cette séance...",style:{marginTop:"8px",background:"var(--bg)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"7px 10px",color:"var(--text)",fontSize:"14px",outline:"none",width:"100%"}});
        noteInput.value=sessionNotes[uid]||"";
        noteInput.addEventListener("change",()=>{
          if(noteInput.value.trim()){sessionNotes[uid]=noteInput.value.trim();}
          else{delete sessionNotes[uid];}
          save(clePourPlan("lk_session_notes"),sessionNotes);
        });
        if(sessionNotes[uid]){card.appendChild(el("div",{style:{color:"var(--text2)",fontSize:"14px",fontStyle:"italic",marginTop:"4px"}},"💬 "+sessionNotes[uid]));}
        card.appendChild(noteInput);
      }
    }

    // Appui long : menu gestion seance
    if (effSess.type !== "REPOS" && effSess.type !== "RACE") {
      let lpCard=null;
      card.addEventListener("touchstart",()=>{lpCard=setTimeout(()=>{lpCard=null;showSessionMenu(week,i);},600);},{passive:true});
      card.addEventListener("touchend",()=>{if(lpCard){clearTimeout(lpCard);lpCard=null;}});
      card.addEventListener("touchmove",()=>{if(lpCard){clearTimeout(lpCard);lpCard=null;}});
      card.addEventListener("contextmenu",e=>{e.preventDefault();showSessionMenu(week,i);});
    }
    return card;
  });

  return el("div",{style:{padding:"0 16px 100px"}},
    el("div",{style:{display:"flex",alignItems:"center",gap:"12px",marginTop:"8px",marginBottom:"16px"}},
      el("div",{style:{flex:"1"}},
        el("div",{class:"muted",style:{fontSize:"13px",textTransform:"uppercase",letterSpacing:"1px"}},phaseOf(weekNum).label),
        el("div",{style:{color:"var(--text)",fontSize:"20px",fontWeight:"800"}},"Semaine "+weekNum),
        el("div",{class:"muted",style:{fontSize:"14px"}},fmtDate(week.sessions[0].date)+" – "+fmtDate(week.sessions[6].date))
      ),
      weekRuns.length>0?el("div",{style:{background:"rgba(var(--warn-rgb),0.07)",border:"1px solid rgba(var(--warn-rgb),0.2)",borderRadius:"8px",padding:"6px 10px",textAlign:"center"}},
        el("div",{style:{color:"var(--warn)",fontSize:"15px",fontWeight:"700"}},weekRuns.length+""),
        el("div",{class:"muted",style:{fontSize:"14px"}},"Strava")
      ):null
    ),
    ...cards
  );
}
