     le .then() de monterEcranAuth() — aucune dépendance de timing

<script defer src="https://js-de.sentry-cdn.com/1598be66558d46e63cc4443c635738e7.min.js" crossorigin="anonymous"></script>
<!-- Import map ajoutée le 03/08/2026 : fit-file-parser@3.0.2 (chargé par
     chargerFitParser(), plus bas dans ce fichier) déclare une vraie
     dépendance npm vers le package `buffer` (vérifié dans son
     package.json publié : "dependencies": {"buffer": "^6.0.3"}), et son
     fichier dist/binary.js fait `import { Buffer } from 'buffer'`. Le
     fichier ESM brut servi par cdn.jsdelivr.net/.../dist/fit-parser.js
     n'est PAS bundlé/polyfillé (contrairement à un service comme
     esm.run) — un navigateur sans bundler ne sait donc pas résoudre le
     spécificateur nu "buffer", d'où l'erreur "Failed to resolve module
     specifier 'buffer'" bloquant tout import FIT (natif comme via le
     repli fit-detection.js), découverte le 03/08/2026 lors du premier
     test réel d'upload sur le compte test.
     Le seul usage réel de Buffer dans binary.js est
     `Buffer.from(temp).toString('utf-8')` (décodage UTF-8 d'un tableau
     d'octets, vérifié en inspectant le fichier source réellement
     publié) — remplacé ici par un TextDecoder natif du navigateur,
     plutôt que d'importer le vrai polyfill npm `buffer` (bien plus
     volumineux pour un seul besoin trivial). DOIT rester avant le
     premier <script type="module"> de ce fichier (ligne ~642) — un
     import map n'est appliqué que s'il est déjà présent dans le DOM
     avant qu'un module ne soit évalué, il ne peut pas être ajouté
     dynamiquement après coup. Non testé en conditions réelles par
     Claude au moment de l'écriture (limite d'environnement : impossible
     de simuler un vrai navigateur dans le sandbox utilisé) — à valider
     sur le compte test avant tout déploiement plus large. -->
<script type="importmap">
{
  "imports": {
    "buffer": "data:text/javascript,export const Buffer = { from: (arr) => ({ toString: (enc) => new TextDecoder(enc || 'utf-8').decode(new Uint8Array(arr)) }) };"
  }
}
</script>

  <img id="logo-ecran-chargement" src="/icon-512.png" alt="" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); border-radius:20%; z-index:0;">

<script>
// Dimensions en pixels absolus calculées en JS (07/08/2026) — cf.
// commentaire détaillé ci-dessus. Synchrone, exécuté immédiatement (pas
// de DOMContentLoaded, l'élément #logo-ecran-chargement existe déjà
// juste au-dessus dans le flux du document au moment où ce script
// s'exécute) — garantit que le logo a la bonne taille dès le tout
// premier paint, sans flash d'une mauvaise taille suivi d'une correction.
// Slogan (07/08/2026, demande de Laurent) — repris tel quel de
// manifest.json (description de la PWA), sans la partie technique "plan
// généré par le moteur v2" qui n'a pas sa place sur cet écran. Positionné
// à top:50% (même ancrage que le logo, cf. translate(-50%,0) qui ne
// centre QUE horizontalement — verticalement l'élément part de ce point
// vers le bas) + un margin-top calculé ici en JS pour rester juste sous
// le logo quelle que soit sa taille réelle (72.5% + une marge fixe de
// 24px), plutôt qu'une valeur fixe qui se déconnecterait du logo si sa
// taille venait à changer.
(function() {
  var tailleCote = Math.round(window.innerWidth * 0.765) + 'px';
  var img = document.getElementById('logo-ecran-chargement');
  if (img) {
    img.style.width = tailleCote;
    img.style.height = tailleCote;
  }
  var slogan = document.getElementById('slogan-ecran-chargement');
  if (slogan) {
    var demiCote = Math.round(window.innerWidth * 0.765 / 2);
    slogan.style.marginTop = (demiCote + 24) + 'px';
  }
})();
</script>

<script>
// window.__AUTH_PRET__ créée ici, de façon SYNCHRONE, avant même l'IIFE
// async ci-dessous — corrige une race condition découverte le 21/07/2026
// sur v2/index.html (écran "Consulter un plan existant" jamais affiché
// malgré un plan bien présent en base) et reproduite ici à l'identique.
// Cause : window.__AUTH_PRET__ n'était assignée qu'après plusieurs
// `await import(...)` dans l'IIFE async plus bas ; tout code qui exécute
// `await window.__AUTH_PRET__` avant que ce point ne soit atteint reçoit
// `undefined`, et `await undefined` ne bloque jamais (JS résout
// immédiatement une valeur non-promise) — l'attente de l'authentification
// est donc silencieusement sautée. Symptôme observé : le dashboard
// retombe sur le plan de repli par défaut (estPlanRepli:true) au lieu du
// vrai plan Forme fraîchement créé, malgré sa présence réelle en base
// (chargerPlansSupabase() s'exécutant avec window.__UTILISATEUR__.id
// encore undefined, retournant [] à tort).
window.__AUTH_PRET__ = new Promise((resolve) => { window.__resoudreAuthPret__ = resolve; });
(async () => {
  // Cache des modules auth.js et sync-storage.js (19/07/2026, étape 3 du
  // chantier de conversion module — cf. mémoire de session, la partie la
  // plus délicate : window.__AUTH_PRET__ lui-même dépend de ces deux
  // modules, et tout le reste du fichier attend cette promesse avant
  // d'utiliser window.__UTILISATEUR__ (cf. point de vigilance documenté
  // dans l'inventaire). auth.classic.js/sync-storage.classic.js
  // exposaient LkAuth/LkSync comme un OBJET nommé (window.LkAuth = {...}),
  // pas des fonctions globales sans préfixe comme les autres modules déjà
  // migrés — reproduit ici à l'identique (Object.assign(window, ...)
  // exposerait monterEcranAuth/precharger/etc. directement en global sans
  // préfixe, cassant tous les appels existants LkAuth.xxx/LkSync.xxx).
  const authModule = await import("/v2/engine/auth.js");
  window.LkAuth = {
    // Getter plutôt que valeur figée, miroir exact de auth.classic.js :
    // `supabase` (export `let`, mutable) vaut undefined tant que
    // supabaseReady n'est pas résolue.
    get supabase() { return authModule.supabase; },
    supabaseReady: authModule.supabaseReady,
    monterEcranAuth: authModule.monterEcranAuth,
    monterEcranOnboarding: authModule.monterEcranOnboarding,
    deconnecter: authModule.deconnecter,
    utilisateurActuel: authModule.utilisateurActuel
  };
  const syncModule = await import("/v2/engine/sync-storage.js");
  window.LkSync = {
    precharger: syncModule.precharger,
    synchroniserVersSupabase: syncModule.synchroniserVersSupabase,
    migrerDonneesExistantes: syncModule.migrerDonneesExistantes,
    assurerPlanExiste: syncModule.assurerPlanExiste,
    cloturerPlanSupabase: syncModule.cloturerPlanSupabase,
    mettreAJourPlanSupabase: syncModule.mettreAJourPlanSupabase,
    chargerPlansSupabase: syncModule.chargerPlansSupabase,
    chargerResultatsCoursesSupabase: syncModule.chargerResultatsCoursesSupabase,
    rejouerFileSync: syncModule.rejouerFileSync,
    activerRealtime: syncModule.activerRealtime
  };

  // Démarre le montage de l'écran d'auth dès que possible ; la promesse
  // se résout avec l'utilisateur dès qu'une session est active (existante
  // au chargement, ou obtenue via le formulaire).
  //
  // Une fois connecté, précharge toutes les données Supabase de
  // l'utilisateur dans localStorage AVANT de résoudre window.__AUTH_PRET__
  // — ainsi, quand le script principal plus bas exécute ses ~22 lignes
  // `let x = load(clePourPlan("lk_..."), défaut)`, les données viennent
  // déjà de Supabase plutôt que d'un éventuel ancien état local. Le plan
  // actif n'étant pas encore connu à ce stade (window.__PLAN_BRUT__ se
  // prépare en parallèle, cf. script suivant), on précharge d'abord sans
  // planId — les données préfixées par plan seront chargées séparément
  // une fois le plan connu (cf. bloc juste avant render(), fin de fichier).
  // Chantier v2.5 migration, 13 juillet 2026 — voir inventaire §8bis.
  LkAuth.monterEcranAuth('ecran-auth-hote').then(async function (user) {
    window.__UTILISATEUR__ = user;
    // Sentry (20/07/2026, corrigé le 21/07/2026 après un crash) — le
    // Loader Script (cf. <head>) initialise déjà Sentry automatiquement
    // avec le vrai DSN dès son chargement (config window.sentryOnLoad
    // définie en tête de <head>).
    // BUG GRAVE TROUVÉ ET CORRIGÉ : Sentry.configureScope() a été utilisé
    // ici dans une première version (car présent dans le buffer du Loader
    // Script — contrairement à setUser()), mais configureScope() est
    // DÉPRÉCIÉ et cause un crash "out of memory" documenté et confirmé
    // avec le SDK v8 (github.com/getsentry/sentry-javascript/issues/13939
    // — cause confirmée par l'équipe Sentry elle-même : "configureScope
    // does not exist anymore in v8"). Reproduit en conditions réelles le
    // 21/07/2026 : onglet navigateur planté après clic sur "Envoyer" du
    // formulaire de signalement. Fix recommandé par Sentry : utiliser
    // Sentry.getCurrentScope().setUser() à la place — mais getCurrentScope
    // n'est pas non plus dans le buffer du Loader Script, donc différé via
    // Sentry.onLoad(), qui garantit que le SDK complet est chargé avant
    // d'appeler cette méthode.
    try {
      if (typeof Sentry !== 'undefined' && typeof Sentry.onLoad === 'function') {
        Sentry.onLoad(function () {
          Sentry.getCurrentScope().setUser({ id: user.id });
        });
      }
    } catch (e) {
      console.warn('Sentry setUser non déclenché :', e.message);
    }
    // Migration rétroactive (one-shot par appareil) AVANT le préchargement :
    // pousse vers Supabase les données déjà présentes en localStorage
    // depuis avant la mise en place de cette synchronisation, pour ne
    // pas les perdre silencieusement au premier login. Cf. bug de
    // production du 13 juillet 2026, inventaire §8bis.
    await LkSync.migrerDonneesExistantes(user.id, null);
    const resultatPrechargement = await LkSync.precharger(user.id, null);

    // Onboarding profil (v2.8, §17.7) — affiché une seule fois si le
    // niveau n'a jamais été renseigné (nouveau compte, ou compte existant
    // migré avant l'ajout de ce champ). Utilise directement localStorage
    // ici : profilCoureur/migrerVersProfilCoureur() ne sont définis que
    // plus loin dans ce fichier (après ce script), donc on ne peut pas
    // encore s'appuyer dessus à ce stade du chargement.
    //
    // Garde-fou ajouté le 20/07/2026 (bug remonté par Laurent : onboarding
    // redéclenché sur un compte existant, niveau écrasé à null en base
    // après validation). Cause : quand le préchargement Supabase échoue
    // (réseau, RLS, timeout — cf. sync-storage.js precharger()),
    // localStorage n'est jamais réhydraté avec le vrai profil. Le test
    // ci-dessous traitait alors ce localStorage vide comme "profil jamais
    // renseigné", déclenchait l'onboarding, puis écrasait le vrai profil
    // Supabase avec un profil minimal une fois validé. Ne JAMAIS
    // déclencher l'onboarding si resultatPrechargement signale un échec
    // — mieux vaut laisser l'utilisateur sur un dashboard potentiellement
    // vide temporairement (rechargera correctement au prochain essai)
    // que risquer d'écraser des données réelles.
    const profilBrut = JSON.parse(localStorage.getItem('lk_profil_coureur') || 'null');
    if ((!profilBrut || !profilBrut.niveau) && !resultatPrechargement.echecChargementProfil) {
      const complement = await LkAuth.monterEcranOnboarding('ecran-auth-hote', profilBrut || {});
      const profilMisAJour = Object.assign(
        { prenom: "", nom: "", poids: null, taille: null, fcMax: 181, pps: "", ppsDocument: null, ppsExpiration: null, records: { "5K": null, "10K": null, "Semi": null, "Marathon": null } },
        profilBrut || {},
        complement
      );
      // Dérive anneeNaissance depuis dateNaissance (01/08/2026) — même
      // logique que renderSettings() dans ce fichier (cf. ligne ~8134) :
      // depuis la refonte de l'onboarding en 4 pages, celui-ci résout
      // dateNaissance mais plus anneeNaissance directement. Sans cette
      // dérivation, computeFcMaxTanaka/calculerCategorieAgeFFA (qui ne
      // consomment que l'année) resteraient cassés pour tout compte créé
      // via l'onboarding.
      profilMisAJour.anneeNaissance = profilMisAJour.dateNaissance ? parseInt(profilMisAJour.dateNaissance.slice(0,4)) : (profilMisAJour.anneeNaissance || null);
      localStorage.setItem('lk_profil_coureur', JSON.stringify(profilMisAJour));
      // save() n'est pas encore défini à ce stade du chargement (plus loin
      // dans ce fichier) — on reproduit ici le même geste de sync que
      // save() fait pour toute autre clé (cf. définition de save(), plus
      // bas), pour que l'onboarding ne reste pas local à cet appareil.
      try {
        LkSync.synchroniserVersSupabase(user.id, null, 'lk_profil_coureur', profilMisAJour);
      } catch (e) {
        console.warn('Synchronisation profil onboarding non déclenchée :', e.message);
      }

      // Grand débutant (v2.8, §17.9) : redirection directe vers l'écran
      // dédié du wizard (jours + Strava, cf. v2/index.html), sans passer
      // par le dashboard ni l'écran de choix course/forme. On ne fait ça
      // qu'à la sortie immédiate de l'onboarding — un grand débutant qui
      // revient plus tard sur /v2 (ex. pour changer de plan) retombe sur
      // le comportement normal du wizard, pas cette redirection forcée.
      //
      // Traitée AVANT la redirection Strava directe (02/08/2026, cf.
      // ci-dessous) : l'écran dédié grand-débutant a son propre bouton
      // "Connecter Strava" avec un mécanisme de retour d'OAuth robuste
      // (sessionStorage, cf. son commentaire dans v2/index.html) — un
      // grand débutant ayant choisi Strava à la page 4 de l'onboarding
      // doit atteindre CET écran, pas partir en OAuth directement
      // court-circuitant ce mécanisme dédié.
      if (profilMisAJour.niveau === 'grand-debutant') {
        window.location.href = '/v2?onboarding=grand-debutant';
        return new Promise(() => {}); // ne résout jamais : on quitte la page
      }

      // Source de données choisie à l'onboarding (02/08/2026, demande de
      // Laurent : "on demande comment seront collectées les données ?").
      // clePourPlan() n'est pas encore définie à ce stade (comme pour
      // save()/profilCoureur, cf. commentaire plus haut) — écriture
      // directe avec la clé non préfixée, cohérente avec le repli de
      // clePourPlan() en l'absence de plan (aucun plan n'existe encore
      // pour un tout nouveau compte à ce stade).
      if (complement.dataSource) {
        localStorage.setItem('lk_data_source', complement.dataSource);
      }

      // Redirection vers la connexion Strava (02/08/2026) — SEULEMENT si
      // choisi à l'onboarding. Le profil vient d'être sauvegardé
      // ci-dessus (localStorage + synchro Supabase déjà lancée) : la
      // redirection OAuth qui suit recharge entièrement la page, mais
      // rien n'est perdu puisque le profil est déjà persisté avant ce
      // point. cf. commentaire dans auth.js (terminer()) sur ce choix de
      // conception — cette redirection reste la responsabilité de
      // l'appelant, jamais du module d'onboarding lui-même.
      if (complement.dataSource === 'strava') {
        window.location.href = '/api/strava/auth';
        return new Promise(() => {}); // ne résout jamais : on quitte la page
      }
      // Grand débutant (v2.8, §17.9) : redirection directe vers l'écran
    }

    window.__resoudreAuthPret__(user);

    // CORRECTIF (01/08/2026, bug signalé par Laurent : un record saisi à
    // l'onboarding n'apparaissait pas dans Réglages tant que la page
    // n'était pas rechargée complètement, ex. changement d'onglet
    // provoquant un rechargement navigateur) — cause : ce bloc est un
    // script de type module, donc DIFFÉRÉ par le navigateur même s'il
    // apparaît en premier dans le HTML, alors que le script classique
    // plus bas (`let profilCoureur = migrerVersProfilCoureur()`)
    // s'exécute lui IMMÉDIATEMENT à sa rencontre — donc EN RÉALITÉ AVANT
    // ce bloc-ci, malgré l'ordre inverse dans le fichier. La variable
    // globale profilCoureur capturait ainsi le localStorage D'AVANT
    // l'écriture de l'onboarding. IMPORTANT : depuis ce module séparé,
    // seul window.profilCoureur (exposé explicitement ligne ~1353) est
    // atteignable — réassigner window.profilCoureur = nouvelObjet ne
    // suffirait PAS, car renderSettings() (même script classique que la
    // déclaration `let profilCoureur`) lit la fermeture lexicale locale,
    // pas window.profilCoureur. Object.assign() MUTE l'objet existant en
    // place plutôt que de le remplacer — comme window.profilCoureur et
    // la variable locale profilCoureur pointent vers le MÊME objet, cette
    // mutation est visible des deux côtés, y compris par renderSettings().
    if (window.profilCoureur) {
      try {
        const profilFrais = JSON.parse(localStorage.getItem('lk_profil_coureur') || 'null');
        if (profilFrais) {
          Object.keys(window.profilCoureur).forEach(k => delete window.profilCoureur[k]);
          Object.assign(window.profilCoureur, profilFrais);
          if (typeof window.render === 'function') window.render();
        }
      } catch (e) {
        console.warn('Rafraîchissement profilCoureur post-onboarding non déclenché :', e.message);
      }
    }

    return user;
  });
})();
</script>

<script defer src="/engine-classic-scripts/changelog.classic.js"></script>
<script>
  // Charge (ou génère par défaut) le plan à afficher — chantier convergence
  // v1/v2, section 7 (sélection de plan depuis v1). Async car chargerPlans()
  // fait un appel réseau (fetch vers l'API GitHub Gist). Ce script ne fait
  // que PRÉPARER les données dans window.__PLAN_BRUT__/__PLAN_GENERE__ ; le
  // script principal (plus bas, qui définit render()/PLAN/ALL_SESSIONS)
  // attend la promesse window.__PLAN_PRET__ avant de s'initialiser — cf. le
  // bloc juste avant l'appel final à render() en fin de fichier.
  //
  // Le plan BRUT (avant traduction v1) est conservé sous __PLAN_BRUT__ :
  // contient les métadonnées (paramsOrigine.raceName/raceLocation/raceUrl,
  // zoneFC.fcMax, paramsOrigine.tempsReference) qui n'existent pas dans le
  // format traduit PLAN/ALL_SESSIONS — nécessaires pour ne plus coder ces
  // valeurs en dur (docs/v2-methodologie/convergence-v1-v2.md, section 7bis).
  window.__PLAN_PRET__ = (async () => {
    // Attend que le préchargement Supabase (window.__AUTH_PRET__) ait
    // résolu window.__UTILISATEUR__ AVANT d'appeler
    // LkSync.chargerPlansSupabase() plus bas — sinon celle-ci part sans
    // utilisateur connu et échoue silencieusement, avec repli sur le plan
    // par défaut. Bug découvert le 13 juillet 2026 en test de production :
    // les deux promesses démarraient en parallèle sans dépendance. Chantier
    // v2.5 migration, cf. inventaire §8bis.
    await window.__AUTH_PRET__;

    // Cache du module plan-generator.js (19/07/2026, étape 2 du chantier de
    // conversion module — cf. mémoire de session ; gist-sync.js retiré le
    // 22/07/2026, système Gist v2 démantelé — cf. inventaire §16). Même
    // pattern que _fitParserModule plus bas dans ce fichier : import()
    // dynamique, chargé une seule fois puis réutilisé, plutôt qu'un
    // <script src> statique (plan-generator.classic.js retiré). Les
    // fonctions/constantes du module sont exposées en global via
    // Object.assign(window, ...) pour rester compatibles avec tout le code
    // existant qui les appelle directement (generatePlan(), KM_BY_DISTANCE,
    // etc. sans préfixe, à de nombreux endroits de ce fichier) — pas de
    // réécriture de chaque point d'appel, seul le tout premier chargement
    // change. Chargé ici, tôt dans ce bloc, car KM_BY_DISTANCE et
    // generatePlan() sont utilisés de façon synchrone plus loin dans ce
    // même IIFE async — doivent donc être garantis disponibles AVANT.
    window._planGeneratorModule = await import("/v2/engine/plan-generator.js");
    Object.assign(window, window._planGeneratorModule);
    // plan-forme.js importe déjà plan-generator.js via de vrais import ES
    // (formatPace, riegelPredict, computeFcMaxTanaka, etc.) — doit donc

      ICONES_BADGES: window._badgesModule.ICONES_BADGES,
    });
    // session-analysis.js — extrait de index.html le 31/07/2026 (réduction
    // de la taille du fichier, module A du chantier prédicteur/laps). Vrai
    // module ES, même principe que badges.js — fonctions pures uniquement,
    // aucune mutation d'état partagé (contrairement au futur module B,
    // predictor.js, qui devra gérer la mutation de predHistory). Chargé en
    // global via window._sessionAnalysisModule, wrappers locaux définis
    // plus bas dans ce fichier à l'endroit de l'ancien bloc.
    window._sessionAnalysisModule = sessionAnalysisMod;
    // predictor.js — extrait de index.html le 31/07/2026 (module B du
    // chantier prédicteur, après session-analysis.js). Vrai module ES,
    // fonctions pures uniquement — cf. son en-tête pour le détail des
    // fonctions restées en wrapper local dans ce fichier
    // (rebuildPredHistory/verifierEtAppliquerAlluresDynamiques, trop
    // couplées à l'orchestration UI/Supabase pour être déplacées).
    window._predictorModule = predictorMod;
    // age-category.js — extrait de index.html le 13/08/2026 (chantier
    // "réduction de taille d'index.html", cf. inventaire §16). Vrai module
    // ES, fonctions pures (aucune dépendance à l'état global ni au DOM,
    // cf. son en-tête). Exposé directement en global (comme v1-bridge.js
    // ci-dessus), pas via window._xxxModule.xxx — un seul point d'appel
    // réel dans ce fichier (calculerCategorieAgeFFA, section Profil
    // coureur), inchangé par cette extraction.
    Object.assign(window, ageCategoryMod);

    const idPlanChoisi = localStorage.getItem('v2_preview_plan_id');
    let planBrut = null;
    let plansDisponibles = [];

    // Supabase — mécanisme principal (v2.8, 15/07/2026).
    try {
      if (window.__UTILISATEUR__?.id) {
        plansDisponibles = await LkSync.chargerPlansSupabase(window.__UTILISATEUR__.id);
      }
    } catch (e) {
      console.warn('Chargement des plans depuis Supabase échoué :', e.message);
    }

    if (plansDisponibles.length > 0) {
      planBrut = idPlanChoisi ? plansDisponibles.find(p => p.id === idPlanChoisi) : null;
      if (!planBrut) {
        // Repli : plusieurs plans actifs possibles (ex: deux courses dont
        // les dates ne se chevauchent pas) — on ne peut plus se fier à
        // l'ordre de création (chargerPlansSupabase() trie par created_at
        // DESC), qui ne correspond pas forcément au plan le plus pertinent
        // du moment. On choisit la course dont la date est la plus proche
        // dans le futur (aujourd'hui inclus) ; un plan Forme (pas de
        // dateCourse, cycle glissant) n'a pas cette notion et n'est retenu
        // ici que s'il n'y a aucun plan course à venir. Bug découvert le
        // 15 juillet 2026 : avec deux plans course légitimes en parallèle
        // (dates non chevauchantes), l'app chargeait systématiquement le
        // plus récemment créé au lieu du plus pertinent, provoquant une
        // redirection vers le profil quand ce plan n'était pas celui
        // attendu par Laurent.
        const aujourdhui = new Date().toISOString().slice(0, 10);
        const plansCourseAVenir = plansDisponibles
          .filter(p => p.mode !== 'forme' && p.dateCourse && p.dateCourse >= aujourdhui)
          .sort((a, b) => a.dateCourse < b.dateCourse ? -1 : 1);
        planBrut = plansCourseAVenir[0] || plansDisponibles[0];
      }
    }

      // Repli : aucun plan trouvé (Supabase ET Gist vides — compte neuf,
      // tous les plans supprimés, ou pas encore de token configuré). Un
      // plan minimal est quand même généré pour que PLAN/ALL_SESSIONS et
      // les nombreuses lectures directes de window.__PLAN_BRUT__.* dans ce
      // fichier (paramsOrigine, semaines, etc.) restent toutes valides sans
      // vérification de nullité partout — mais il est marqué
      // estPlanRepli:true, lu par renderDashboard() pour afficher un vrai
      // état "Aucun plan en cours" plutôt que ce contenu factice.
      //
      // BUG CORRIGÉ (15/07/2026, signalé par Laurent) : avant ce correctif,
      // ce plan par défaut (paramètres historiques de Laurent, "10 km
      // Gem'Aubagne") s'affichait tel quel comme un vrai plan actif dès que
      // la liste de plans était vide — trompeur, en particulier après une
      // purge de compte légitime (cf. correctif sécurité déconnexion) où
      // "aucun plan" est un état parfaitement normal à afficher clairement,
      // pas à masquer derrière un plan qui n'a jamais existé pour ce compte.
      planBrut = generatePlan(
        { niveau: 'intermediaire', joursDisponiblesHabituels: [1,2,3,4,5,6], fcMaxConnue: 181 },
        { distance: '10K', refDistance: '10K', tempsReference: '50:21', objectif: '48:30', dateDebut: '2026-06-22', dateCourse: '2026-09-06', volumeActuel: 30, contraintesPonctuelles: [], raceName: "10 km Gem'Aubagne", raceLocation: 'Aubagne', raceUrl: 'https://new.sportsnconnect.com/client/events/4qa4QCJ1DtZYPSzSCbjJJK-5-and-10-km-gemaubagne' }
      );
      // Garde-fou (24/07/2026, cf. VOLUME_JOURS_INCOMPATIBLE dans
      // plan-generator.js) : ces paramètres historiques sont déjà validés
      // OK (30km/6j/10K, testé), donc planInvalide ne devrait jamais se
      // déclencher ici — mais si les seuils du moteur évoluaient un jour,
      // mieux vaut un plan minimal explicite que planBrut.id qui plante sur
      // {planInvalide:true} sans aucun champ attendu par le reste du code.
      if (planBrut?.planInvalide) {
        console.error('Plan de repli par défaut refusé par le moteur (ne devrait jamais arriver) :', planBrut.message);

      // n'assigne jamais d'id — seul le wizard v2 le fait
      // (crypto.randomUUID()) après génération. Sans id ici, clePourPlan()
      // retombe sur la clé lk_statuses NON préfixée (ancien résidu global,
      // cf. section 7quater), invisible tant qu'un vrai plan avec id est
      // utilisé mais qui refait surface dès qu'on retombe sur ce repli
      // (ex: sauvegarde échouée silencieusement à cause d'un chevauchement
      // de dates, section 7ter — le plan n'atteint jamais le Gist, l'id

      // l'autre) évite ce retour silencieux vers l'ancienne clé globale.

    // longue à 0min sur la semaine EN COURS, pas seulement les semaines
    // précédentes). Cause racine : semaineDepartVolume (paramètre
    // transitoire du levier Volume, cf. plan-generator.js et v2/index.html)
    // pouvait rester "collé" dans paramsOrigine d'un plan déjà sauvegardé
    // AVANT le correctif appliqué à v2/index.html — ce correctif empêche
    // la pollution de se PRODUIRE à l'avenir, mais ne répare pas un plan
    // déjà cassé en base. Si semaineDepartVolume traîne encore ici, il
    // pollue TOUTE régénération future de ce plan (y compris la semaine
    // courante, si elle est antérieure à cette charnière obsolète) —
    // computeVolumeProgression() (plan-generator.js) ne produit aucune
    // entrée de volume pour les semaines avant semaineDepart, donc
    // volumeCibleKm retombe à null/0 pour elles, et repartirVolumeSemaine
    // donne 0km à l'EF et à la longue.
    //
    // Nettoyage silencieux : si le champ est présent, on le retire des
    // paramsOrigine sauvegardés et on régénère le plan à partir de
    // paramsOrigine propre — restaure une vraie progression de volume dès
    // la semaine 1, cohérent avec ce qu'aurait dû être ce plan depuis le
    // début (le levier Volume n'a de sens QUE le temps de son propre appel
    // à generatePlan(), jamais comme état durable). Best-effort : si la
    // régénération échoue pour une raison quelconque (plan invalide,
    // paramsOrigine absent), on garde le plan tel quel plutôt que de
    // bloquer le chargement de l'app.
    // RÉPARATION DÉFINITIVE (06/08/2026) — détection DIRECTE des semaines
    // cassées par leur symptôme réel (volumeCibleKm absent/nul avec EF ou
    // longue à 0km), plutôt que par la présence de semaineDepartVolume dans
    // paramsOrigine. Nécessaire car ce champ peut avoir déjà disparu de
    // paramsOrigine (ex. après un usage ultérieur du levier Volume, dont le
    // correctif de v2/index.html retire bien semaineDepartVolume avant
    // sauvegarde) SANS que les semaines déjà cassées avant ce nettoyage

    // manquait ce cas (bug persistant signalé par Laurent malgré le premier
    // correctif — la condition de déclenchement ne se déclenchait jamais).
    //
    // Réparation semaine par semaine (pas une régénération globale) :
    // reconstruit uniquement le contenu EF/longue des semaines cassées, à
    // partir du volume hebdo qu'elles AURAIENT dû avoir selon la vraie
    // progression recalculée depuis paramsOrigine — jamais les séances
    // qualité (jamais cassées par ce bug, cf. diagnostic avec Laurent) ni
    // les autres semaines (non affectées, laissées intactes).
    //
    // Protection identique au correctif précédent : une semaine
    // STRICTEMENT PASSÉE (tous ses jours avant aujourd'hui) n'est jamais
    // réparée automatiquement, même si cassée — seul un avertissement le
    // signale, pour ne jamais réécrire une séance déjà vécue par le
    // coureur. Semaine en cours et futures : réparées (risque assumé par
    // Laurent pour la semaine en cours, cf. échange du 06/08/2026).
    if (planBrut?.profilOrigine && planBrut?.paramsOrigine && Array.isArray(planBrut?.semaines)) {
      try {
        const semainesCasseesIdx = [];
        planBrut.semaines.forEach((s, idx) => {
          const efOuLongueA0 = Object.values(s.assignment || {}).some(
            seance => (seance.type === 'ef' || seance.type === 'longue') && seance.kmEstime === 0
          );
          if (efOuLongueA0) semainesCasseesIdx.push(idx);
        });

        if (semainesCasseesIdx.length > 0) {
          const debutPlanRepar = planBrut.dateDebut ? new Date(planBrut.dateDebut + 'T00:00:00Z') : null;
          const aujourdhuiRepar = new Date();
          const aujourdhuiStrRepar = new Date(Date.UTC(aujourdhuiRepar.getFullYear(), aujourdhuiRepar.getMonth(), aujourdhuiRepar.getDate())).toISOString().slice(0, 10);

          // paramsOrigine propre, sans semaineDepartVolume résiduel s'il
          // traîne encore (defensive, cf. correctif précédent) — sert de
          // base pour recalculer la VRAIE progression de volume attendue.
          const { semaineDepartVolume, ...paramsOriginePropres } = planBrut.paramsOrigine;

          // Utilise plan.volumeCourant en PRIORITÉ s'il existe (06/08/2026,
          // suite au signalement de Laurent : une réparation avait
          // recalculé 39km sur sa semaine en cours en ignorant qu'il avait
          // réglé 33km via le levier Volume) — ce champ, écrit par
          // appliquerChangementVolume() (v2/index.html), préserve la
          // DERNIÈRE intention réelle de volume, distincte de
          // paramsOrigine.volumeActuel qui reste le volume de départ
          // HISTORIQUE du plan (jamais modifié après coup). Sans lui, la
          // régénération de réparation repart toujours du volume
          // d'origine et "oublie" silencieusement tout ajustement fait
          // depuis via ce levier. Repli sur paramsOriginePropres.volumeActuel
          // (comportement historique) si aucun volumeCourant n'a jamais
          // été enregistré (plan jamais modifié via ce levier).
          const paramsPourReparation = planBrut.volumeCourant
            ? { ...paramsOriginePropres, volumeActuel: planBrut.volumeCourant.km, semaineDepartVolume: planBrut.volumeCourant.semaineNum }
            : paramsOriginePropres;
          const planRegenere = generatePlan(planBrut.profilOrigine, paramsPourReparation);

          if (!planRegenere?.planInvalide && debutPlanRepar) {
            let semainesReparees = 0;
            let semainesEncorePolluees = 0;

            semainesCasseesIdx.forEach(idx => {
              const semaineAncienne = planBrut.semaines[idx];
              const semaineRegeneree = planRegenere.semaines.find(s => s.semaineNum === semaineAncienne.semaineNum);
              if (!semaineRegeneree) return;

              const datesJoursSemaine = Object.keys(semaineAncienne.assignment || {}).map(jourIndex => {
                const d = new Date(debutPlanRepar);
                d.setUTCDate(debutPlanRepar.getUTCDate() + (semaineAncienne.semaineNum - 1) * 7 + Number(jourIndex));
                return d.toISOString().slice(0, 10);
              });
              const semaineStrictementPassee = datesJoursSemaine.length > 0 && datesJoursSemaine.every(d => d < aujourdhuiStrRepar);

              if (semaineStrictementPassee) {
                semainesEncorePolluees++;
                return;
              }

              // Répare UNIQUEMENT les jours EF/longue de cette semaine,
              // avec le contenu régénéré — la ou les séances qualité déjà
              // présentes dans planBrut restent inchangées (jamais cassées
              // par ce bug, pas de raison de les toucher).
              Object.keys(semaineAncienne.assignment).forEach(jourIndex => {
                const seanceAncienne = semaineAncienne.assignment[jourIndex];
                const seanceRegeneree = semaineRegeneree.assignment[jourIndex];
                if (!seanceRegeneree) return;
                if ((seanceAncienne.type === 'ef' || seanceAncienne.type === 'longue') && seanceAncienne.kmEstime === 0) {
                  semaineAncienne.assignment[jourIndex] = { ...seanceAncienne, ...seanceRegeneree };
                }
              });
              semaineAncienne.volumeCibleKm = semaineRegeneree.volumeCibleKm;
              semainesReparees++;
            });

            if (semainesReparees > 0) {
              window.__PLAN_BRUT__ = planBrut;
              console.info(`Plan réparé : ${semainesReparees} semaine(s) EF/longue à 0km corrigée(s).`);
              if (window.__UTILISATEUR__?.id && window.LkSync?.mettreAJourPlanSupabase && planBrut.id) {
                LkSync.mettreAJourPlanSupabase(planBrut.id, planBrut).catch(e =>
                  console.warn('Re-sauvegarde du plan réparé (EF/longue 0km) échouée :', e.message)
                );
              }
            }
            if (semainesEncorePolluees > 0) {
              planBrut.warnings = [
                ...(planBrut.warnings ?? []),
                {
                  code: 'SEMAINE_PASSEE_NON_REPAREE',
                  message: `${semainesEncorePolluees} semaine(s) déjà passée(s) gardent un volume EF/longue à 0 (jamais réécrit sur du contenu déjà vécu). Contacte le support si besoin d'une correction manuelle de ces semaines précises.`
                }
              ];
            }
          }
        }
      } catch (e) {
        console.warn('Réparation EF/longue à 0km échouée, plan conservé tel quel :', e.message);
      }
    }

    // Toujours pas de rattrapage rétroactif pour "pourquoi cette séance" —
    // décision inchangée (cf. discussion avec Laurent : coût de code
    // permanent trop élevé pour un bénéfice purement cosmétique).
    //
    // Correctif ciblé réintroduit UNIQUEMENT pour la phrase redondante de
    // genererContenuTest() ("sert à confirmer/recalibrer ton allure
    // objectif") — Laurent la voyait encore sur un plan déjà généré avant
    // le retrait côté moteur, et contrairement à "pourquoi cette séance"
    // (une vraie logique de complétion, exécutée sur chaque séance), ce
    // correctif est un simple remplacement de texte, très léger, qui ne
    // justifiait pas d'être exclu au même titre. Garde le principe acté :
    // pas de correctif pour un pur confort cosmétique SAUF demande
    // explicite de réintroduction, comme ici.
    if (planBrut?.semaines) {
      try {
        const phraseObsolete = ", sert à confirmer/recalibrer ton allure objectif";
        planBrut.semaines.forEach(s => {
          Object.values(s.assignment || {}).forEach(seance => {
            if (seance.contenu && seance.contenu.includes(phraseObsolete)) {
              seance.contenu = seance.contenu.replace(phraseObsolete, "");
            }
          });
        });
      } catch (e) {
        console.warn('Nettoyage phrase redondante séance test échoué, plan conservé tel quel :', e.message);
      }
    }

    window.__PLAN_GENERE__ = traduirePlanVersFormatV1(planBrut);
    window.__PLANS_DISPONIBLES__ = plansDisponibles;
  })();
</script>

// connu (window.__PLAN_BRUT__.id) — remplit localStorage avec les
// données préfixées par plan (lk_statuses_xxx, lk_notes_xxx, etc.) AVANT
// que les lignes `let x = load(clePourPlan("lk_..."), défaut)` plus bas
// dans ce même script ne s'exécutent. Chantier v2.5, 13 juillet 2026.
// migrerDonneesExistantes() est idempotente (marqueur localStorage) —
// l'appeler ici aussi permet de rattraper les données préfixées par
// plan qui n'avaient pas encore de planId connu lors du premier appel
// (juste après connexion, avant que le plan soit chargé).
// assurerPlanExiste() DOIT être appelée en premier, avant tout appel
// touchant plan_donnees (migrerDonneesExistantes, precharger, et
// chaque save() plus tard) — plan_donnees.plan_id a une contrainte de
// clé étrangère vers plans.id, donc toute écriture échoue en 409 tant
// qu'aucune ligne n'existe côté plans. Bug découvert en test de
// production le 13 juillet 2026, cf. inventaire §8bis.
if (window.__UTILISATEUR__ && window.__PLAN_BRUT__?.id) {
  await LkSync.assurerPlanExiste(window.__UTILISATEUR__.id, window.__PLAN_BRUT__.id, window.__PLAN_BRUT__);
  await LkSync.migrerDonneesExistantes(window.__UTILISATEUR__.id, window.__PLAN_BRUT__.id);
  await LkSync.precharger(window.__UTILISATEUR__.id, window.__PLAN_BRUT__.id);

  // Realtime — ajouté le 13 juillet 2026. Un changement fait sur un autre
  // appareil (même compte) déclenche ce callback : on relit les données
  // fraîches depuis Supabase (precharger, qui écrase localStorage), puis
  // on ré-exécute les mêmes lectures que celles faites au chargement
  // (statuses, notes, etc.) avant de redemander un rendu. Pas de retry
  // ni de gestion d'erreur poussée ici — un échec silencieux n'est pas
  // grave, le prochain rechargement de page rattrapera de toute façon.
  //
  // CORRECTIF (04/08/2026, recherche approfondie sur le clignotement à
  // l'ouverture signalé par Laurent, confirmé par test Performance +
  // Screenshots : vraie page blanche de ~750ms à ~1.85s avant le premier
  // affichage) — ce `await` bloquait le render() final juste après (plus
  // bas dans ce script) : établir un canal WebSocket (activerRealtime
  // appelle supabase.channel(...).subscribe()) est structurellement plus
  // lent qu'un simple fetch REST (handshake de connexion), et la synchro
  // temps réel entre appareils est un BONUS — utile si un autre appareil
  // modifie quelque chose pendant que cette session est ouverte, mais
  // absolument pas un prérequis pour afficher le dashboard une première
  // fois avec les données déjà préchargées par le await precharger()
  // juste au-dessus. Retiré ce await : le canal continue de s'établir en
  // arrière-plan (fire-and-forget), sans plus retarder le premier
  // render(). Non testé en conditions réelles par Claude (limite
  // d'environnement) — à valider par Laurent avant de considérer ce
  // correctif acquis.
  LkSync.activerRealtime(window.__PLAN_BRUT__.id, async () => {
    await LkSync.precharger(window.__UTILISATEUR__.id, window.__PLAN_BRUT__.id);
    statuses = load(clePourPlan("lk_statuses"), {});
    hiddenSessions = load(clePourPlan("lk_hidden_sessions"), {});
    swappedSessions = load(clePourPlan("lk_swapped_sessions"), {});
    notesList = load(clePourPlan("lk_notes"), []);
    sessionNotes = load(clePourPlan("lk_session_notes"), {});
    // Correctif 26/07/2026 (bug badge 😴) : ALL_SESSIONS n'était jamais
    // recalculée après ce rechargement de statuses depuis Supabase (autre
    // appareil) — render() redessinait avec statutEffectif figé sur
    // l'ancienne valeur (souvent 😴 auto-inféré à tort).
    if (typeof recalculerAllSessions === 'function') ALL_SESSIONS = recalculerAllSessions();
    render();
  });
}

// Recalculable via recalculerAllSessions() plutôt que figée en const :
// nécessaire pour la future sélection de plan (docs/v2-methodologie/
// convergence-v1-v2.md, section 7) — si un autre plan est chargé après le
// démarrage, ALL_SESSIONS doit être reconstruite depuis le nouveau PLAN,
// pas rester sur l'ancien.
// BUG corrigé le 22/07/2026 (signalé par Laurent : "déplacement manuel
// bug") : ALL_SESSIONS était construite depuis w.sessions[i] BRUT, sans
// jamais tenir compte de swappedSessions — seul renderWeekDetail()
// (l'affichage de la carte) appliquait le swap via getEffectiveSession().
// Conséquence : après un déplacement manuel (ex. séance VMA glissée vers
// un jour repos), l'écran montrait bien le nouveau placement, mais TOUT
// le reste de l'app (moteur de décision, INTERVAL_SESSION_DATES, matching
// Strava/structureIntervalles, prédicteur 10K, stats) continuait de lire
// l'ancien placement — 67 usages de ALL_SESSIONS dans ce fichier, aucun
// n'était au courant du swap. Corrigé à la source : recalculerAllSessions()
// applique désormais getEffectiveSession() lui-même, une seule fois, pour
// que tous les consommateurs en bénéficient automatiquement sans devoir
// être modifiés un par un. La date du slot affiché (s.date) est conservée
// (c'est le jour calendaire réel où la séance doit être faite/a été
// faite), seul le CONTENU de la séance (type, structureIntervalles,
// contenu, kmEstime...) vient du swap le cas échéant.
function recalculerAllSessions() {
  // statutEffectif ajouté le 22/07/2026 (suite discussion avec Laurent sur
  // le badge 😴) : "😴" (repos/sauté) auto-appliqué UNIQUEMENT à
  // l'affichage/calcul, jamais écrit dans statuses[uid] lui-même — pour un
  // jour déjà PASSÉ (s.date < today(), jamais le jour même) sans statut
  // réellement saisi ("—" ou absent). Calculé ICI, au même endroit
  // centralisateur que le fix des swaps ci-dessus, pour que TOUS les
  // consommateurs de ALL_SESSIONS (stats, moteur de décision, garde du
  // swap, badge visuel) voient la même valeur — avant ce changement, seul
  // renderWeekDetail() calculait ce même badge dans son coin, invisible
  // du reste de l'app (stats/moteur continuaient de compter ces séances
  // comme "—", pas comme repos volontaire).
  //
  // Garde try/catch (pas typeof, cf. bug écran blanc du 22/07/2026 sur
  // swappedSessions) : statuses est déclarée en "let" PLUS LOIN dans ce
  // fichier (ligne ~699) — le tout premier appel à recalculerAllSessions()
  // (ligne ~656, juste après cette fonction) a lieu AVANT cette
  // déclaration, donc toute référence à statuses ici lève une vraie
  // ReferenceError (temporal dead zone), pas juste "undefined".
  let statutsActuels = {};
  try { statutsActuels = statuses; } catch (e) { /* TDZ au tout premier appel, aucun statut n'existe encore de toute façon */ }
  const aujourdhui = today();

  return PLAN.flatMap(w => w.sessions.map((s,i) => {
    const effSess = (typeof getEffectiveSession === 'function' ? getEffectiveSession(w, i) : null) || s;
    const uid = `${w.week}-${i}`;
    const statutBrut = statutsActuels[uid];
    const estPasse = s.date < aujourdhui;
    const statutEffectif = (!statutBrut || statutBrut === "—") && estPasse && effSess.type !== "REPOS"
      ? "😴"
      : (statutBrut || "—");
    return {...effSess, date: s.date, week:w.week, phase:w.phase, uid, statutEffectif};
  }));
}

function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } }
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  // Synchronisation Supabase en arrière-plan (fire-and-forget) — ajouté
  // le 13 juillet 2026, chantier v2.5 migration (inventaire §8bis).
  // N'attend pas la réponse réseau : localStorage reste la source de
  // vérité immédiate pour l'affichage, Supabase suit derrière.
  try {
    LkSync.synchroniserVersSupabase(
      window.__UTILISATEUR__?.id,
      window.__PLAN_BRUT__?.id,
      key,
      val
    );
  } catch (e) {
    console.warn('Synchronisation Supabase non déclenchée :', e.message);
  }
}

// ── Adaptateur avec RPE — 17/07/2026 (chantier "RPE unifié") ──────────────
// DecisionEngineAdapter.adapterHistoriqueComplet() ne peuple jamais
// ressentiRPE, volontairement (commentaire du module : "mieux vaut ne rien
// inventer qu'associer un RPE à la mauvaise séance" — cette fonction ne
// reçoit que des activités Strava brutes, sans notion de séance du plan/
// uid, donc pas de correspondance possible en interne). Recommandation
// suivie le 17/07/2026 : faire cette correspondance ici, côté appelant
// (index.html connaît à la fois stravaActivities ET ALL_SESSIONS/
// sessionRpe/manualPerf), plutôt que de modifier la signature du module —
// respecte le principe du module tout en le rendant réellement exploitable.
// Remplace adapterHistoriqueComplet(stravaActivities, {}, ...) dans les 3
// appelants qui en avaient besoin (ACWR consigne coach, ACWR graphique,
// calculerEtatMoteurDecision) — la correspondance ressentiRPE est
// désormais présente pour toute activité dont la date correspond à une
// séance du plan avec un RPE renseigné (sessionRpe en priorité, repli sur
// manualPerf pour compat ascendante, cf. déclaration de sessionRpe plus
// haut dans ce fichier).
function adapterHistoriqueAvecRpe(stravaActivitiesListe, provenanceDeclaree) {
  if (typeof DecisionEngineAdapter === 'undefined') return [];
  const activites = stravaActivitiesListe || [];
  // Index date -> uid (une seule séance par jour dans ce plan, cohérent
  // avec le reste de l'app qui indexe déjà les activités par date sans
  // gérer plusieurs séances le même jour)
  const uidParDate = {};
  (typeof ALL_SESSIONS !== 'undefined' ? ALL_SESSIONS : []).forEach(s => {
    if (s.date) uidParDate[s.date] = s.uid;
  });
  const samplesStrava = activites
    .filter(a => a.type === 'Run')
    .filter(a => {
      // Exclusion Strava si saisie manuelle (17/07/2026, décision explicite :
      // une saisie manuelle signale souvent une donnée Strava corrompue ou
      // absente ce jour-là, elle ne doit jamais coexister avec Strava dans
      // le moteur — cohérent avec getStravaRunSiPasManuel() côté UI).
      const dateActivite = a.start_date_local ? a.start_date_local.slice(0, 10) : null;
      const uid = dateActivite ? uidParDate[dateActivite] : null;
      return !(uid && manualPerf[uid]);
    })
    .map(a => {
      const dateActivite = a.start_date_local ? a.start_date_local.slice(0, 10) : null;
      const uid = dateActivite ? uidParDate[dateActivite] : null;
      const rpeSaisi = uid
        ? (sessionRpe[uid] || (manualPerf[uid] && manualPerf[uid].rpe) || null)
        : null;
      return DecisionEngineAdapter.adapterActiviteStrava(a, provenanceDeclaree, rpeSaisi);
    })
    .filter(sample => sample.date !== null);

  // Séances à saisie manuelle (17/07/2026) : Strava exclu ci-dessus, mais la
  // séance ne doit pas disparaître du moteur pour autant — reconstruction
  // d'un objet Strava-like synthétique à partir de manualPerf, passé par le
  // même adaptateur pour ne jamais dupliquer la logique de conversion.
  const uidsAvecSaisieManuelle = Object.keys(manualPerf).filter(uid => manualPerf[uid]);
  const samplesManuels = (typeof ALL_SESSIONS !== 'undefined' ? ALL_SESSIONS : [])
    .filter(s => uidsAvecSaisieManuelle.includes(s.uid))
    .map(s => {
      const mp = manualPerf[s.uid];
      if (!mp.average_speed) return null;
      const dureeSec = mp.dureeSaisieMin ? mp.dureeSaisieMin * 60
        : (mp.distance && mp.average_speed ? mp.distance / mp.average_speed : null);
      if (!dureeSec) return null;
      const rpeSaisi = sessionRpe[s.uid] || mp.rpe || null;
      const activiteSynthetique = {
        id: s.uid,
        start_date_local: s.date + "T12:00:00",
        distance: mp.distance || (mp.average_speed * dureeSec),
        moving_time: dureeSec,
        average_speed: mp.average_speed,
        average_heartrate: mp.average_heartrate || undefined,
        type: 'Run',
      };
      return DecisionEngineAdapter.adapterActiviteStrava(activiteSynthetique, 'manuel', rpeSaisi);
    })
    .filter(sample => sample && sample.date !== null);

  return [...samplesStrava, ...samplesManuels];
}

  if (typeof DecisionEngineAdapter === 'undefined' || typeof DecisionEngineRunnerState === 'undefined') return null;
  if (!stravaActivities || !stravaActivities.length) return null;

// ── Séances planifiées ratées consécutives, pour R-070 du RuleEngine ───────
// (17/07/2026). Contrairement à DecisionEngineEngagement.regulariteRecente
// (qui compare l'historique Strava réalisé à une fréquence habituelle sans
// connaître le plan), cette fonction lit directement le PLAN et les statuts
// ✅/⚠️/❌ (ALL_SESSIONS/statuses, déjà existants dans index.html) pour
// détecter un enchaînement précis de séances PRÉVUES et RATÉES — un signal
// que le RuleEngine ne peut pas calculer lui-même car il ne connaît que
// runnerState/engagementState/activitySamples, jamais __PLAN_BRUT__/statuses
// (isolation volontaire du moteur vis-à-vis du plan, cf. decision-engine-rules
// §"Ce module ne modifie AUCUNE donnée"). Le résultat est calculé ici et
// simplement transmis en input à evaluerRegles(), sans que le module R-070
// lui-même ait besoin d'accéder au plan.
function obtenirSeancesPlanifieesManquees() {
  const aujourdhui = new Date().toISOString().slice(0, 10);
  // Bug corrigé le 27/07/2026 (signalé par Laurent : la carte affichait "2
  // séances de qualité ratées d'affilée" en citant un EF et une LONGUE — ni
  // l'une ni l'autre n'est une séance qualité). Cause : ce filtre sur
  // seancesPassees ne restreignait JAMAIS aux types VMA/SEUIL/SPEC malgré
  // le libellé R-070 ("Séances de qualité ratées consécutives") et le
  // commentaire de conception dans decision-engine-rules.classic.js
  // ("le signal dit précisément 'tu rates tes séances de qualité', alléger
  // une EF ne répond pas à ce problème") — la fonction regardait en réalité
  // les 2 dernières séances passées, peu importe leur type. Ajout du filtre
  // sur les mêmes types qualité utilisés partout ailleurs dans ce fichier
  // (cf. ["VMA","SEUIL","SPEC"], ex. ligne ~4028).
  const seancesPassees = ALL_SESSIONS
    .filter(s => s.date && s.date <= aujourdhui && ["VMA","SEUIL","SPEC"].includes(s.type))
    .sort((a, b) => a.date.localeCompare(b.date));

  if (seancesPassees.length < 2) {
    return { nbConsecutivesRatees: 0, dernieresSeances: [] };
  }

  // Les 2 dernières séances passées, dans l'ordre chronologique.
  // Utilise statutEffectif (22/07/2026, cf. fiabilitePlanPonderee même
  // correctif) plutôt que statuses[s.uid] directement — une séance passée
  // jamais cochée (statutEffectif="😴") est un vrai signal de
  // désengagement pour ce calcul, pas une absence de donnée à ignorer.
  // Avant ce correctif, toutesRatees (❌ strict) ne se déclenchait jamais
  // pour des séances simplement oubliées, malgré l'intention documentée
  // ci-dessus ("détecter un enchaînement PRÉVUES et RATÉES").
  const deuxDernieres = seancesPassees.slice(-2);
  const statutsRecents = deuxDernieres.map(s => ({ date: s.date, type: s.type, statut: s.statutEffectif || '—' }));

  const toutesRatees = statutsRecents.every(s => s.statut === '❌' || s.statut === '😴');

  return {
    nbConsecutivesRatees: toutesRatees ? 2 : 0,
    dernieresSeances: statutsRecents,
  };
}

// ── État complet du moteur de décision, calcul unique partagé (§9.1 doc ────
// intégration : "le coach IA devient un habillage du moteur, jamais un
// second décideur") — utilisé à la fois par moteurDecisionEl (carte de
// proposition, ligne ~2275) et fetchCoachMsg (prompt du coach IA). Un seul
// calcul, jamais deux exécutions séparées qui pourraient diverger.
// Retourne { runnerState, engagementState, decision } ou null si les scripts
// du moteur ne sont pas chargés, pas d'activités, ou erreur de calcul —
// jamais d'exception qui remonterait au dashboard.
//
// weekAnalysis/trendAnalysis (Modules 3/4) branchés dans l'input du 17/07/2026
// (session ultérieure) — décision explicite de Laurent : ajouter ces données
// à l'input, sans qu'aucune règle ne les consomme dans un premier temps
// (cf. inventaire §32). Complété plus tard dans la même session ultérieure :
// R-062 (cf. decision-engine-rules.classic.js) consomme désormais
// trendAnalysis.signauxDetectes (signal FATIGUE_CROISSANTE) — weekAnalysis
// reste inconsommé pour l'instant. evaluerRegles() ignore silencieusement
// tout champ qu'aucune règle ne lit — aucun risque de régression sur les
// décisions déjà produites par les règles existantes.
// analyserSemaineActuelle()/analyserTendance() (déclarées plus bas dans ce
// fichier, hoisting JS standard donc accessibles ici sans souci d'ordre)
// peuvent retourner null (pas assez de semaines, script non chargé) — dans
// ce cas weekAnalysis/trendAnalysis restent simplement null dans l'input,
// comme sessionAnalysis l'est déjà pour EngineInput (cf. doc archi, champ
// optionnel "absent si pas de séance récente à évaluer").
//
// RPE unifié (17/07/2026, même chantier) : adapterHistoriqueAvecRpe()
// remplace adapterHistoriqueComplet() ici — le Module 1 (fatigue/ACWR)
// bénéficie désormais du RPE saisi via renderStatusRow(), plus seulement
// TRIMP sur FC. Cohérent avec la même correction appliquée à
// obtenirRatioACWRActuel()/obtenirHistoriqueACWR() juste au-dessus.
function calculerEtatMoteurDecision() {
  if (typeof DecisionEngineAdapter === 'undefined' || typeof DecisionEngineRunnerState === 'undefined'
      || typeof DecisionEngineEngagement === 'undefined' || typeof DecisionEngineRules === 'undefined') return null;
  try {
    const samples = adapterHistoriqueAvecRpe(window.stravaActivities || [], "strava_gratuit");
    const runnerState = DecisionEngineRunnerState.calculerRunnerState(samples, optionsRunnerStateActuel());
    const engagementState = DecisionEngineEngagement.calculerEngagementState(samples, {});
    const weekAnalysis = typeof analyserSemaineActuelle === 'function' ? analyserSemaineActuelle(currentWeek()) : null;
    const trendAnalysis = typeof analyserTendance === 'function' ? analyserTendance(6) : null;
    const resultatMoteur = DecisionEngineRules.evaluerRegles({
      runnerState,
      engagementState,
      activitySamples: samples,
      coureurOptions: optionsRunnerStateActuel(),
      seancesPlanifieesManquees: obtenirSeancesPlanifieesManquees(),
      weekAnalysis,
      trendAnalysis,
    });
    return { runnerState, engagementState, weekAnalysis, trendAnalysis, decision: resultatMoteur ? resultatMoteur.decision : null };
  } catch (err) {
    console.warn("Moteur de décision : erreur de calcul.", err.message);
    return null;
  }
}

// Modulation de l'ampleur d'une décision reduire_charge selon le readiness
// du jour — 23/07/2026, conception validée avec Laurent (option C). Le
// RuleEngine reste totalement inchangé (ne connaît jamais le readiness) :
// c'est un post-traitement appliqué juste avant affichage/application.
// Règles :
//   - readiness "fatigue" pousse l'ampleur au palier suivant DÉJÀ CONNU du
//     système (-15 → -25), jamais au-delà, jamais si déjà à -25 (ou plus).
//   - readiness "normal"/"forme" (ou absent) : aucune modification, jamais
//     de modulation à la baisse.
// Retourne l'ampleurPourcent modulée (nombre), jamais l'objet decision
// entier — appelant responsable de construire une copie de la décision.
const PALIERS_AMPLEUR_CONNUS = [-15, -25]; // seules valeurs produites par R-024s/R-050 actuellement
function moduleAmpleurSelonReadiness(ampleurPourcent, readinessVal) {
  if (readinessVal !== "fatigue") return ampleurPourcent;
  const indexActuel = PALIERS_AMPLEUR_CONNUS.indexOf(ampleurPourcent);
  if (indexActuel === -1 || indexActuel === PALIERS_AMPLEUR_CONNUS.length - 1) {
    // Ampleur inconnue de la table, ou déjà au palier le plus élevé connu
    // (-25) : rien à pousser plus loin, le readiness ne peut pas dépasser
    // ce que le système sait déjà proposer.
    return ampleurPourcent;
  }
  return PALIERS_AMPLEUR_CONNUS[indexActuel + 1];
}

  }
}

// Affichage plein écran du PPS (01/08/2026) — but : accès en un tap au
// retrait de dossard, sans naviguer dans Réglages. Image affichée
// directement ; PDF ouvert dans un nouvel onglet (rendu inline non fiable
// en PWA/TWA selon l'OS — laisser le lecteur PDF natif s'en charger est
// plus robuste qu'un <iframe>).
// Chargement à la demande de pdf.js (même pattern que chargerFitParser
// pour le FIT — cf. commentaire associé) : utilisé pour deux choses
// distinctes — (1) extraire le texte d'un PDF PPS importé afin de tenter
// de lire automatiquement la date d'expiration ("EXPIRE LE JJ/MM/AAAA"),
// (2) rien d'autre pour l'instant, l'aperçu du PDF passe par un <iframe>
// natif sur le blob, pas par un rendu canvas pdf.js. Version pinned et
// worker configuré explicitement (obligatoire avec pdf.js, sinon échec
// silencieux au premier getDocument()).
let _pdfJsModule = null;
async function chargerPdfJs() {
  if (_pdfJsModule) return _pdfJsModule;
  const mod = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs");
  mod.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";
  _pdfJsModule = mod;
  return _pdfJsModule;
}

// Conversion PDF → image à l'import (02/08/2026, remplace le stockage du
// PDF brut) — corrige un vrai problème constaté en test réel : le rendu
// PDF via <iframe>/<embed> sur un blob URL n'a pas de lecteur PDF intégré
// fiable sur mobile/TWA Android (contrairement à desktop où Chrome a son
// viewer PDF natif) — Laurent voyait "PDF grisé + bouton Ouvrir" qui ne
// menait nulle part. Rendu de la première page en canvas via pdf.js, puis
// conversion JPEG — un seul chemin d'affichage (image) fiable partout,
// réutilise directement <img> comme pour une photo importée. Compromis
// assumé : si un PPS FFA devait un jour tenir sur plusieurs pages utiles,
// seule la première serait conservée — le gabarit observé tient
// entièrement sur une page (photo, QR, infos).
//
// Extraction automatique de la date d'expiration TENTÉE puis RETIRÉE
// (02/08/2026) : le texte "EXPIRE LE JJ/MM/AAAA" du gabarit PPS FFA
// (généré via Figma) s'est révélé non détectable en pratique sur le
// document réel de Laurent — probablement du texte vectorisé en tracés
// plutôt qu'une vraie couche de texte extractible par pdf.js. Saisie
// manuelle de la date reste le seul chemin, simple et fiable.
async function convertirPdfPpsEnImage(dataUrl) {
  const pdfjs = await chargerPdfJs();
  const base64 = dataUrl.split(",")[1];
  const binaire = atob(base64);
  const octets = new Uint8Array(binaire.length);
  for (let i = 0; i < binaire.length; i++) octets[i] = binaire.charCodeAt(i);
  const doc = await pdfjs.getDocument({ data: octets }).promise;
  const page = await doc.getPage(1);

  // Échelle 2x pour une netteté correcte (le PPS contient un QR code à
  // scanner) sans faire exploser le poids — comparable à la limite 1600px
  // déjà appliquée aux photos importées.
  const viewportBase = page.getViewport({ scale: 1 });
  const echelle = Math.min(2, 1600 / Math.max(viewportBase.width, viewportBase.height));
  const viewport = page.getViewport({ scale: echelle });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL("image/jpeg", 0.85);
}

// sections: [{titre?: string, paragraphes: string[]}]
function ouvrirModaleTexte(titre, sections) {
  const fermer = () => { document.body.removeChild(overlay); };
  const overlay = el("div",{style:{
    position:"fixed", inset:"0", background:"rgba(0,0,0,0.92)", zIndex:"9999",
    display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"flex-start",
    padding:"20px", overflowY:"auto"
  }, onClick: (e)=>{ if (e.target === overlay) fermer(); }},
    el("div",{style:{width:"100%", maxWidth:"480px", display:"flex", flexDirection:"column", gap:"14px"}},
      el("div",{style:{display:"flex", alignItems:"center", justifyContent:"space-between"}},
        el("div",{style:{color:"#fff", fontSize:"18px", fontWeight:"800"}}, titre),
        el("button",{style:{
          padding:"8px 20px", borderRadius:"20px", border:"none",
          background:"#fff", color:"#000", fontSize:"14px", fontWeight:"700", cursor:"pointer"
        }, onClick: fermer}, "Fermer")
      ),

}

                  const reader = new FileReader();

                  reader.onerror = () => reject(new Error("Lecture du fichier échouée"));
                  reader.readAsDataURL(fichier);
                });

                // l'ancien handler (02/08/2026, bug d'échec silencieux sur
                // gros fichiers non compressés).
                const data = await new Promise((resolve, reject) => {
                  const img = new Image();
                  const readerUrl = URL.createObjectURL(fichier);
                  img.onload = () => {
                    const maxDim = 1600;
                    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                    const canvas = document.createElement("canvas");
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(readerUrl);
                    resolve(canvas.toDataURL("image/jpeg", 0.82));
                  };
                  img.onerror = () => { URL.revokeObjectURL(readerUrl); reject(new Error("Image illisible")); };
                  img.src = readerUrl;
                });

function ouvrirSignalementProbleme() {
  const overlay = el("div", {style:{

  // la table Supabase signalements pour un triage humain structuré côté
  // beta-admin, en complément de Sentry qui ne capte que le contexte
  // technique brut (pas de statut, pas de catégorie).
  const TYPES_SIGNALEMENT = { bug: "🐛 Bug", donnee_incorrecte: "📊 Donnée incorrecte", suggestion: "💡 Suggestion", autre: "❓ Autre" };
  let typeSelectionne = "bug";
  const typeButtons = {};
  const typeRow = el("div", {style:{display:"flex", gap:"6px", marginBottom:"10px", flexWrap:"wrap"}},
    ...Object.entries(TYPES_SIGNALEMENT).map(([val, label]) => {
      const btn = el("button", {

          color: val === typeSelectionne ? "var(--accent)" : "var(--text-muted)"

          typeSelectionne = val;
          Object.entries(typeButtons).forEach(([v, b]) => {
            b.style.border = v === val ? "1px solid var(--accent)" : "1px solid var(--border)";
            b.style.background = v === val ? "rgba(var(--accent-rgb),0.13)" : "transparent";

        }
      }, label);
      typeButtons[val] = btn;
      return btn;
    })
  );
  const textarea = el("textarea", {
    id: "signalement-description", name: "signalement-description",
    placeholder: "Qu'est-ce qui ne va pas ? Décris ce que tu observes...",
    style: {
      width:"100%", minHeight:"120px", padding:"10px", borderRadius:"8px",
      border:"1px solid var(--border)", background:"var(--bg)", color:"var(--text)",
      fontSize:"14px", fontFamily:"inherit", resize:"vertical"
    }
  });
  const statutMsg = el("div", {class:"muted", style:{fontSize:"13px", marginTop:"8px", minHeight:"18px"}});
  const fermer = () => overlay.remove();
  const envoyer = async () => {
    // Lu directement depuis le DOM au clic plutôt que via un state
    // séparé — corrige un bug (20/07/2026) où onInput n'est pas un
    // événement supporté par la fonction el() de ce fichier (seuls
    // onClick/onChange le sont), donc le texte n'était jamais capté.
    const description = textarea.value;
    if (!description.trim()) { statutMsg.textContent = "Décris le problème avant d'envoyer."; return; }
    const planId = window.__PLAN_BRUT__?.id || "aucun";
    const estPlanRepli = !!window.__PLAN_BRUT__?.estPlanRepli;
    const contexteTxt = "vue=" + view + " | planId=" + planId + " | estPlanRepli=" + estPlanRepli + " | url=" + window.location.href;
    let sentryEventId = null;
    try {
      if (typeof Sentry !== 'undefined' && typeof Sentry.captureMessage === 'function') {
        // Contexte réintégré le 21/07/2026 — la vraie cause du crash OOM
        // était Sentry.configureScope() (cf. correctif window.__AUTH_PRET__
        // plus haut dans ce fichier), pas ce message. Gardé en un seul
        // argument string malgré tout (pas de second argument objet) —
        // c'est la forme la plus sûre, garantie bufferisée par le Loader
        // Script quel que soit l'état de chargement du SDK complet.
        sentryEventId = Sentry.captureMessage("[Signalement utilisateur] " + description.trim() + " | " + contexteTxt);
      }
    } catch (e) {
      // Signalement Sentry best-effort — l'insert Supabase ci-dessous
      // reste la source de vérité pour le triage admin, donc on continue
      // même si Sentry échoue silencieusement.
    }
    try {
      if (LkAuth?.supabase) {
        await LkAuth.supabase.from('signalements').insert({
          type: typeSelectionne,
          message: description.trim(),
          contexte: { vue: view, planId, estPlanRepli, url: window.location.href },
          user_id: window.__UTILISATEUR__?.id || null,
          email: window.__UTILISATEUR__?.email || null,
          sentry_event_id: typeof sentryEventId === 'string' ? sentryEventId : null,

      }
      statutMsg.textContent = "Merci, c'est envoyé !";
      setTimeout(fermer, 1200);

  overlay.addEventListener("click", (e) => { if (e.target === overlay) fermer(); });
  document.body.appendChild(overlay);
}

// MÉTÉO — via proxy /api/weather (Open-Meteo)
// Réconciliation du 20/07/2026 (convergence-v1-v2.md section 13) : ces deux
// fonctions appelaient Open-Meteo directement depuis le navigateur, en
// parallèle du proxy /api/weather déjà utilisé par weather.js pour la

// la logique de géolocalisation de chaque fonction n'a pas changé (Strava
// GPS pour la météo actuelle, cf. coordonneesMeteoActuelles() ci-dessous),
// seul le canal d'appel à Open-Meteo est désormais commun.

let weatherTemp = null;

// timezone : fuseau du navigateur (Intl), transmis à l'API pour que la
// météo passée soit interprétée dans le bon fuseau plutôt que le repli fixe
// Europe/Paris côté serveur (24/07/2026, cf. inventaire §16). hour : heure
// locale réelle de la séance si connue (ex. depuis start_date_local
// Strava), pour cibler la bonne heure plutôt que le repli 18h/12h/minuit.
function fuseauNavigateur() {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || null;
  } catch(e) { return null; }
}

async function fetchHistoricalWeather(date, lat, lon, hour) {
  try {
    const params = new URLSearchParams({ lat, lon, date, type: "historical" });
    const timezone = fuseauNavigateur();
    if (timezone) params.set("timezone", timezone);
    if (Number.isInteger(hour) && hour >= 0 && hour <= 23) params.set("hour", hour);
    const resp = await fetch(`/api/weather?${params}`);
    const data = await resp.json();
    if (!data.disponible) return null;
    return data.temperatureC;
  } catch(e) { return null; }
}

// Coordonnées pour la météo actuelle — dynamiques depuis la dernière
// activité Strava connue avec GPS (13 juillet 2026, demandé par Laurent :
// les coordonnées fixes ne reflètent pas où le coureur court vraiment,
// notamment en voyage). Repli sur Toulon (43.12, 5.93 — position
// historique de Laurent) si aucune activité Strava n'a de GPS, ou si
// stravaActivities est vide (avant toute synchro).
function coordonneesMeteoActuelles() {
  const REPLI = { lat: 43.12, lon: 5.93 };
  if (!stravaActivities?.length) return REPLI;
  // La plus récente activité AVEC GPS — pas juste la plus récente tout
  // court, une activité sans start_latlng (tapis de course, montre sans
  // GPS) ne doit pas faire retomber sur le repli si une activité GPS plus
  // ancienne existe.
  const derniereAvecGps = [...stravaActivities]
    .filter(a => a.start_latlng?.length === 2)
    .sort((a, b) => (b.start_date_local || '').localeCompare(a.start_date_local || ''))[0];
  if (!derniereAvecGps) return REPLI;
  return { lat: derniereAvecGps.start_latlng[0], lon: derniereAvecGps.start_latlng[1] };
}

// Compteur explicite des 3 sources connues du chargement initial (07/08/2026,
// v4 du chantier "clignotements successifs à l'ouverture") — cf. commentaire
// détaillé sur renderDiffereChargementInitial() plus bas dans ce fichier
// pour l'historique complet. Décrémenté à la FIN de chacune des 3 fonctions
// (fetchWeather/verifierMeteoSeanceDemain/bloc badges dans render()), sur
// TOUS leurs chemins de sortie (succès, échec, retour anticipé) — la
// fenêtre doit se fermer même si une source échoue, pas seulement si elle
// réussit, donc cet appel est fait dans un `finally` plutôt qu'après le
// dernier appel utile de chaque fonction (qui pourrait être sauté par un
// `return` anticipé).
function signalerSourceChargementTerminee() {
  window._sourcesChargementInitialRestantes = Math.max(0, (window._sourcesChargementInitialRestantes ?? 3) - 1);
}

async function fetchWeather() {
  try {
    const { lat, lon } = coordonneesMeteoActuelles();
    const params = new URLSearchParams({ lat, lon, type: "current" });
    const resp = await fetch(`/api/weather?${params}`);
    const data = await resp.json();
    if (!data.disponible) return;
    weatherTemp = data.temperatureC;
    weatherDesc = data.emoji;
    renderDiffereChargementInitial(); // cf. définition : regroupe avec badges/verifierMeteoSeanceDemain (06/08/2026)
  } catch(e) {
    console.warn("Météo indisponible:", e.message);
  } finally {
    signalerSourceChargementTerminee();
  }
}

// Notes météo dynamiques pour demain (doc convergence-v1-v2.md, section 2.2)
// — déplacée depuis le wizard v2 le 8 juillet 2026 : elle n'y était appelée
// qu'à chaque affichage du récap DANS LE WIZARD (renderResults()), jamais
// depuis l'app principale que Laurent utilise vraiment au quotidien — la
// note de chaleur "pour demain" ne se mettait donc à jour que si Laurent
// retournait dans le wizard, jamais en usage normal. Système distinct de
// fetchWeather()/fetchHistoricalWeather() ci-dessus (météo ACTUELLE/PASSÉE,
// coordonnées fixes ou GPS des activités Strava) : celui-ci porte sur une
// PRÉVISION FUTURE (demain), avec géolocalisation dynamique du navigateur —
// vérifie si une séance est prévue demain, et si oui déclenche la
// prévision météo pour l'enrichir d'une note de chaleur si besoin.
async function verifierMeteoSeanceDemain() {
  try {
    const plan = window.__PLAN_BRUT__;
    if (!plan?.dateDebut) return;
    const debut = new Date(plan.dateDebut + 'T00:00:00Z');
    // Calcul de "demain" en UTC, cohérent avec le calcul de dateSeance
    // ci-dessous — mélanger un Date en fuseau local avec un calcul en UTC pur
    // créait un décalage possible d'un jour selon l'heure et le fuseau de
    // l'utilisateur (bug déjà trouvé et corrigé côté wizard, cf. commit
    // cc03fc4, reproduit ici pour la même raison).
    const aujourdhui = new Date();
    const demain = new Date(Date.UTC(aujourdhui.getFullYear(), aujourdhui.getMonth(), aujourdhui.getDate() + 1));
    const demainStr = demain.toISOString().slice(0, 10);

    for (const semaine of plan.semaines) {
      for (const [jourIndex, seance] of Object.entries(semaine.assignment)) {
        const dateSeance = new Date(debut);
        dateSeance.setUTCDate(debut.getUTCDate() + (semaine.semaineNum - 1) * 7 + Number(jourIndex));
        const dateSeanceStr = dateSeance.toISOString().slice(0, 10);

        if (dateSeanceStr === demainStr && seance.contenu) {
          // Import dynamique du module ES (19/07/2026, étape 1 du chantier
          // de conversion module — cf. mémoire de session). weather.js
          // n'est plus dupliqué en weather.classic.js : c'est le seul
          // fichier source désormais. import() est asynchrone et peut être
          // appelé n'importe où dans un script classique (contrairement à
          // `import { x } from "..."` en haut de fichier, réservé aux vrais
          // modules) — le `await` garantit que verifierMeteoPourSeance est
          // bien chargée avant d'être appelée.
          const { verifierMeteoPourSeance } = await import("/v2/engine/weather.js");
          await verifierMeteoPourSeance(seance, demainStr);
          // Re-traduit le plan brut (potentiellement enrichi d'une note) vers
          // le format v1 affiché, et rafraîchit l'affichage immédiatement
          window.__PLAN_GENERE__ = traduirePlanVersFormatV1(plan);
          PLAN = window.__PLAN_GENERE__;
          ALL_SESSIONS = recalculerAllSessions();
          renderDiffereChargementInitial(); // cf. définition : regroupe avec badges/fetchWeather (06/08/2026)
          return; // une seule séance concernée par jour dans l'immense
          // majorité des cas — pas la peine de continuer à parcourir
        }
      }
    }
  } finally {
    signalerSourceChargementTerminee();
  }
}
// verifierMeteoSeanceDemain() appelée désormais juste après résolution de

// CORRECTIF fuseau horaire (23/07/2026, signalé par Laurent à 00h45) :
// l'ancienne version (new Date().toISOString().slice(0,10)) retourne
// toujours la date en UTC, jamais le fuseau local de l'utilisateur — en
// France l'été (UTC+2), entre minuit et 2h du matin heure locale, l'app
// affichait encore "hier" comme date du jour (ex. observé : à 00h45, la
// séance de la veille restait affichée comme "Aujourd'hui"). Corrigé en
// utilisant les getters locaux (getFullYear/getMonth/getDate), qui
// retournent TOUJOURS l'heure du fuseau du navigateur exécutant le JS —
// s'adapte automatiquement à n'importe quel utilisateur, n'importe où,
// sans fuseau codé en dur (cf. mémoire de session : audit des 45 usages
// de today() + 10 usages indépendants du même pattern avant correction,
// certains étaient déjà en UTC intentionnel et n'ont pas été touchés).
function today() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

// Même correctif que today() ci-dessus, appliqué à "demain" — remplace les
// trois usages qui calculaient demain via
// new Date(new Date().getTime()+86400000).toISOString().slice(0,10) (même
// biais UTC). Construit sur un objet Date en heure locale (pas de calcul en
// millisecondes qui pourrait glisser sur un changement heure été/hiver),
// puis appelle today()-style sur ce nouvel objet.
function demain() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

// mais jamais centralisé, donc oublié à plusieurs endroits distincts.
function activitesDuPlan() {

// Mode Forme (13 juillet 2026) : plan sans dateCourse, cf. plan-forme.js.

// séance du jour, statuts) reste identique, déjà générique.
const ESTMODEFORME = window.__PLAN_BRUT__?.mode === 'forme';

// dateCourse directement sur l'objet plan, cf. section 7bis du doc de
// convergence) plutôt que codée en dur — repli sur la date historique de
// Laurent si absente. En mode Forme, DATE_COURSE_REFERENCE reste null
// (pas de repli sur l'ancienne date en dur) : countdown() doit refléter
// l'absence réelle de date de course, pas une fausse valeur.
const DATE_COURSE_REFERENCE = ESTMODEFORME ? null : (window.__PLAN_BRUT__?.dateCourse || "2026-09-06");
function countdown() { return DATE_COURSE_REFERENCE ? Math.ceil((new Date(DATE_COURSE_REFERENCE) - new Date()) / 86400000) : null; }
function currentWeek() {
  const t = today();
  for (const w of PLAN) {

}
function fmtDate(d) { return new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }
function fmtPace(speedMs) {
  if (!speedMs || speedMs <= 0) return "--:--";
  const secPerKm = 1000 / speedMs;
  const min = Math.floor(secPerKm / 60);
  const sec = Math.round(secPerKm % 60).toString().padStart(2,"0");
  return `${min}:${sec}`;
}
// Inverse de fmtPace : "4:15" (mm:ss/km) → vitesse en m/s, ou null si
// saisie invalide/vide. Utilisé par le formulaire de saisie manuelle
// (docs/source-donnees-seances.md, section 4).
function parsePace(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^(\d{1,2}):([0-5]?\d)$/);
  if (!m) return null;
  const secPerKm = parseInt(m[1],10)*60 + parseInt(m[2],10);
  if (secPerKm <= 0) return null;
  return 1000 / secPerKm;
}
function fmtTime(seconds) {
  // Format heures/minutes/secondes au-delà de 60 minutes (pertinent pour un
  // Semi/Marathon, où l'objectif dépasse facilement l'heure — avant cette
  // correction, un temps de 117min s'affichait "117'XX"" plutôt que
  // "1h57'XX"", remonté par Laurent le 7 juillet 2026 en testant un plan
  // Semi). Format court (m'ss") conservé sous 60 minutes, comme avant.
  const totalMin = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60).toString().padStart(2,"0");
  if (totalMin >= 60) {
    const h = Math.floor(totalMin / 60);
    const m = (totalMin % 60).toString().padStart(2,"0");
    return `${h}h${m}'${s}"`;
  }
  return `${totalMin}'${s}"`;
}
// CORRECTIF ("la frise ne correspond plus aux séances", signalé par
// Laurent) — même bug exactement que weeklyReport() ci-dessus :
// week.sessions.indexOf(s) ne retrouve jamais une séance swappée (venant

// de toute façon. C'est ce pourcentage qui s'affiche juste à côté de
// chaque semaine dans la liste (renderWeeks) — sa désynchronisation avec
// la frise (renderGrilleJoursSemaine, déjà correcte) explique
// directement le symptôme observé.
function weekPct(week) {
  // Défensif (urgence : "l'appli bloque au démarrage" suite au correctif
  // précédent) — try/catch autour de tout appel à getEffectiveSession()
  // dans ce fichier de calcul de stats, jamais présent avant. Si
  // getEffectiveSession lève pour une raison quelconque (donnée
  // corrompue, cas limite non anticipé), repli sur le comportement
  // D'ORIGINE (lecture directe de week.sessions, sans tenir compte du

  // render() — un pourcentage possiblement désynchronisé du swap est un

  let sessAvecIndex;
  try {
    sessAvecIndex = week.sessions
      .map((s,i) => ({ index:i, session: getEffectiveSession(week, i) || s }))

  } catch (e) {

      .filter(({session}) => session.type!=="REPOS" && session.type!=="RACE");

  const done = sessAvecIndex.filter(({index})=>statuses[`${week.week}-${index}`]==="✅").length;

function globalPct() {
  const total = ALL_SESSIONS.filter(s=>s.type!=="REPOS"&&s.type!=="RACE").length;
  const done = ALL_SESSIONS.filter(s=>statuses[s.uid]==="✅").length;

function phaseOf(weekNum) { return PHASES.find(p=>p.weeks.includes(weekNum))||{color:"var(--text2)",label:""}; }
// Convertit une couleur var(--x) en rgba(var(--x-rgb), N) pour une opacité

  const nom = varColor.replace("var(--", "").replace(")", "");

// Identifie si une semaine est une semaine de décharge — champ produit par
// le moteur v2 (estDechargeSemaine, cf. v2/engine/plan-generator.js) et
