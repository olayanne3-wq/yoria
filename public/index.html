  }

  // Calcul unique du moteur de décision pour tout ce render() du dashboard
  // (31/07/2026, correctif de perf) — calculerEtatMoteurDecision() était
  // appelée deux fois de façon identique dans cette fonction
  // (semaineCiblePhysioActive et moteurDecisionEl), avec exactement les
  // mêmes entrées (stravaActivities/statuses/profilCoureur/window.
  // __PLAN_BRUT__, aucune mutation entre les deux appels d'origine) — un
  // calcul non négligeable (adapterHistoriqueAvecRpe + calculerRunnerState
  // + analyserTendance sur 6 semaines, chacune re-parcourant
  // stravaActivities) exécuté deux fois pour un résultat strictement
  // identique à chaque render. Calculé une seule fois ici, réutilisé par
  // les deux blocs plus bas.
  const etatMoteurPartage = calculerEtatMoteurDecision();

  // Même correctif de perf (31/07/2026) : activitesDuPlan() (filtre simple
  // sur stravaActivities, moins coûteux que le moteur de décision ci-dessus
  // mais tout de même appelé 2 fois à l'identique dans cette fonction) —
  // calculé une fois, réutilisé par heroPred (totalKmRun) et les barres de
  // progression globales (totalKm/totalMin) plus bas.
  const activitesDuPlanPartage = activitesDuPlan();

  // ── Fin de bloc Mode Forme — propose de générer le bloc suivant
  // (21/07/2026) ──────────────────────────────────────────────────────────
  // Même pattern que la progression marche-course ci-dessus : détection
  // automatique, génération uniquement sur clic explicite (semi-automatique,
  // décision actée le 21/07/2026 — le Mode Forme n'a pas de fin naturelle
  // comme un plan course, donc l'utilisateur doit rester décisionnaire à
  // chaque bloc plutôt que de voir son contenu changer silencieusement).
  // Détection par date (dernière séance du plan < aujourd'hui), pas par
  // statut des séances — cohérent avec le principe transverse de l'app
  // (raisonner en dates, jamais en complétion des statuts, cf. inventaire
  // §15). Bloqué sur un plan Forme clôturé (dateCloture) : ce cas ne doit
  // jamais proposer de bloc suivant, cf. garde-fou déjà en place côté
  // genererBlocSuivant()/sauvegarderPlan() (gist-sync.js).
  const blocSuivantEl = (() => {
    if (!window.__PLAN_BRUT__ || window.__PLAN_BRUT__.mode !== 'forme') return null;
    if (window.__PLAN_BRUT__.dateCloture) return null;
    if (window.__PLAN_BRUT__.sousMode === 'marche-course') return null; // progression gérée séparément ci-dessus

    const derniereSeance = ALL_SESSIONS[ALL_SESSIONS.length - 1];
    if (!derniereSeance || derniereSeance.date >= today()) return null; // bloc pas encore terminé

    const genererSuivant = async () => {
      const boutonClique = document.getElementById("bloc-suivant-btn");
      if (boutonClique) { boutonClique.disabled = true; boutonClique.textContent = "Génération..."; }
      try {
        // profilOrigine/paramsOrigine ne sont PAS stockés sur le plan résultant
        // de generatePlanForme() (cf. plan-forme.js) — même limite déjà
        // rencontrée et corrigée pour changerPalierGrandDebutant() un peu plus
        // bas dans ce fichier. Reconstruction à l'identique : jours
        // d'entraînement déduits des séances déjà placées, reste du profil lu
        // depuis lk_profil_coureur, params reconstruits depuis le plan courant.
        const planCourant = window.__PLAN_BRUT__;
        const premiereSemaine = planCourant.semaines?.[0];
        const joursDisponibles = premiereSemaine
          ? Object.keys(premiereSemaine.assignment).map(Number)
          : [1, 3, 5];

        let profilStocke;
        try { profilStocke = JSON.parse(localStorage.getItem('lk_profil_coureur')); } catch { profilStocke = null; }

        const profil = {
          niveau: profilStocke?.niveau || 'intermediaire',
          anneeNaissance: profilStocke?.anneeNaissance || undefined,
          fcMaxConnue: profilStocke?.fcMax || undefined,
          joursDisponiblesHabituels: joursDisponibles
        };

        // tempsReference/refDistance/volumeActuel/accent ne sont pas non plus
        // reconstructibles depuis planCourant seul (aucune trace de la
        // référence de performance d'origine sur le plan résultant) — repli
        // sur les records du profil stocké, cohérent avec preremplirDepuisProfilCoureur()
        // utilisé ailleurs dans l'app pour le même besoin.
        const recordDispo = profilStocke?.records && Object.entries(profilStocke.records).find(([, r]) => r?.temps);
        if (!recordDispo) {
          alert("Impossible de générer le bloc suivant : aucun record de référence trouvé dans ton profil. Renseigne un temps de référence dans Réglages.");
          return;
        }
        const [refDistanceLabel, refRecord] = recordDispo;
        const derniereSemaineBloc = planCourant.semaines[planCourant.semaines.length - 1];

        const params = {
          dateDebut: derniereSeance.date,
          dateCloture: planCourant.dateCloture,
          nbSemainesBloc: planCourant.tailleBlocSemaines,
          tempsReference: refRecord.temps,
          refDistance: refDistanceLabel,
          accent: planCourant.accent,
          volumeActuel: derniereSemaineBloc?.estDechargeSemaine
            ? (planCourant.semaines[planCourant.semaines.length - 2]?.volumeCibleKm ?? 20)
            : (derniereSemaineBloc?.volumeCibleKm ?? 20)
        };

        const nouveauPlan = genererBlocSuivant(planCourant, profil, params);
        nouveauPlan.id = planCourant.id;
        nouveauPlan.nom = planCourant.nom;
        nouveauPlan.statuses = planCourant.statuses;

        // Sauvegarde Supabase — bloquante et principale (21/07/2026, même
        // correctif que la suppression de plan le même jour). sauvegarderPlan()
        // (Gist) levait une exception explicite sans token GitHub configuré,
        // ce qui interrompait TOUTE la fonction avant même d'atteindre une
        // sauvegarde qui aurait pu réussir — LkSync.mettreAJourPlanSupabase()
        // est la vraie source de vérité depuis le passage v2.8 ("Supabase
        // devient le mécanisme de sauvegarde principal").
        if (window.__UTILISATEUR__?.id && window.LkSync) {
          await window.LkSync.mettreAJourPlanSupabase(nouveauPlan.id, nouveauPlan);
        }
        window.location.reload();
      } catch (e) {
        alert("La génération du bloc suivant a échoué : " + e.message);
        console.error(e);
      } finally {
        if (boutonClique) { boutonClique.disabled = false; boutonClique.textContent = "Générer le bloc suivant"; }
      }
    };

    return el("div",{style:{background:"rgba(var(--accent-rgb),0.07)",border:"1px solid rgba(var(--accent-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}},
        el("span",{style:{fontSize:"20px"}},"🔁"),
        el("div",{style:{color:"var(--text)",fontSize:"14px",fontWeight:"600"}},"Ton bloc de 4 semaines est terminé")
      ),
      el("button",{id:"bloc-suivant-btn",style:{
          width:"100%",background:"var(--accent)",border:"none",borderRadius:"8px",padding:"11px",
          color:"var(--bg)",fontSize:"14px",fontWeight:"700",cursor:"pointer"
        }, onClick: genererSuivant
      },"Générer le bloc suivant")
    );
  })();

  // ── Complétion du plan après test semi-Cooper (21/07/2026, étendu au
  // plan course le 22/07/2026) ──────────────────────────────────────────────
  // Semi-automatique, même pattern que blocSuivantEl juste au-dessus — le
  // plan reste en enAttenteTest:true (une seule semaine) jusqu'à ce que ce
  // bandeau soit confirmé, même si lk_resultat_test_forme existe déjà (le
  // test peut être validé sans recharger la page immédiatement après).
  // Deux moteurs distincts selon plan.mode : completerBlocApresTest()
  // (Mode Forme, bloc de taille fixe) ou completerPlanApresTestSemiCooper()
  // (plan course, taille dépendante de dateCourse, cf. plan-generator.js).
  const completerTestEl = (() => {
    if (!window.__PLAN_BRUT__?.enAttenteTest) return null;
    const resultatTest = load(clePourPlan("lk_resultat_test_forme"), null);
    if (!resultatTest) return null; // test pas encore fait/validé
    const estPlanForme = window.__PLAN_BRUT__.mode === 'forme';

    const completerPlan = async () => {
      const boutonClique = document.getElementById("completer-test-btn");
      if (boutonClique) { boutonClique.disabled = true; boutonClique.textContent = "Génération..."; }
      try {
        const planCourant = window.__PLAN_BRUT__;
        const premiereSemaine = planCourant.semaines?.[0];
        const joursDisponibles = premiereSemaine
          ? Object.keys(premiereSemaine.assignment).map(Number)
          : [1, 3, 5];

        let profilStocke;
        try { profilStocke = JSON.parse(localStorage.getItem('lk_profil_coureur')); } catch { profilStocke = null; }

        const profil = {
          niveau: profilStocke?.niveau || 'intermediaire',
          anneeNaissance: profilStocke?.anneeNaissance || undefined,
          fcMaxConnue: profilStocke?.fcMax || undefined,
          joursDisponiblesHabituels: joursDisponibles,
          // Volume de départ : pas de trace fiable de ce qui a été saisi au
          // wizard pour ce plan (mêmes limites que blocSuivantEl un peu
          // plus haut — profilOrigine/paramsOrigine non stockés sur le plan
          // résultant côté Forme). Repli à 20km/semaine, valeur prudente
          // pour démarrer. Le plan course, lui, garde profilOrigine/
          // paramsOrigine sur le plan partiel (cf. plan-generator.js) et
          // n'a pas besoin de ce repli.
          volumeActuel: 20
        };

        const nouveauPlan = estPlanForme
          ? completerBlocApresTest(planCourant, profil, resultatTest)
          : completerPlanApresTestSemiCooper(planCourant, resultatTest);
        nouveauPlan.id = planCourant.id;
        nouveauPlan.nom = planCourant.nom;
        nouveauPlan.statuses = planCourant.statuses;

        // Badge "test_semi_cooper" (27/07/2026) — au moment où le test
        // initial (celui qui débloque la génération complète du plan,
        // enAttenteTest:true) est validé avec succès. Ne couvre QUE ce
        // test initial, pas les tests de confirmation en cours de plan
        // (placerSeanceTest/aUneSeanceTest), qui n'ont pas de point de
        // saisie dédié séparé dans le code actuel — ils passent par le
        // flux normal de statut de séance qualité.
        if (window.__badgesCache__ && !window.__badgesCache__.test_semi_cooper) {
          enregistrerBadgeDebloque('test_semi_cooper', 1).then(() => {
            window.__badgesCache__.test_semi_cooper = true;
          }).catch(() => {});
        }

        // Sauvegarde Supabase — bloquante et principale, même correctif que
        // genererSuivant() juste au-dessus (21/07/2026).
        if (window.__UTILISATEUR__?.id && window.LkSync) {
          await window.LkSync.mettreAJourPlanSupabase(nouveauPlan.id, nouveauPlan);
        }
        window.location.reload();
      } catch (e) {
        alert("La génération de la suite de ton plan a échoué : " + e.message);
        console.error(e);
      } finally {
        if (boutonClique) { boutonClique.disabled = false; boutonClique.textContent = "Générer la suite de mon plan"; }
      }
    };

    return el("div",{style:{background:"rgba(var(--accent-rgb),0.07)",border:"1px solid rgba(var(--accent-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}},
        el("span",{style:{fontSize:"20px"}},"🎯"),
        el("div",{},
          el("div",{style:{color:"var(--text)",fontSize:"14px",fontWeight:"600"}},"Ton résultat est prêt"),
          el("div",{class:"muted",style:{fontSize:"13px"}},"VMA estimée : "+resultatTest.vmaKmh.toFixed(1)+" km/h")
        )
      ),
      el("button",{id:"completer-test-btn",style:{
          width:"100%",background:"var(--accent)",border:"none",borderRadius:"8px",padding:"11px",
          color:"var(--bg)",fontSize:"14px",fontWeight:"700",cursor:"pointer"
        }, onClick: completerPlan
      },"Générer la suite de mon plan")
    );
  })();


  const cw=currentWeek();
  const done=ALL_SESSIONS.filter(s=>statuses[s.uid]==="✅").length;
  const missed=ALL_SESSIONS.filter(s=>statuses[s.uid]==="❌").length;
  const adapted=ALL_SESSIONS.filter(s=>statuses[s.uid]==="⚠️").length;
  // Ajouté le 22/07/2026 (signalé par Laurent : "pas de compte des status
  // zzz" sur cette carte) — utilise statutEffectif (cf.
  // recalculerAllSessions) donc inclut à la fois les 😴 saisis
  // manuellement ET les jours passés sans statut auto-considérés comme
  // repos volontaire. Comportement volontairement différent des trois
  // compteurs au-dessus (qui restent sur le VRAI statut saisi, statuses[uid]
  // brut) : la carte globale doit refléter ce que montre déjà le badge
  // visuel de chaque séance (renderWeekDetail), qui utilise aussi
  // statutEffectif.
  const skipped=ALL_SESSIONS.filter(s=>s.statutEffectif==="😴").length;

  // ── Proposition de progression de palier marche-course (grand débutant,
  // 14/07/2026) ────────────────────────────────────────────────────────────
  // Même pattern que l'adaptation dynamique ci-dessous : détection
  // automatique, application seulement sur confirmation explicite. Pas de
  // "Ignorer" ici (contrairement à l'adaptation) — rester au palier actuel
  // est un choix normal et récurrent, pas un refus ponctuel à mémoriser.
  const progressionMarcheCourseEl = (() => {
    if (!window.__PLAN_BRUT__) return null;
    window.__PLAN_BRUT__.statuses = statuses;
    const progression = analyserProgressionMarcheCourse(window.__PLAN_BRUT__);
    if (!progression) return null; // pas un plan grand-débutant

    const banniereIgnoreeCettePalier = load(clePourPlan("lk_palier_propose_ignore"), null) === progression.palierId;

    // Warning de stagnation (garde-fou 12 semaines) — affiché même si pas
    // encore prêt pour le palier suivant, informatif seulement.
    const warningStagnation = progression.warnings.length > 0
      ? el("div",{style:{background:"rgba(var(--warn-rgb),0.07)",border:"1px solid rgba(var(--warn-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
          el("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
            el("span",{style:{fontSize:"20px"}},"💛"),
            el("div",{class:"muted",style:{fontSize:"14px",lineHeight:"1.5"}}, progression.warnings[0].message)
          )
        )
      : null;

    // Dernier palier (course continue 30min) déjà atteint ET validé : pas de
    // "palier suivant" possible côté marche-course, on propose la création
    // d'un vrai plan debutant (structure longue/EF/qualité) plutôt qu'une
    // conversion automatique en place (jugée risquée, cf. décision du
    // 14/07/2026 — même logique prudente que la dé-duplication moteur/classic
    // reportée pour la même raison). "Continuer ce palier" reste possible :
    // rien n'oblige à basculer tout de suite.
    if (progression.dernierPalier && progression.pretPourSuivant && !banniereIgnoreeCettePalier) {
      return el("div",{style:{padding:"0"}},
        warningStagnation,
        el("div",{style:{background:"rgba(var(--accent2-rgb),0.07)",border:"1px solid rgba(var(--accent2-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
          el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}},
            el("span",{style:{fontSize:"20px"}},"🏆"),
            el("span",{style:{color:"var(--accent2)",fontSize:"15px",fontWeight:"700"}},"Tu cours en continu !")
          ),
          el("div",{class:"muted",style:{fontSize:"14px",marginBottom:"12px",lineHeight:"1.5"}},
            progression.seancesValidees+" séances de course continue réussies — la marche-course a fait son travail. Tu peux passer à un vrai plan d'entraînement, avec sortie longue et séances qualité, quand tu es prêt·e."),
          el("div",{style:{display:"flex",gap:"8px"}},
            el("a",{href:"/v2",style:{flex:"1",display:"block",textAlign:"center",background:"var(--accent2)",border:"none",borderRadius:"8px",padding:"9px",color:"#F8FAFC",fontSize:"14px",fontWeight:"700",cursor:"pointer",textDecoration:"none"},
              onClick: async (e)=>{
                // Clôture le plan grand-débutant AVANT de rediriger — sans
                // ça, il reste "actif indéfiniment" (pas de dateCloture) et
                // bloque la création du nouveau plan via le garde-fou
                // anti-chevauchement (assurerPlanExiste). Ajouté le
                // 15/07/2026. e.preventDefault() le temps de l'appel
                // réseau (best-effort, mais on attend quand même pour
                // maximiser les chances que la clôture soit bien
                // enregistrée avant que le nouveau plan tente de se créer).
                e.preventDefault();
                const dateCloture = today(); // CORRECTIF fuseau horaire 23/07/2026 (était new Date().toISOString().slice(0,10), biais UTC)
                if (window.__UTILISATEUR__?.id && window.LkSync?.cloturerPlanSupabase && window.__PLAN_BRUT__?.id) {
                  try {
                    await window.LkSync.cloturerPlanSupabase(window.__PLAN_BRUT__.id, dateCloture);
                  } catch (err) {
                    console.warn("Clôture du plan grand-débutant échouée (non bloquant) :", err.message);
                  }
                }
                window.location.href = "/v2";
              }
            },"Configurer mon prochain plan"),
            el("button",{style:{flex:"1",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"9px",color:"var(--text-muted)",fontSize:"14px",fontWeight:"600",cursor:"pointer"},
              feedback:true,
              onClick:()=>{
                save(clePourPlan("lk_palier_propose_ignore"), progression.palierId);
                render();
              }
            },"Pas encore")
          )
        )
      );
    }

    if (!progression.pretPourSuivant || progression.dernierPalier || banniereIgnoreeCettePalier) {
      return warningStagnation;
    }

    const palierActuel = PALIERS_MARCHE_COURSE[progression.palierId];
    const palierSuivant = PALIERS_MARCHE_COURSE[progression.palierId + 1];

    return el("div",{style:{padding:"0"}},
      warningStagnation,
      el("div",{style:{background:"rgba(var(--accent2-rgb),0.07)",border:"1px solid rgba(var(--accent2-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
        el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}},
          el("span",{style:{fontSize:"20px"}},"🎉"),
          el("span",{style:{color:"var(--accent2)",fontSize:"15px",fontWeight:"700"}},"Prêt·e pour la suite ?")
        ),
        el("div",{class:"muted",style:{fontSize:"14px",marginBottom:"12px",lineHeight:"1.5"}},
          progression.seancesValidees+" séances réussies sur \""+palierActuel.label+"\" — tu peux passer à \""+palierSuivant.label+"\" quand tu veux, ou continuer encore un peu à ce rythme."),
        el("div",{style:{display:"flex",gap:"8px"}},
          el("button",{style:{flex:"1",background:"var(--accent2)",border:"none",borderRadius:"8px",padding:"9px",color:"#F8FAFC",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
            feedback:true,
            onClick:async ()=>{ await changerPalierGrandDebutant(progression.palierId + 1); }
          },"Palier suivant"),
          el("button",{style:{flex:"1",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"9px",color:"var(--text-muted)",fontSize:"14px",fontWeight:"600",cursor:"pointer"},
            feedback:true,
            onClick:()=>{
              save(clePourPlan("lk_palier_propose_ignore"), progression.palierId);
              render();
            }
          },"Continuer ce palier")
        )
      )
    );
  })();

  // Carte permanente "prochain palier" (17.5, 15/07/2026, demande de
  // Laurent) — même esprit que heroPred (objectif/estimation du mode
  // course) mais pour le grand-débutant : toujours visible tant qu'un plan
  // marche-course est actif, pas seulement quand une bannière de transition
  // se déclenche. Affiche le palier courant et le suivant, avec un accès
  // direct au changement de palier si déjà débloqué (progression.pretPourSuivant),
  // sans attendre que la bannière progressionMarcheCourseEl apparaisse.
  const prochainPalierEl = (() => {
    if (!window.__PLAN_BRUT__ || window.__PLAN_BRUT__.sousMode !== 'marche-course') return null;
    const progression = analyserProgressionMarcheCourse(window.__PLAN_BRUT__);
    if (!progression) return null;

    const palierActuel = PALIERS_MARCHE_COURSE[progression.palierId];
    const palierSuivant = progression.dernierPalier ? null : PALIERS_MARCHE_COURSE[progression.palierId + 1];

    return el("div",{style:{background:"linear-gradient(135deg,var(--bg) 0%,var(--border-soft) 100%)",borderRadius:"16px",padding:"16px",marginBottom:"12px",border:"1px solid rgba(var(--accent2-rgb),0.2)",marginTop:"8px"}},
      el("div",{style:{marginBottom:"14px"}},
        el("div",{style:{color:"var(--accent2)",fontSize:"15px",fontWeight:"700",marginBottom:"2px"}},"🏃 Progression marche-course"),
        el("div",{class:"muted",style:{fontSize:"13px"}},progression.totalSeancesSuivies+" séance"+(progression.totalSeancesSuivies>1?"s":"")+" suivie"+(progression.totalSeancesSuivies>1?"s":"")+" sur ce plan")
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:palierSuivant?"1fr 1px 1fr":"1fr",gap:"12px",marginBottom:"4px"}},
        el("div",{style:{textAlign:"center"}},
          el("div",{class:"label",style:{marginBottom:"4px"}},"Palier actuel"),
          el("div",{style:{color:"var(--text)",fontSize:"22px",fontWeight:"900",letterSpacing:"-0.5px",lineHeight:"1.2"}},palierActuel.label),
          el("div",{class:"muted",style:{fontSize:"13px",marginTop:"2px"}},progression.seancesValidees+" validée"+(progression.seancesValidees>1?"s":"")+" à ce palier")
        ),
        palierSuivant ? el("div",{style:{background:"var(--border)"}}) : null,
        palierSuivant ? el("div",{style:{textAlign:"center"}},
          el("div",{class:"label",style:{marginBottom:"4px"}},"Palier suivant"),
          el("div",{style:{color:progression.pretPourSuivant?"var(--accent2)":"var(--text-muted)",fontSize:"22px",fontWeight:"900",letterSpacing:"-0.5px",lineHeight:"1.2"}},palierSuivant.label),
          progression.pretPourSuivant
            ? el("div",{style:{fontSize:"13px",marginTop:"2px",color:"var(--accent2)",fontWeight:"700"}},"🎉 Débloqué")
            : el("div",{class:"muted",style:{fontSize:"13px",marginTop:"2px"}},"Encore un peu de patience")
        ) : el("div",{class:"muted",style:{fontSize:"13px",textAlign:"center"}},"Dernier palier — tu y es !")
      ),
      progression.pretPourSuivant && palierSuivant ? el("button",{style:{width:"100%",marginTop:"12px",background:"var(--accent2)",border:"none",borderRadius:"8px",padding:"9px",color:"#F8FAFC",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
        feedback:true,
        onClick:async ()=>{ await changerPalierGrandDebutant(progression.palierId + 1); }
      },"Passer à \""+palierSuivant.label+"\"") : null
    );
  })();

  // ── Proposition d'adaptation dynamique (étape 4, doc convergence) ────────
  // Décidé avec Laurent le 8 juillet 2026 : détection AUTOMATIQUE (comme le
  // statut lui-même), mais application seulement sur confirmation explicite
  // — pas d'automatisme silencieux sur une vraie modification du plan.
  // "Ignorer" ne mémorise le refus que pour CETTE semaine précise (pas
  // définitif pour tout le plan) — si une nouvelle semaine tombe plus tard
  // dans la même situation, une nouvelle proposition apparaît normalement.
  // ── Garde-fou d'exclusion adaptation comportementale / moteur physio
  // (27/07/2026, cf. inventaire §16) ──────────────────────────────────────
  // Calcul LÉGER, en lecture seule, de la semaine actuellement ciblée par
  // une décision reduire_charge du moteur physio (si elle existe et n'est
  // pas déjà ignorée) — nécessaire ici, AVANT adaptationEl, pour qu'il
  // puisse se taire sur cette même semaine plutôt que de proposer une
  // action concurrente. Ne journalise rien (journaliserDecisionEvent reste
  // strictement dans moteurDecisionEl, pas dupliqué ici) et ne calcule que
  // ce qui est nécessaire pour la comparaison de semaineNum — le calcul
  // complet (readiness, modulation, cibleInfo réelle) reste dans
  // moteurDecisionEl plus bas, qui est la seule source de vérité pour
  // l'affichage/application de la décision physio elle-même.
  const semaineCiblePhysioActive = (() => {
    if (!window.__PLAN_BRUT__ || window.__PLAN_BRUT__.estPlanRepli) return null;
    if (typeof DecisionEngineApply === 'undefined') return null;
    const etatMoteurLeger = etatMoteurPartage;
    const decisionLegere = etatMoteurLeger ? etatMoteurLeger.decision : null;
    if (!decisionLegere || decisionLegere.type !== 'reduire_charge') return null;
    const cleIgnoreeLegere = clePourPlan("lk_decision_moteur_ignoree");
    const ignoreeLegere = load(cleIgnoreeLegere, null);
    const idDecisionDuJourLegere = decisionLegere.id + "_" + today();
    if (ignoreeLegere === idDecisionDuJourLegere) return null; // ignorée par le coureur : ne bloque plus le comportemental
    const niveauCoureurLeger = profilCoureur?.niveau || 'intermediaire';
    const cibleLegere = DecisionEngineApply.trouverProchaineSeanceCible(window.__PLAN_BRUT__, new Date().toISOString(), niveauCoureurLeger, decisionLegere.cibleQualitePrioritaire === true);
    return cibleLegere ? cibleLegere.semaine.semaineNum : null;
  })();

  const adaptationEl = (() => {
    if (!window.__PLAN_BRUT__) return null;
    // synchronise les statuts (variable séparée côté index.html, préfixée
    // par plan) sur l'objet plan brut avant d'appeler analyserAdaptations,
    // qui lit plan.statuses directement
    window.__PLAN_BRUT__.statuses = statuses;
    const { semainesAAdapter } = analyserAdaptations(window.__PLAN_BRUT__);
    const semainesIgnorees = load(clePourPlan("lk_adaptations_ignorees"), []);
    let semaineNumsAProposer = [...semainesAAdapter.keys()].filter(n => !semainesIgnorees.includes(n));

    // Garde-fou (27/07/2026) : le physio est prioritaire — si la décision
    // reduire_charge active cible la même semaine que celle proposée ici,
    // on se tait sur cette semaine plutôt que de proposer deux actions
    // concurrentes sur la même semaine. Collision journalisée une fois par
    // semaine/jour (anti-doublon même principe que lk_dernier_decision_event_id)
    // pour permettre d'observer si/quand ça arrive réellement (cf. §16).
    if (semaineCiblePhysioActive !== null && semaineNumsAProposer.includes(semaineCiblePhysioActive)) {
      const cleCollisionJournalisee = clePourPlan("lk_derniere_collision_signalee");
      const idCollisionDuJour = "collision_S" + semaineCiblePhysioActive + "_" + today();
      if (load(cleCollisionJournalisee, null) !== idCollisionDuJour && LkAuth?.supabase) {
        save(cleCollisionJournalisee, idCollisionDuJour);
        LkAuth.supabase.from('signalements').insert({
          type: 'collision_moteur',
          message: "Collision détectée : le moteur physio et l'adaptation comportementale ciblaient tous deux la semaine " + semaineCiblePhysioActive + " le même jour.",
          contexte: { semaineNum: semaineCiblePhysioActive, planId: window.__PLAN_BRUT__?.id || null },
          user_id: window.__UTILISATEUR__?.id || null,
          email: window.__UTILISATEUR__?.email || null,
          statut: 'nouveau',
        }).then(() => {}).catch(e => console.warn("Journalisation collision moteur/adaptation échouée :", e.message));
      }
      semaineNumsAProposer = semaineNumsAProposer.filter(n => n !== semaineCiblePhysioActive);
    }

    if (semaineNumsAProposer.length === 0) return null;
    const semaineNum = semaineNumsAProposer[0]; // une seule proposition à la fois, la plus proche

    return el("div",{style:{background:"rgba(var(--accent-rgb),0.07)",border:"1px solid rgba(var(--accent-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}},
        el("span",{style:{fontSize:"20px"}},"🔄"),
        el("span",{style:{color:"var(--accent)",fontSize:"15px",fontWeight:"700"}},"Adaptation suggérée")
      ),
      el("div",{class:"muted",style:{fontSize:"14px",marginBottom:"12px",lineHeight:"1.5"}},
        "Plusieurs séances difficiles récemment — la semaine "+semaineNum+" pourrait être allégée pour mieux récupérer."),
      el("div",{style:{display:"flex",gap:"8px"}},
        el("button",{style:{flex:"1",background:"var(--accent)",border:"none",borderRadius:"8px",padding:"9px",color:"#F8FAFC",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
          feedback:true,
          onClick:()=>{
            appliquerAdaptations(window.__PLAN_BRUT__);
            window.__PLAN_GENERE__ = traduirePlanVersFormatV1(window.__PLAN_BRUT__);
            PLAN = window.__PLAN_GENERE__;
            ALL_SESSIONS = recalculerAllSessions();
            if (window.__UTILISATEUR__?.id && window.LkSync?.mettreAJourPlanSupabase && window.__PLAN_BRUT__.id) {
              window.LkSync.mettreAJourPlanSupabase(window.__PLAN_BRUT__.id, window.__PLAN_BRUT__).catch(e => console.warn("Adaptation appliquée localement, sauvegarde échouée :", e.message));
            }
            render();
          }
        },"Appliquer"),
        el("button",{style:{flex:"1",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"9px",color:"var(--text-muted)",fontSize:"14px",fontWeight:"600",cursor:"pointer"},
          feedback:true,
          onClick:()=>{
            const ignorees = load(clePourPlan("lk_adaptations_ignorees"), []);
            save(clePourPlan("lk_adaptations_ignorees"), [...ignorees, semaineNum]);
            render();
          }
        },"Ignorer")
      )
    );
  })();

  // ── Notification allures dynamiques (22/07/2026) ──────────────────────────
  // Contrairement à adaptationEl ci-dessus (proposition avec bouton
  // "Appliquer" explicite), le changement d'allures dynamiques est déjà
  // appliqué automatiquement au moment où ce message existe (cf.
  // verifierEtAppliquerAlluresDynamiques) — ce bandeau est purement
  // informatif, avec un bouton "Compris" pour le faire disparaître (jamais
  // silencieux, mais pas bloquant non plus).
  const alluresDynamiquesEl = (() => {
    const message = load(clePourPlan("lk_message_allures_dynamiques"), null);
    if (!message) return null;
    return el("div",{style:{background:"rgba(var(--accent2-rgb),0.08)",border:"1px solid rgba(var(--accent2-rgb),0.25)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}},
        el("span",{style:{fontSize:"20px"}},"📈"),
        el("span",{style:{color:"var(--accent2)",fontSize:"15px",fontWeight:"700"}},"Allures mises à jour")
      ),
      el("div",{class:"muted",style:{fontSize:"14px",marginBottom:"12px",lineHeight:"1.5"}}, message),
      el("button",{style:{width:"100%",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"9px",color:"var(--text-muted)",fontSize:"14px",fontWeight:"600",cursor:"pointer"},
        feedback:true,
        onClick:()=>{
          save(clePourPlan("lk_message_allures_dynamiques"), null);
          render();
        }
      },"Compris")
    );
  })();

  // ── Proposition du moteur de décision (étape 4, doc intégration moteur-decision) ──
  // Cf. §8.2 doc intégration : carte au-dessus du plan de la semaine, même
  // esprit que adaptationEl ci-dessus. Détection AUTOMATIQUE à chaque rendu
  // du dashboard (§5 doc intégration, "fréquence de calcul : à chaque
  // ouverture"), application seulement sur clic explicite "Appliquer" —
  // §7.1 doc intégration : rien n'est automatique en V1, même les décisions
  // de sécurité à haute confiance. "Ignorer" ne mémorise le refus que pour
  // CETTE décision précise (regleId + date du jour) — une nouvelle décision
  // (même règle, jour différent, ou règle différente) sera reproposée
  // normalement, cohérent avec le comportement documenté en §8.1 point 7
  // ("le moteur pourra re-proposer... il ne insiste pas activement, il
  // réévalue simplement à chaque nouveau calcul").
  // todaySessions calculé ici (avant moteurDecisionEl, qui en dépend via
  // seanceQualiteAujourdhui) — CORRECTIF bug écran blanc du 23/07/2026 :
  // initialement déclaré plus bas dans renderDashboard(), après
  // moteurDecisionEl, causant une ReferenceError (temporal dead zone d'une
  // const utilisée avant sa déclaration). Réutilisé tel quel plus bas
  // (todayEl) — ne PAS redéclarer todaySessions une seconde fois.
  const todaySessions=ALL_SESSIONS.filter(s=>s.date===today());

  // Readiness pré-séance qualité (23/07/2026) — affichée UNIQUEMENT si
  // aujourd'hui est un jour de séance qualité (VMA/SEUIL/SPEC) ET que cette
  // séance n'a pas déjà un statut renseigné (statuses[uid], même test que
  // ligne ~5119 pour masquer un élément post-validation) — une fois la
  // séance faite/ratée/adaptée, la question "comment tu te sens POUR cette
  // séance" n'a plus de sens (readiness = ressenti PRÉ-séance, distinct du
  // RPE rétrospectif). uid utilisé comme clé de stockage : s'il y a
  // plusieurs séances qualité le même jour (rare), la readiness s'applique
  // à la première trouvée — cas non observé en pratique, pas géré
  // spécifiquement.
  const seanceQualiteAujourdhui = todaySessions.find(s =>
    ["VMA","SEUIL","SPEC"].includes(s.type) && (!statuses[s.uid] || statuses[s.uid] === '—')
  );
  let readinessEl = null;
  if (seanceQualiteAujourdhui) {
    const uidReadiness = seanceQualiteAujourdhui.uid;
    // "Normal" est désormais une VRAIE valeur par défaut (23/07/2026,
    // revirement suite à discussion avec Laurent) : écrite dans
    // sessionReadiness dès l'affichage si rien n'est encore enregistré —
    // pas juste un repère visuel comme la version précédente. Justifié
    // par : (1) aucun risque concret aujourd'hui, "normal"/"forme" n'ont de
    // toute façon aucun effet sur la modulation (seul "fatigue" en a un,
    // cf. moduleAmpleurSelonReadiness) ; (2) évite l'incohérence d'un
    // bouton affiché en surbrillance sans être la vraie valeur retenue.
    if (!sessionReadiness[uidReadiness]) {
      sessionReadiness[uidReadiness] = 'normal';
      save(clePourPlan("lk_session_readiness"), sessionReadiness);
    }
    let readinessVal = sessionReadiness[uidReadiness];
    const libelleActif = el("div",{style:{textAlign:"center",fontSize:"12px",color:"var(--text-muted)",marginTop:"6px"}});
    const readinessRow = el("div",{style:{display:"flex",gap:"6px",width:"100%"}});
    const rebuildReadiness = () => {
      readinessRow.innerHTML = "";
      READINESS_OPTIONS.forEach(o=>{
        const estActif = readinessVal===o.v;
        const rb = el("button",{title:o.label,style:{
          flex:"1",padding:"8px 0",fontSize:"32px",cursor:"pointer",
          background:estActif?"var(--accent2)":"var(--border-soft)",
          border:`1px solid ${estActif?"var(--accent2)":"var(--border)"}`,borderRadius:"8px"
        }}, o.e);
        rb.addEventListener("click", avecRetourTactile((e)=>{
          e.stopPropagation();
          readinessVal = o.v; // toujours une vraie valeur désormais, jamais null (pas de "désélection" possible)
          sessionReadiness[uidReadiness] = readinessVal;
          save(clePourPlan("lk_session_readiness"), sessionReadiness);
          rebuildReadiness();
          render(); // recalcule moteurDecisionEl, qui lit sessionReadiness (cf. plus bas)
        }));
        readinessRow.appendChild(rb);
      });
      const optionActive = READINESS_OPTIONS.find(o => o.v === readinessVal);
      libelleActif.textContent = optionActive ? optionActive.label : "";
    };
    rebuildReadiness();
    readinessEl = el("div",{style:{background:"rgba(var(--accent2-rgb),0.1)",border:"1px solid rgba(var(--accent2-rgb),0.3)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}},
        el("span",{style:{fontSize:"20px"}},"⚡"),
        el("span",{style:{color:"var(--accent2)",fontSize:"15px",fontWeight:"700"}},"Comment te sens-tu avant la séance d'aujourd'hui ?")
      ),
      readinessRow,
      libelleActif
    );

  }

// ── Journalisation decision_events / decision_outcomes (24/07/2026) ────────
// Chantier de vision "coach adaptatif à mémoire par coureur" (cf.
// docs/v2-methodologie/vision-coach-adaptatif.md) — étape 1 uniquement :
// AMASSER la donnée, sans jamais la relire ni l'exploiter. Aucune règle du
// RuleEngine, aucun garde-fou existant n'est touché par ce mécanisme — pur
// best-effort, écriture non-bloquante, cohérent avec le pattern déjà en
// place pour `signalements` (cf. ouvrirSignalementProbleme ci-dessus).
//
// Une seule ligne decision_events par décision/jour (anti-doublon par
// idDecisionDuJour, même logique que lk_decision_moteur_ignoree) — évite
// de réinsérer à chaque render(). L'id de la ligne insérée est mémorisé
// localement (lk_dernier_decision_event_id) pour permettre de retrouver la
// bonne ligne au moment d'un clic Appliquer/Ignorer, sans requête de
// lecture supplémentaire.
async function journaliserDecisionEvent(decision, etatMoteur, statut, idDecisionDuJour) {
  if (!LkAuth?.supabase) return null;
  const cleDernierEvent = clePourPlan("lk_dernier_decision_event_id");
  const dejaJournalise = load(cleDernierEvent, null);
  if (dejaJournalise && dejaJournalise.idDecisionDuJour === idDecisionDuJour) {
    return dejaJournalise.eventId; // déjà inséré aujourd'hui pour cette décision, ne pas dupliquer
  }
  try {
    const { data, error } = await LkAuth.supabase.from('decision_events').insert({
      user_id: window.__UTILISATEUR__?.id || null,
      plan_id: window.__PLAN_BRUT__?.id || null,
      regle_id: decision.id || null,
      priorite: typeof decision.priorite === 'number' ? decision.priorite : null,
      type_decision: decision.type || null,
      contexte: {
        runnerState: etatMoteur?.runnerState || null,
        engagementState: etatMoteur?.engagementState || null,
        readiness: seanceQualiteAujourdhui ? sessionReadiness[seanceQualiteAujourdhui.uid] : null,
        justification: decision.justification || null,
      },
      ampleur_demandee: typeof decision.ampleurPourcent === 'number' ? decision.ampleurPourcent : null,
      ampleur_appliquee: null,
      statut: statut,
    }).select('id').single();
    if (error || !data) return null;
    save(cleDernierEvent, { idDecisionDuJour, eventId: data.id });
    return data.id;
  } catch (e) {
    return null; // best-effort — jamais bloquer l'affichage de la carte pour ça
  }
}

// Marque une ligne decision_events existante comme appliquée/ignorée/
// refusée, avec l'ampleur réellement appliquée si connue. Best-effort,
// même principe.
//
// "refusee" (24/07/2026) : distingue une décision jamais tentée
// (proposee/ignoree) d'une décision que le coureur a essayé d'appliquer
// mais que DecisionEngineApply a refusée (ex. plafond de réduction
// cumulée atteint, plus de cible sûre) — sans ce statut, ces deux cas
// étaient indiscernables dans le journal (la ligne restait à "proposee").
// raisonRefus stockée dans contexte.raisonRefus (jsonb existant) plutôt
// qu'une nouvelle colonne — évite une migration de schéma pour un champ
// utilisé seulement dans ce cas précis.
async function mettreAJourStatutDecisionEvent(eventId, statut, ampleurAppliquee, raisonRefus) {
  if (!LkAuth?.supabase || !eventId) return;
  try {
    const payload = {
      statut,
      ampleur_appliquee: typeof ampleurAppliquee === 'number' ? ampleurAppliquee : null,
    };
    if (statut === 'refusee' && raisonRefus) {
      // Lecture du contexte existant nécessaire (update ne fusionne pas un
      // jsonb automatiquement) — best-effort, si cette lecture échoue on
      // écrit quand même le statut sans le détail de la raison plutôt que
      // de bloquer toute la mise à jour.
      try {
        const { data } = await LkAuth.supabase.from('decision_events').select('contexte').eq('id', eventId).single();
        payload.contexte = { ...(data?.contexte || {}), raisonRefus };
      } catch (e) {
        // contexte non enrichi, le statut "refusee" seul reste écrit ci-dessous
      }
    }
    await LkAuth.supabase.from('decision_events').update(payload).eq('id', eventId);
  } catch (e) {
    // best-effort, aucun impact sur le flux utilisateur si ça échoue
  }
}

  const moteurDecisionEl = (() => {
    if (!window.__PLAN_BRUT__ || window.__PLAN_BRUT__.estPlanRepli) return null;
    if (typeof DecisionEngineApply === 'undefined') return null; // scripts pas encore chargés, jamais planter le dashboard pour ça

    const niveauCoureur = profilCoureur?.niveau || 'intermediaire';

    // Readiness du jour, si une séance qualité a lieu aujourd'hui (cf.
    // readinessEl plus haut — même clé de stockage, même uid). undefined
    // si pas de séance qualité aujourd'hui ou readiness non renseignée.
    const readinessDuJour = seanceQualiteAujourdhui ? sessionReadiness[seanceQualiteAujourdhui.uid] : undefined;

    const etatMoteur = etatMoteurPartage;

    // Cas "readiness fatigué SANS décision reduire_charge du RuleEngine" —
    // cf. conception 23/07/2026, principe "entre-deux" : jamais de
    // modification automatique du plan sur readiness seul, mais un signal
    // visible plutôt qu'un silence total (le cas le plus fréquent en
    // pratique — cf. mémoire de session, R-024s/R-050 rarement déclenchées).
    const decisionBrute = etatMoteur ? etatMoteur.decision : null;
    if (readinessDuJour === "fatigue" && (!decisionBrute || decisionBrute.type !== 'reduire_charge')) {
      const cleIgnoreeReadiness = clePourPlan("lk_invitation_prudence_ignoree");
      const idInvitationDuJour = "readiness_fatigue_" + today();
      if (load(cleIgnoreeReadiness, null) !== idInvitationDuJour) {
        return el("div",{style:{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
          el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}},
            el("span",{style:{fontSize:"20px"}},"🪫"),
            el("span",{style:{color:"var(--text)",fontSize:"15px",fontWeight:"700"}},"Écoute ton corps aujourd'hui")
          ),
          el("div",{class:"muted",style:{fontSize:"14px",marginBottom:"12px",lineHeight:"1.5"}},
            "Tu as indiqué te sentir fatigué. Tes données ne montrent pas de signal particulier, mais rien ne t'empêche de commencer doucement et d'ajuster selon ton ressenti pendant la séance."
          ),
          el("button",{style:{width:"100%",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"9px",color:"var(--text-muted)",fontSize:"14px",fontWeight:"600",cursor:"pointer"},
            feedback:true,
            onClick:()=>{ save(cleIgnoreeReadiness, idInvitationDuJour); render(); }
          },"Compris")
        );
      }
    }

    if (!etatMoteur || !etatMoteur.decision) return null;
    const decisionOriginale = etatMoteur.decision;

    // Décisions informatives (alerter_*) : affichées mais sans bouton "Appliquer" (rien à appliquer au plan, cf. decision-engine-apply.classic.js)
    const estInformative = decisionOriginale.type !== 'reduire_charge';

    // Modulation readiness : construit une copie de la décision avec
    // l'ampleur éventuellement poussée au palier suivant (cf.
    // moduleAmpleurSelonReadiness ci-dessus). Jamais de mutation de
    // decisionOriginale — copie explicite pour ne jamais corrompre l'objet
    // retourné par le RuleEngine.
    const decision = estInformative ? decisionOriginale : {
      ...decisionOriginale,
      ampleurPourcent: moduleAmpleurSelonReadiness(decisionOriginale.ampleurPourcent, readinessDuJour),
    };

    const cleIgnoree = clePourPlan("lk_decision_moteur_ignoree");
    const ignoree = load(cleIgnoree, null);
    const idDecisionDuJour = decision.id + "_" + today();

    // Journalisation best-effort (cf. journaliserDecisionEvent ci-dessus) —
    // faite ici, AVANT le early-return sur "ignoree", pour capturer aussi
    // les décisions jamais cliquées (signal important pour l'usage futur de
    // cette donnée : savoir qu'une décision a été produite, pas seulement
    // celles sur lesquelles le coureur a agi).
    journaliserDecisionEvent(decision, etatMoteur, "proposee", idDecisionDuJour);

    if (ignoree === idDecisionDuJour) return null;

    // Pour une décision reduire_charge, vérifie qu'une cible sûre existe AVANT
    // d'afficher la carte — sinon on proposerait "Appliquer" sur un bouton qui
    // échouerait silencieusement, cf. limite actée le 16/07/2026 (séances de
    // qualité non modifiables automatiquement).
    let cibleInfo = null;
    if (!estInformative) {
      cibleInfo = DecisionEngineApply.trouverProchaineSeanceCible(window.__PLAN_BRUT__, new Date().toISOString(), niveauCoureur, decision.cibleQualitePrioritaire === true);
      if (!cibleInfo) return null; // aucune cible sûre cette semaine — le moteur reste muet plutôt que de proposer une action impossible
    }

    // Aperçu du km avant/après : pour une cible via réduction structurelle
    // (séance qualité, cf. 23/07/2026), l'ampleur réellement appliquée
    // diffère de decision.ampleurPourcent (arrondi à l'unité de répétition
    // près) — on ne peut donc pas prévisualiser le nouveau kmEstime sans
    // recalculer la réduction, ce qui modifierait le plan avant le clic.
    // Aperçu simplifié dans ce cas : pas de "→Xkm", juste le libellé.
    const texteApercu = estInformative
      ? decision.justification
      : cibleInfo.viaQualite
        ? decision.justification + ` (${cibleInfo.seance.type} — ajustement du nombre de répétitions)`
        : decision.justification + ` (${cibleInfo.seance.type}, ${Math.round(cibleInfo.seance.kmEstime * 10) / 10}→${Math.round(cibleInfo.seance.kmEstime * (1 + decision.ampleurPourcent / 100) * 10) / 10}km)`;

    // Titre distinct selon le type de décision (22/07/2026, signalé par
    // Laurent) : "Yoria te propose un ajustement" est trompeur pour une
    // décision purement informative (alerter_*), qui ne propose jamais
    // d'action concrète (pas de bouton Appliquer, cf. estInformative
    // ci-dessus) — juste un signal de vigilance à observer.
    const titreCarte = estInformative ? "Yoria a repéré un signal à surveiller" : "Yoria te propose un ajustement";

    return el("div",{style:{background:"rgba(var(--accent-rgb),0.07)",border:"1px solid rgba(var(--accent-rgb),0.2)",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}},
        el("span",{style:{fontSize:"20px"}},"🟠"),
        el("span",{style:{color:"var(--accent)",fontSize:"15px",fontWeight:"700"}},titreCarte)
      ),
      el("div",{class:"muted",style:{fontSize:"14px",marginBottom:"12px",lineHeight:"1.5"}}, texteApercu),
      el("div",{style:{display:"flex",gap:"8px"}},
        estInformative ? null : el("button",{style:{flex:"1",background:"var(--accent)",border:"none",borderRadius:"8px",padding:"9px",color:"#F8FAFC",fontSize:"14px",fontWeight:"700",cursor:"pointer"},
          feedback:true,
          onClick:()=>{
            const resultat = DecisionEngineApply.appliquerDecisionAuPlan(window.__PLAN_BRUT__, decision, new Date().toISOString(), niveauCoureur);
            if (!resultat.succes) {
              console.warn("Application de la décision du moteur refusée :", resultat.raison);
              const dejaJournaliseRefus = load(clePourPlan("lk_dernier_decision_event_id"), null);
              if (dejaJournaliseRefus?.eventId) {
                mettreAJourStatutDecisionEvent(dejaJournaliseRefus.eventId, "refusee", null, resultat.raison);
              }
              // Garde-fou §10.2 : un refus (ex. plafond de réduction cumulée
              // atteint) doit rester visible au coureur, jamais un clic
              // silencieux sans effet apparent — cf. principe "sécurité
              // avant performance", qui s'applique aussi à la clarté de
              // l'information donnée, pas seulement à la protection physique.
              alert("Cet ajustement n'a pas pu être appliqué : " + resultat.raison);
              return;
            }
            const dejaJournalise = load(clePourPlan("lk_dernier_decision_event_id"), null);
            if (dejaJournalise?.eventId) {
              mettreAJourStatutDecisionEvent(dejaJournalise.eventId, "appliquee", resultat.ampleurReelleAppliquee);
            }
            // Badge "repos_ecoute" (27/07/2026) — uniquement quand la
            // décision réellement appliquée est reduire_charge (pas les
            // décisions purement informatives alerter_*, qui n'ont pas de
            // bouton Appliquer de toute façon, ni un futur type de décision
            // qui passerait par ce même bouton sans être un allègement).
            if (decision.type === 'reduire_charge' && window.__badgesCache__ && !window.__badgesCache__.repos_ecoute) {
              enregistrerBadgeDebloque('repos_ecoute', 1).then(() => {
                window.__badgesCache__.repos_ecoute = true;
                window.__badgesNouveauxAAfficher__ = [...(window.__badgesNouveauxAAfficher__ || []), { badgeId: 'repos_ecoute', niveau: 1, seuil: null }];
              }).catch(() => {});
            }
            window.__PLAN_GENERE__ = traduirePlanVersFormatV1(window.__PLAN_BRUT__);
            PLAN = window.__PLAN_GENERE__;
            ALL_SESSIONS = recalculerAllSessions();
            if (window.__UTILISATEUR__?.id && window.LkSync?.mettreAJourPlanSupabase && window.__PLAN_BRUT__.id) {
              window.LkSync.mettreAJourPlanSupabase(window.__PLAN_BRUT__.id, window.__PLAN_BRUT__).catch(e => console.warn("Décision du moteur appliquée localement, sauvegarde échouée :", e.message));
            }
            render();
          }
        },"Appliquer"),
        el("button",{style:{flex:"1",background:"none",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"8px",padding:"9px",color:"var(--text-muted)",fontSize:"14px",fontWeight:"600",cursor:"pointer"},
          feedback:true,
          onClick:()=>{
            save(cleIgnoree, idDecisionDuJour);
            const dejaJournalise = load(clePourPlan("lk_dernier_decision_event_id"), null);
            if (dejaJournalise?.eventId) {
              mettreAJourStatutDecisionEvent(dejaJournalise.eventId, "ignoree", null);
            }
            render();
          }
        },"Ignorer")
      )
    );
  })();

  // Banniere post-course
  const raceResult = load(clePourPlan("lk_race_result"), null);
  if (!ESTMODEFORME && today() >= DATE_COURSE_REFERENCE && raceResult) {
    const diff = raceResult - raceGoalTime;
    const achieved = diff <= 0;
    const close = diff > 0 && diff <= 60;
    const color = achieved ? "var(--accent2)" : close ? "var(--warn)" : "var(--accent)";
    const emoji = achieved ? "🏅" : close ? "⚡" : "📈";
    const title = achieved ? "Objectif atteint !" : close ? "Tres belle course !" : "Belle progression !";
    const diffVsStart = BASE_TIME_REFERENCE - raceResult;
    const subtitle = achieved
      ? (Math.abs(diff) > 0 ? "-"+fmtTime(Math.abs(diff))+" sous objectif" : "Exactement dans les temps")
      : close ? "+"+fmtTime(Math.abs(diff))+" au-dessus objectif"
      : "-"+fmtTime(Math.abs(diffVsStart))+" par rapport au depart";
    const coachMsg2 = achieved
      ? "Bravo ! " + PLAN.length + " semaines de travail, tu as merite ce resultat. Lea est fiere de toi !"
      : close ? fmtTime(Math.abs(diff))+" ! Si proche. Belle progression en "+PLAN.length+" semaines."
      : "Belle progression de "+fmtTime(Math.abs(diffVsStart))+" en "+PLAN.length+" semaines. On continue !";

    const inp = document.createElement("input");
    inp.type="time"; inp.step="1";
    inp.style.cssText="flex:1;background:var(--border-soft);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:16px;";
    const hh=Math.floor(raceResult/3600), mm=Math.floor((raceResult%3600)/60), ss2=raceResult%60;
    inp.value=hh.toString().padStart(2,"0")+":"+mm.toString().padStart(2,"0")+":"+ss2.toString().padStart(2,"0");
    const saveBtn2=document.createElement("button");
    saveBtn2.textContent="OK";
    saveBtn2.style.cssText="background:"+color+";border:none;border-radius:8px;padding:8px 16px;color:"+(close?"var(--bg)":"#fff")+";font-size:14px;font-weight:700;cursor:pointer;";
    saveBtn2.addEventListener("click",()=>{
      const parts=inp.value.split(":");
      if(parts.length>=2){const secs=parseInt(parts[0])*3600+parseInt(parts[1])*60+(parseInt(parts[2])||0);if(!isNaN(secs)&&secs>0){save(clePourPlan("lk_race_result"),secs);render();}}
    });
    const inputRow=document.createElement("div");
    inputRow.style.cssText="display:flex;gap:8px;";
    inputRow.appendChild(inp); inputRow.appendChild(saveBtn2);
    const inputCard=el("div",{style:{background:"var(--bg)",borderRadius:"10px",padding:"12px",marginTop:"8px"}},
      el("div",{style:{color:"var(--text)",fontSize:"14px",fontWeight:"700",marginBottom:"8px"}},"Corriger mon resultat")
    );
    inputCard.appendChild(inputRow);
    const banner=el("div",{style:{background:"var(--bg)",border:"1px solid "+color+"44",borderRadius:"16px",padding:"20px",marginBottom:"12px",marginTop:"8px",textAlign:"center"}},
      el("div",{style:{fontSize:"48px",marginBottom:"8px"}},emoji),
      el("div",{style:{color:color,fontSize:"22px",fontWeight:"900",marginBottom:"4px"}},title),
      el("div",{style:{color:"var(--text)",fontSize:"15px",marginBottom:"16px"}},RACE_NAME+" - "+new Date(DATE_COURSE_REFERENCE+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1px 1fr",gap:"12px",marginBottom:"12px"}},
        el("div",{style:{textAlign:"center"}},el("div",{style:{color:"var(--text2)",fontSize:"11px",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"4px"}},"Objectif"),el("div",{style:{color:"var(--accent)",fontSize:"24px",fontWeight:"900"}},fmtTime(raceGoalTime))),
        el("div",{style:{background:"var(--border)"}}),
        el("div",{style:{textAlign:"center"}},el("div",{style:{color:"var(--text2)",fontSize:"11px",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"4px"}},"Resultat"),el("div",{style:{color:color,fontSize:"24px",fontWeight:"900"}},fmtTime(raceResult)))
      ),
      el("div",{style:{background:color+"22",border:"1px solid "+color+"44",borderRadius:"10px",padding:"12px",marginBottom:"12px"}},el("div",{style:{color:color,fontSize:"14px",fontWeight:"700"}},subtitle)),
      el("div",{style:{background:"var(--border-soft)",borderRadius:"8px",padding:"10px 12px",display:"flex",gap:"8px",textAlign:"left",marginBottom:"8px"}},el("span",{style:{fontSize:"18px",flexShrink:"0"}},"🤖"),el("div",{style:{color:"var(--text2)",fontSize:"13px",lineHeight:"1.5"}},coachMsg2))
    );
    banner.appendChild(inputCard);
    const hdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"12px 0 10px",marginBottom:"12px",borderBottom:"1px solid var(--border)"}},
      runByLeaIcon(24,6),
      el("div",{style:{color:"var(--text)",fontSize:"16px",fontWeight:"800"}},"Yoria"),
      el("div",{style:{flex:"1"}}),
      boutonSignalerProbleme(),
      el("div",{style:{background:"var(--border-soft)",borderRadius:"8px",padding:"4px 10px",color:"var(--accent)",fontSize:"14px",fontWeight:"700"}},"J-"+cd)
    );
    const wrapper=document.createElement("div");
    wrapper.style.cssText="padding:0 16px 100px;";
    wrapper.appendChild(hdr); wrapper.appendChild(banner);
    return wrapper;
  }
  const total=ALL_SESSIONS.filter(s=>s.type!=="REPOS"&&s.type!=="RACE").length;
  const pred=currentPred||predict10K();

  const heroPred = el("div",{style:{background:"linear-gradient(135deg,var(--bg) 0%,var(--border-soft) 100%)",borderRadius:"16px",padding:"16px",marginBottom:"12px",border:"1px solid rgba(var(--accent-rgb),0.2)",marginTop:"8px"}},
    // ── Header : course ──────────────────────────────────────────────────────
    el("div",{style:{marginBottom:"14px"}},
      el("a",{href:RACE_URL,target:"_blank",style:{color:"var(--accent)",fontSize:"15px",fontWeight:"700",textDecoration:"none",display:"block",marginBottom:"2px"}},"🏁 "+RACE_NAME+" ↗"),
      el("div",{class:"muted",style:{fontSize:"13px"}},new Date(DATE_COURSE_REFERENCE+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})+" · "+RACE_LOCATION)
    ),
    // ── Objectif vs Estimation ────────────────────────────────────────────
    el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1px 1fr",gap:"12px",marginBottom:"14px"}},
      el("div",{style:{textAlign:"center"}},
        el("div",{class:"label",style:{marginBottom:"4px"}},"Objectif"),
        el("div",{style:{color:"var(--accent)",fontSize:"32px",fontWeight:"900",letterSpacing:"-1px",lineHeight:"1"}},fmtTime(raceGoalTime)),
        el("div",{class:"muted",style:{fontSize:"13px",marginTop:"2px"}},fmtPace(DISTANCE_M_REFERENCE/raceGoalTime)+"/km")
      ),
      el("div",{style:{background:"var(--border)"}}),
      (()=>{
        const estimEl = el("div",{style:{textAlign:"center",cursor:"pointer"}},
          el("div",{class:"label",style:{marginBottom:"4px"}},"Estimation"),
          el("div",{style:{color:"var(--text)",fontSize:"32px",fontWeight:"900",letterSpacing:"-1px",lineHeight:"1"}},pred.time ? fmtTime(pred.time) : "—"),
          el("div",{style:{color:pred.gap<=0?"var(--accent2)":pred.gap<=30?"var(--warn)":"var(--warn)",fontSize:"13px",marginTop:"2px",fontWeight:"700"}},
            pred.gap<=0 ? "−"+fmtTime(Math.abs(pred.gap))+" ✅" : "+"+fmtTime(pred.gap)+" ⚠️"
          )
        );
        // Panneau détail sources (caché par défaut)
        let detailOpen = false;
        const detailEl = el("div",{style:{display:"none",background:"var(--border-soft)",borderRadius:"8px",padding:"10px 12px",marginTop:"8px"}},
          el("div",{class:"muted",style:{fontSize:"12px",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"8px"}},"Sources"),
          ...pred.details.map(d => {
            const parts = d.label.split(" · dernier ");
            const mainLabel = parts[0];
            const dateLabel = parts[1] ? "dernier " + parts[1] : null;
            return el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}},
              el("div",{},
                el("div",{class:"muted",style:{fontSize:"13px"}},mainLabel),
                dateLabel ? el("div",{class:"muted",style:{fontSize:"12px",opacity:"0.7"}},dateLabel) : null
              ),
              el("span",{style:{color:"var(--text)",fontSize:"13px",fontWeight:"600",whiteSpace:"nowrap",marginLeft:"8px"}},d.value)
            );
          }),
          el("div",{style:{borderTop:"1px solid var(--border)",marginTop:"6px",paddingTop:"6px",display:"flex",justifyContent:"space-between"}},
            el("span",{class:"muted",style:{fontSize:"13px"}},"Méthode"),
            el("span",{style:{color:"var(--text)",fontSize:"13px"}},pred.method)
          )
        );
        estimEl.addEventListener("click", () => {
          detailOpen = !detailOpen;
          detailEl.style.display = detailOpen ? "block" : "none";
        });
        const wrap = document.createElement("div");
        wrap.appendChild(estimEl);
        wrap.appendChild(detailEl);
        return wrap;
      })()
    ),
    // ── Fourchette + barre gradient compactes ───────────────────────────────
    el("div",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"12px",marginBottom:"8px"}},
      el("span",{class:"muted"},pred.timeLow+"–"+pred.timeHigh),
      el("span",{class:"muted"},"·"),
      el("span",{class:"muted"},pred.confidence+"% · "+pred.details.length+" source"+(pred.details.length>1?"s":"")+" ›")
    ),
    el("div",{style:{height:"5px",borderRadius:"3px",background:"linear-gradient(to right,var(--warn),var(--warn),var(--warn),var(--accent2))",position:"relative",marginBottom:"4px"}},
      pred.time <= OBJECTIF_REFERENCE
        ? null
        : el("div",{style:{
            position:"absolute",top:"50%",
            transform:"translate(-50%,-50%)",
            left:Math.min(Math.max((BASE_TIME_REFERENCE-pred.time)/(BASE_TIME_REFERENCE-OBJECTIF_REFERENCE)*100,2),98)+"%",
            width:"11px",height:"11px",borderRadius:"50%",
            background:pred.time<=OBJECTIF_REFERENCE?"var(--accent2)":pred.time<=OBJECTIF_REFERENCE+30?"var(--warn)":pred.time<=OBJECTIF_REFERENCE+60?"var(--warn)":"var(--warn)",
            border:"2px solid var(--bg)",
            boxShadow:"0 0 0 2px "+(pred.time<=OBJECTIF_REFERENCE?"var(--accent2)":pred.time<=OBJECTIF_REFERENCE+30?"var(--warn)":pred.time<=OBJECTIF_REFERENCE+60?"var(--warn)":"var(--warn)")+"44"
          }})
    ),
    el("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"8px"}},
      el("span",{class:"muted",style:{fontSize:"10px"}},fmtTime(BASE_TIME_REFERENCE)),
      pred.time <= OBJECTIF_REFERENCE ? el("span",{style:{color:"var(--accent2)",fontSize:"11px",fontWeight:"700"}},"🎯 Objectif atteint !") : null,
      el("span",{class:"muted",style:{fontSize:"10px"}},fmtTime(OBJECTIF_REFERENCE))
    ),
    // ── Stats séances ─────────────────────────────────────────────────────
    (()=>{
      const totalKmRun = Math.round(activitesDuPlanPartage.reduce((s,a)=>s+a.distance,0)/100)/10;
      return el("div",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"13px",paddingTop:"10px",borderTop:"1px solid rgba(var(--text-rgb),0.2)",marginTop:"10px"}},
        el("span",{style:{color:"var(--accent2)",fontWeight:"700"}},"✅ "+done),
        el("span",{class:"muted"},"·"),
        el("span",{style:{color:"var(--warn)",fontWeight:"700"}},"⚠️ "+adapted),
        el("span",{class:"muted"},"·"),
        el("span",{style:{color:"var(--warn)",fontWeight:"700"}},"❌ "+missed),
        el("span",{class:"muted"},"·"),
        el("span",{style:{color:"var(--accent)",fontWeight:"700"}},"😴 "+skipped),
