    renderGroupeAccordeonStats("📖","Référence","var(--text-muted)", [
      paceEl,
      infoEl
    ]),

    // "🏅 Mes courses" (05/08/2026) — historique multi-plans, cf.
    // renderMesCoursesEl ci-dessus. mesCoursesConteneur est construit une
    // fois ici, réutilisé par onOuverture (pas de reconstruction complète
    // du DOM à chaque ouverture/fermeture, seul son contenu interne
    // change) — mesCoursesConteneur.innerHTML="" + reconstruction est géré
    // DANS renderMesCoursesEl, pas ici.
    (()=>{
      const mesCoursesConteneur = el("div",{});
      renderMesCoursesEl(mesCoursesConteneur); // état initial (cache déjà chargé, ou message d'invite)
      return renderGroupeAccordeonStats("🏅","Mes courses","var(--accent2)", [
        mesCoursesConteneur
      ], () => {
        // onOuverture : ne relance la requête Supabase qu'une fois par
        // session (cache déjà chargé) — sinon lance le chargement et
        // rafraîchit CE conteneur seul une fois la réponse arrivée,
        // sans passer par un render() complet (cohérent avec le principe
        // "pas de reconstruction inutile de tout l'écran" déjà appliqué
        // ailleurs dans Stats/Réglages).
        if (mesCoursesCache !== null || mesCoursesEnCours) return;
        if (!window.__UTILISATEUR__?.id || !window.LkSync?.chargerResultatsCoursesSupabase) {
          mesCoursesCache = [];
          renderMesCoursesEl(mesCoursesConteneur);
          return;
        }
        mesCoursesEnCours = true;
        renderMesCoursesEl(mesCoursesConteneur);
        window.LkSync.chargerResultatsCoursesSupabase(window.__UTILISATEUR__.id)
          .then(resultats => { mesCoursesCache = resultats || []; })
          .catch(() => { mesCoursesCache = []; })
          .finally(() => {
            mesCoursesEnCours = false;
            renderMesCoursesEl(mesCoursesConteneur);
          });
      });
    })(),

    // Section "Tests" (31/07/2026) — remise en place sur demande de
    // Laurent après un premier retrait complet le même jour : finalement
    // conservée, mais séparée des 4 groupes utilisateur ci-dessus plutôt
    // que mêlée à eux (Module 2 SessionAnalyzer, Module 3, Module 4
    // TrendAnalyzer — ajoutés le 17/07/2026, jamais nettoyés depuis).
    renderGroupeAccordeonStats("🧪","Tests","var(--text-muted)", [
      moduleTestEl,
      moduleTest3El,
      moduleTest4El
    ])
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// ÉCRAN DÉTAILLÉ DES BADGES (27/07/2026)
// ══════════════════════════════════════════════════════════════════════════════
// Accessible depuis la carte cliquable en haut de renderStats(). Affiche
// TOUS les badges obtenables, groupés par catégorie, qu'ils soient
// débloqués ou non (principe explicitement acté avec Laurent : jamais
// masquer un badge non débloqué de la liste, cf. §16). Barre de
// progression globale en tête. Cache non chargé : message d'attente
// simple plutôt qu'un écran vide silencieux.
const LIBELLES_CATEGORIES_BADGES = {
  regularite:  "Régularité",
  progression: "Progression",
  corps:       "Respect du corps",
  etapes:      "Étapes du plan",
};

function renderBadges() {
  if (!window.__badgesCache__) {
    return el("div",{style:{padding:"0 16px 100px"}},
      el("div",{class:"muted",style:{textAlign:"center",padding:"40px 0",fontSize:"14px",fontStyle:"italic"}},"Chargement de tes badges...")
    );
  }

  const totalBadges = Object.keys(DEFINITIONS_BADGES).length;
  let nbDebloques = 0;
  for (const [badgeId, def] of Object.entries(DEFINITIONS_BADGES)) {
    const etat = window.__badgesCache__[badgeId];
    if (def.paliers.length > 0 ? (etat > 0) : !!etat) nbDebloques++;
  }

  const barreGlobaleEl = el("div",{style:{marginBottom:"20px"}},
    el("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
      el("div",{style:{flex:"1",height:"6px",background:"var(--border-soft)",borderRadius:"3px",overflow:"hidden"}},
        el("div",{style:{height:"100%",width:(nbDebloques/totalBadges*100)+"%",background:"var(--accent2)",borderRadius:"3px"}})
      ),
      el("div",{style:{fontSize:"12px",fontWeight:"700",color:"var(--text2)",whiteSpace:"nowrap"}}, nbDebloques+" / "+totalBadges)
    )
  );

  const categoriesOrdre = ["regularite", "progression", "corps", "etapes"];
  const sectionsEl = categoriesOrdre.map(cat => {
    const badgesDeLaCategorie = Object.entries(DEFINITIONS_BADGES).filter(([, def]) => def.categorie === cat);
    if (badgesDeLaCategorie.length === 0) return null;

    const vignettesEl = badgesDeLaCategorie.map(([badgeId, def]) => {
      const libelle = LIBELLES_BADGES[badgeId];
      let sousLibelle;
      if (def.paliers.length > 0) {
        const niveauActuel = window.__badgesCache__[badgeId] ?? 0;
        sousLibelle = niveauActuel > 0 && niveauActuel < def.paliers.length
          ? libelle.paliers[niveauActuel] // prochain palier visé, pas celui déjà atteint
          : (niveauActuel >= def.paliers.length ? libelle.paliers[def.paliers.length - 1] : libelle.paliers[0]);
      } else {
        sousLibelle = libelle.nom;
      }
      return el("div",{style:{textAlign:"center"}},
        renderAnneauBadge(badgeId, false, 52),
        el("div",{style:{fontSize:"10px",color:"var(--text2)",fontWeight:"600",marginTop:"3px",lineHeight:"1.2"}}, sousLibelle)
      );
    });

    return el("div",{style:{marginBottom:"20px"}},
      el("div",{style:{fontSize:"11px",fontWeight:"700",color:COULEURS_CATEGORIE_BADGES[cat],textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"10px"}}, LIBELLES_CATEGORIES_BADGES[cat]),
      el("div",{style:{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:"10px"}}, ...vignettesEl)
    );
  }).filter(Boolean);

  return el("div",{style:{padding:"0 16px 100px"}}, barreGlobaleEl, ...sectionsEl);
}

// ══════════════════════════════════════════════════════════════════════════════
// STRATÉGIE DE COURSE (partagée)
// ══════════════════════════════════════════════════════════════════════════════
// Sortie de renderCourse() le 19/07/2026 pour être réutilisable aussi par la
// carte de séance RACE dans la vue Semaine (bug : les deux endroits
// affichaient des segments/allures différents, la vue Semaine ayant sa
// propre version simplifiée à 2 segments non calibrée).
//
// Calcule les segments à partir de définitions avec un ÉCART relatif
// (offsetSecKm) pour tous les segments SAUF le dernier — le dernier
// segment est calibré mathématiquement pour compenser exactement l'écart
// accumulé, garantissant que la somme des temps de tous les segments
// corresponde TOUJOURS exactement au temps objectif, quelle que soit la
// stratégie choisie pour les segments intermédiaires.
//
// Bug corrigé le 11 juillet 2026 : l'ancienne version fixait une allure
// PLUS LENTE que l'objectif sur le premier segment (marge de sécurité au
// départ), mais le second segment restait exactement à l'allure cible
// moyenne, sans jamais compenser la perte de temps du premier — le temps
// total dépassait systématiquement l'objectif (33s de trop mesurées sur
// un 10K à 48:30, repéré par Laurent). Cette fonction élimine
// structurellement ce risque : le dernier segment absorbe toujours
// exactement l'écart nécessaire.
function calculerSplitsCalibres(distanceKm, tempsObjectifSec, definitionsSegmentsIntermediaires, dernierNote) {
  const paceMoyen = tempsObjectifSec / distanceKm;
  let tempsUtilise = 0, distUtilisee = 0;
  const segments = definitionsSegmentsIntermediaires.map(d => {
    const pace = paceMoyen + d.offsetSecKm;
    const dist = d.to - d.from;
    tempsUtilise += dist * pace;
    distUtilisee += dist;
    return { from: d.from, to: d.to, note: d.note, pace };
  });
  const distRestante = distanceKm - distUtilisee;
  const tempsRestant = tempsObjectifSec - tempsUtilise;
  segments.push({ from: distUtilisee, to: distanceKm, note: dernierNote, pace: tempsRestant / distRestante });
  return segments;
}

// Choix des segments selon la distance de course. Bug trouvé le 7 juillet
// 2026 : la carte était entièrement câblée pour un 10K (5 segments de 0 à
// 10km, conseil coach mentionnant "le km 7 et 10") — un plan Semi/
// Marathon/5K affichait des allures et un conseil complètement hors sujet.
function calculerStrategieCourse(distanceKmCourse, tempsObjectifSec) {
  if (distanceKmCourse <= 5.5) {
    // 5K : quasi-plat, 4 segments avec progression continue
    const d = Math.round(distanceKmCourse);
    return calculerSplitsCalibres(distanceKmCourse, tempsObjectifSec, [
      { from:0, to:Math.min(1,d*0.2), note:"Départ prudent", offsetSecKm: 6 },
      { from:Math.min(1,d*0.2), to:d*0.45, note:"Allure cible", offsetSecKm: 1 },
      { from:d*0.45, to:d*0.8, note:"Accélération progressive", offsetSecKm: -2 },
    ], "Tout donner");
  } else if (distanceKmCourse <= 12) {
    // 10K : 4 segments — départ prudent, montée en régime, allure cible
    // soutenue, effort final (au lieu des 2 segments bruts de l'ancienne
    // version, qui ne compensaient jamais le départ prudent)
    const d = distanceKmCourse;
    return calculerSplitsCalibres(d, tempsObjectifSec, [
      { from:0, to:d*0.2, note:"Départ prudent", offsetSecKm: 8 },
      { from:d*0.2, to:d*0.5, note:"Montée en régime", offsetSecKm: 2 },
      { from:d*0.5, to:d*0.8, note:"Allure cible soutenue", offsetSecKm: -2 },
    ], "Dernier effort, tout donner");
  } else if (distanceKmCourse <= 25) {
    // Semi — bornes km FIXES (20/07/2026, demande explicite de Laurent :
    // plus lisible en course que des pourcentages calculés, un coureur
    // suit ses passages sur des repères ronds). Tous les 5km : départ
    // prudent (0-5), allure cible régulière (5-10, 10-15), ajustement au
    // ressenti en fin de course (15-21.1).
    const d = distanceKmCourse;
    return calculerSplitsCalibres(d, tempsObjectifSec, [
      { from:0, to:5, note:"Départ prudent", offsetSecKm: 5 },
      { from:5, to:10, note:"Allure cible, régularité", offsetSecKm: -0.5 },
      { from:10, to:15, note:"Allure cible, régularité", offsetSecKm: -0.5 },
    ], "Ajuste au ressenti en fin de course");
  } else {
    // Marathon — bornes km FIXES (20/07/2026, même demande, paliers non
    // uniformes actés avec Laurent) : 0-5 prudent, 5-10 encore un peu
    // prudent (l'erreur de départ pèse plus lourd sur cette distance),
    // 10-20/20-30/30-35 allure cible régulière, 35-42.2 ajustement au
    // ressenti (les derniers km sont les plus difficiles à tenir).
    const d = distanceKmCourse;
    return calculerSplitsCalibres(d, tempsObjectifSec, [
      { from:0, to:5, note:"Marge de sécurité, ne pars pas trop vite", offsetSecKm: 6 },
      { from:5, to:10, note:"Encore prudent", offsetSecKm: 3 },
      { from:10, to:20, note:"Allure cible, régularité", offsetSecKm: -0.5 },
      { from:20, to:30, note:"Allure cible, régularité", offsetSecKm: -0.5 },
      { from:30, to:35, note:"Allure cible, régularité", offsetSecKm: -0.5 },
    ], "Ajuste au ressenti en fin de course");
  }
}

          })()
        ),

          el("span",{class:"muted",style:{fontSize:"15px"}},"Départ course"),

            inp.type = "time"; inp.id = "horaire-depart-input";
            inp.style.cssText = "width:110px;background:var(--border-soft);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text);font-size:13px;text-align:right;box-sizing:border-box;";

            inp.addEventListener("change", (e)=>{ raceHoraires.depart=e.target.value; save(clePourPlan("lk_race_horaires"),raceHoraires); });

  const CHECKLIST = [

    {key:"tenue",label:"Tenue de course"},
    {key:"ravitaillement",label:"Ravitaillement (eau, gel)"},

  const checklistCard = el("div",{style:{marginBottom:"16px"}},
    el("div",{class:"label"},"🎽 Checklist équipement"),
    card(
      el("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}},
        ...CHECKLIST.map(item=>{
          const checked = checklistItems[item.key]||false;
          const row = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",cursor:"pointer"}},

            }}, checked?el("span",{style:{color:"#F8FAFC",fontSize:"14px",fontWeight:"700"}},"✓"):null),

          row.addEventListener("click",()=>{
            checklistItems[item.key]=!checked;
            save(clePourPlan("lk_checklist"),checklistItems);
            render();
          });
          return row;
        })
      )
    )
  );

  // strategieCard (codée en dur, jamais mise à jour selon le vrai objectif
  // de Laurent) retirée le 11 juillet 2026 — n'était en fait plus utilisée
  // dans l'assemblage final depuis un moment (vrai code mort), remplacée
  // depuis par splitsCard ci-dessous, calculée dynamiquement.

  const parcoursCard = el("div",{style:{marginBottom:"16px"}},
    el("div",{class:"label"},"🗺️ Parcours"),
    card(
      (()=>{
        const inp = document.createElement("input");
        inp.type = "text"; inp.placeholder = "Lien GPX ou carte du parcours...";
        inp.id = "race-parcours-url"; inp.name = "race-parcours-url"; // 13/08/2026 : Chrome DevTools (Issues) signale un champ de formulaire sans id/name, gêne l'autofill du navigateur
        inp.style.cssText = "width:100%;background:var(--border-soft);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;box-sizing:border-box;";
        inp.value = raceParcoursUrl || "";
        inp.addEventListener("input", (e)=>{ raceParcoursUrl=e.target.value; save(clePourPlan("lk_race_parcours"),raceParcoursUrl); });
        return inp;
      })(),
      raceParcoursUrl?el("a",{href:raceParcoursUrl,target:"_blank",style:{display:"block",marginTop:"8px",color:"var(--accent)",fontSize:"14px"}},"→ Voir le parcours"):null
    )
  );

  // ── Météo prévue le jour de la course ───────────────────────────────────
  let meteoRaceEl = null;
  // Fetch météo si on est à moins de 16 jours (Open-Meteo limite à 16 jours)
  const daysToRace = Math.max(0, parseInt(countdown())||0);
  if (daysToRace <= 16) {
    // La météo sera fetchée et affichée
    meteoRaceEl = el("div",{style:{marginBottom:"16px"}},
      el("div",{class:"label"},"🌡️ Météo prévue le "+fmtDate(DATE_COURSE_REFERENCE)),
      card(
        el("div",{style:{textAlign:"center"}},
          el("div",{class:"muted",style:{fontSize:"14px",fontStyle:"italic"}},"Disponible dans les 16 jours avant la course")
        )
      )
    );
  } else {
    meteoRaceEl = el("div",{style:{marginBottom:"16px"}},
      el("div",{class:"label"},"🌡️ Météo prévue le "+fmtDate(DATE_COURSE_REFERENCE)),
      card(
        el("div",{style:{textAlign:"center"}},
          el("div",{class:"muted",style:{fontSize:"14px",fontStyle:"italic"}},"Disponible à partir du "+fmtDate((() => {
            // CORRECTIF 23/07/2026 : l'ancien calcul (Date - 16*86400000 ms
            // puis toISOString()) risquait un décalage d'un jour selon l'heure
            // d'exécution (mélange interprétation locale de DATE_COURSE_REFERENCE
            // et reconversion UTC) — remplacé par setDate(), cohérent avec
            // demain()/today() ci-dessus, gère aussi nativement les changements
            // heure été/hiver sur une plage de 16 jours.
            const d = new Date(DATE_COURSE_REFERENCE+"T00:00:00");
            d.setDate(d.getDate() - 16);
            const yyyy = d.getFullYear(), mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
            return `${yyyy}-${mm}-${dd}`;
          })())+" · J–"+daysToRace+" actuellement")
        )
      )
    );
  }

  // ── Allures de passage aux km clés ───────────────────────────────────────
  // Segments par distance — même logique/mêmes décalages de pace que
  // genererContenuRace() dans plan-generator.js (section 2.7 du doc de
  // convergence). calculerStrategieCourse() est définie plus haut comme
  // fonction globale (cf. section "STRATÉGIE DE COURSE (partagée)") pour
  // être réutilisée à la fois ici et dans la carte de séance de la vue
  // Semaine — bug corrigé le 19/07/2026 : les deux endroits affichaient
  // des stratégies différentes (segments/allures) car la vue Semaine avait
  // sa propre version simplifiée à 2 segments, non calibrée, divergente de
  // celle-ci.
  const distanceKmCourse = DISTANCE_M_REFERENCE / 1000;
  const splits = calculerStrategieCourse(distanceKmCourse, raceGoalTime);

  // Calculer les temps de passage cumulés
  const passageTimes = [];
  let cumul = 0;
  splits.forEach(s => {
    const dist = s.to - s.from;
    cumul += dist * s.pace;
    passageTimes.push(Math.round(cumul));
  });

  const splitsCard = el("div",{style:{marginBottom:"16px"}},
    el("div",{class:"label"},"🏃 Allures de passage"),
    el("div",{style:{background:"var(--bg)",boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",borderRadius:"10px",overflow:"hidden"}},
      el("div",{style:{display:"grid",gridTemplateColumns:"60px 1fr 70px 70px",gap:"0",padding:"8px 12px",borderBottom:"1px solid var(--border)"}},
        el("span",{class:"muted",style:{fontSize:"12px",fontWeight:"700"}},"SEGMENT"),
        el("span",{class:"muted",style:{fontSize:"12px",fontWeight:"700"}},"STRATÉGIE"),
        el("span",{class:"muted",style:{fontSize:"12px",fontWeight:"700",textAlign:"right"}},"ALLURE"),
        el("span",{class:"muted",style:{fontSize:"12px",fontWeight:"700",textAlign:"right"}},"PASSAGE")
      ),
      ...splits.map((s,i)=>{
        const paceStr = Math.floor(s.pace/60)+":"+(Math.round(s.pace%60)).toString().padStart(2,"0")+"/km";
        const passageStr = fmtTime(passageTimes[i]) || "--";
        // 20/07/2026, bug remonté par Laurent (plan Marathon affichant
        // "35.870000000000005 km") : s.from/s.to sont des flottants issus
        // de divisions décimales (ex. 42.2*0.85), jamais arrondis avant
        // l'affichage — l'imprécision binaire classique de JS (0.1+0.2 !==
        // 0.3) remonte telle quelle dans le label. Le calcul interne
        // (pace, cumul des temps) reste volontairement sur les valeurs
        // précises non arrondies pour ne rien perdre en précision — seul
        // l'AFFICHAGE de la borne est concerné ici.
        const fromArrondi = Math.round(s.from * 10) / 10;
        const toArrondi = Math.round(s.to * 10) / 10;
        const segLabel = fromArrondi+"→"+toArrondi+" km";
        const posRelative = i / (splits.length - 1 || 1); // 0 = premier segment, 1 = dernier
        const color = posRelative < 0.4 ? "var(--accent)" : posRelative < 0.7 ? "var(--accent)" : "var(--accent2)";
        return el("div",{style:{display:"grid",gridTemplateColumns:"60px 1fr 70px 70px",gap:"0",padding:"10px 12px",borderBottom:i<splits.length-1?"1px solid var(--border)":"none",alignItems:"center"}},
          el("span",{style:{color,fontSize:"13px",fontWeight:"700"}},segLabel),
          el("span",{class:"muted",style:{fontSize:"13px"}},s.note),
          el("span",{style:{color:"var(--text)",fontSize:"14px",fontWeight:"600",textAlign:"right"}},paceStr),
          el("span",{style:{color,fontSize:"14px",fontWeight:"700",textAlign:"right"}},passageStr)
        );
      })
    )
  );

  // ── Résumé de préparation ─────────────────────────────────────────────────
  const pred = currentPred || predict10K();
  const pastSess = ALL_SESSIONS.filter(s=>s.type!=="REPOS"&&s.type!=="RACE"&&s.date<=today());
  const totalDone = pastSess.filter(s=>statuses[s.uid]==="✅").length;
  const totalAdapted = pastSess.filter(s=>statuses[s.uid]==="⚠️").length;
  const totalMissed = pastSess.filter(s=>statuses[s.uid]==="❌").length;
  const totalSess = pastSess.length;
  const totalKmRace = Math.round(activitesDuPlan().reduce((s,a)=>s+a.distance,0)/100)/10;
  const completionRate = totalSess > 0 ? Math.round((totalDone+totalAdapted)/totalSess*100) : 0;
  const verdictRaceColor = completionRate >= 80 ? "var(--accent2)" : completionRate >= 60 ? "var(--warn)" : "var(--warn)";

  const prepCard = el("div",{style:{marginBottom:"12px"}},
    el("div",{class:"label"},"📋 Résumé de préparation"),
    card(
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}},
        el("div",{style:{background:"var(--border-soft)",borderRadius:"8px",padding:"10px",textAlign:"center"}},
          el("div",{style:{color:"var(--accent2)",fontSize:"20px",fontWeight:"800"}},totalDone+""),
          el("div",{class:"muted",style:{fontSize:"12px"}},"✅ validées")
        ),
        el("div",{style:{background:"var(--border-soft)",borderRadius:"8px",padding:"10px",textAlign:"center"}},
          el("div",{style:{color:"var(--text)",fontSize:"20px",fontWeight:"800"}},totalKmRace+" km"),
          el("div",{class:"muted",style:{fontSize:"12px"}},"courus")
        ),
        el("div",{style:{background:"var(--border-soft)",borderRadius:"8px",padding:"10px",textAlign:"center"}},
          el("div",{style:{color:pred.time?verdictRaceColor:"var(--text-muted)",fontSize:"20px",fontWeight:"800"}},pred.time?fmtTime(pred.time):"—"),
          el("div",{class:"muted",style:{fontSize:"12px"}},"estimation")
        )
      ),
      // Bug corrigé (31/07/2026) : verdictRaceColor+"11" collait un suffixe
      // hex directement sur une variable CSS (var(--warn)11 — invalide,
      // même famille de bug déjà documentée pour colorAvecOpacite() plus
      // haut dans ce fichier, jamais appliquée ici). Remplacé par
      // colorAvecOpacite(), avec les opacités réelles visées par les
      // anciens suffixes hex (0x11/255≈0.067 pour le fond, 0x33/255=0.2
      // pour la bordure), pour garder la même intention visuelle.
      el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"8px 10px",background:colorAvecOpacite(verdictRaceColor,0.067),border:"1px solid "+colorAvecOpacite(verdictRaceColor,0.2),borderRadius:"8px"}},
        el("span",{style:{fontSize:"16px"}},completionRate>=80?"🟢":completionRate>=60?"🟡":"🔴"),
        el("div",{},
          el("div",{style:{color:verdictRaceColor,fontSize:"14px",fontWeight:"700"}},completionRate+"% de complétion"),
          el("div",{class:"muted",style:{fontSize:"12px"}},(totalDone+totalAdapted)+" / "+totalSess+" séances réalisées · "+totalMissed+" ratée"+(totalMissed>1?"s":""))
        )
      )
    )
  );

  // ── Conseil Coach spécifique course ───────────────────────────────────────
  // Remplace le 11 juillet 2026 un texte codé en dur qui ne faisait que
  // reformuler mécaniquement les segments déjà affichés dans splitsCard
  // ci-dessus (aucune valeur ajoutée, signalé par Laurent) — vrai appel IA
  // maintenant, avec un contexte dédié (écart estimation/objectif, jours
  // restants) plutôt qu'une répétition des mêmes chiffres.
  // Déclenche le premier appel si aucun message n'a encore été chargé pour
  // ce plan (pas de vraie clé de date, contrairement à coachMsg — le
  // contexte course change peu d'un jour à l'autre), OU si la stratégie

// PARAMÈTRES
// ══════════════════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════════
// GESTION DES SEANCES (suppression + deplacement)
// ══════════════════════════════════════════════════════════════════════════════

// Obtenir la session effective sur un slot (apres swap)
// NOUVEAU MODÈLE DE SWAP (refonte complète — l'ancien modèle en paires
// bidirectionnelles avec libererSwap() ne correspondait pas à l'usage
// réel : Laurent enchaîne plusieurs échanges successifs et attend une
// vraie ROTATION en chaîne, pas un remplacement de la dernière paire.
// Exemple validé avec Laurent : Lundi(EF)↔Mardi(SEUIL) puis
// Mardi↔Mercredi(LONG) doit donner Lundi=SEUIL, Mardi=LONG, Mercredi=EF —
// exactement le résultat d'un échange PHYSIQUE classique appliqué deux
// fois de suite, comme on échangerait deux cartes à la main. L'ancien
// modèle "libère l'ancien partenaire avant d'en poser un nouveau"
// donnait un résultat différent et non voulu.
//
// swappedSessions[uid] = uidSource signifie maintenant : "la position uid
// affiche le contenu D'ORIGINE de la position uidSource". Si l'entrée
// n'existe pas, la source implicite est uid lui-même (aucun swap actif).
// Un seul niveau de lookup suffit TOUJOURS avec ce modèle — swappedUid()
// écrit directement la source finale à chaque échange (cf. échangerSwap()
// plus bas), jamais une vraie chaîne à résoudre récursivement.
function sourceSwap(uid) {
  let swaps = {};
  try { swaps = swappedSessions; } catch (e) { /* TDZ, pas de swap à appliquer */ }
  return swaps[uid] !== undefined ? swaps[uid] : uid;
}

// Échange PHYSIQUE des sources actuellement affichées à uidA et uidB —
// c'est l'opération élémentaire, appelée une fois par clic "échanger".
// Testé exhaustivement avant intégration (échange simple, ré-échange qui
// annule, rotation à 3, rotation à 4, échanges indépendants) : donne
// toujours le résultat d'un vrai échange physique répété, cf. exemple
// Lundi/Mardi/Mercredi ci-dessus.
function echangerSwap(uidA, uidB) {
  const sourceA = sourceSwap(uidA);
  const sourceB = sourceSwap(uidB);
  swappedSessions[uidA] = sourceB;
  swappedSessions[uidB] = sourceA;
  // Nettoyage : une entrée qui redevient l'identité (uid affiche sa
  // propre source d'origine) est retirée — garde swappedSessions minimal,
  // cohérent avec l'état "aucun swap actif" pour cette position.
  if (swappedSessions[uidA] === uidA) delete swappedSessions[uidA];
  if (swappedSessions[uidB] === uidB) delete swappedSessions[uidB];
}

function getEffectiveSession(week, slotIdx) {
  const uid = week.week+"-"+slotIdx;
  const uidSource = sourceSwap(uid);
  if (uidSource === uid) return week.sessions[slotIdx] || null;
  const sourceParts = uidSource.split("-");
  const sourceWeekNum = parseInt(sourceParts[0]);
  const sourceIdx = parseInt(sourceParts[1]);
  const sourceWeek = PLAN.find(w=>w.week===sourceWeekNum);
  if (sourceWeek && sourceWeek.sessions[sourceIdx]) return sourceWeek.sessions[sourceIdx];
  return week.sessions[slotIdx] || null;
}

// Jours disponibles pour deplacement (REPOS non swappés, ou slots masqués)
// Jours disponibles pour déplacement (22/07/2026, demande de Laurent :
// swap entre deux séances existantes, pas seulement vers un jour repos) —
// propose désormais TOUS les jours de la semaine sauf le slot d'origine,
// avec un libellé indiquant le vrai contenu du jour cible pour que le
// coureur sache ce qu'il échange. Exclut uniquement les jours dont la
// séance est déjà validée (✅/⚠️/❌) — même règle que celle déjà appliquée
// à la séance SOURCE (cf. isDone dans showSessionMenu) : on ne réécrit
// jamais un historique déjà réalisé, dans aucun des deux sens de l'échange.
function getAvailableSlots(week, excludeIdx) {
  const slots = week.sessions.map((s,i) => {
    const uid = week.week+"-"+i;
    if (i === excludeIdx) return null;
    const effective = getEffectiveSession(week, i);
    if (!effective) return null;
    // BUG évité le 22/07/2026 (discussion avec Laurent) : statuses[uid]
    // seul ne suffit pas — une séance peut avoir une note (sessionNotes),
    // un RPE (sessionRpe) ou une saisie manuelle (manualPerf) déjà
    // enregistrés SANS statut ✅/⚠️/❌ posé (ex. note ajoutée avant même
    // de courir). Ces données restent indexées par uid (position
    // calendaire), pas par le contenu de la séance — un swap les
    // laisserait accrochées au mauvais jour après échange. Toute trace
    // d'activité réelle, peu importe sa forme, bloque désormais le swap
    // dans les deux sens (source ET destination). Étendu le même jour :
    // un jour PASSÉ (donc auto-😴, cf. statutEffectif dans
    // recalculerAllSessions) est traité comme "déjà réalisé" au même
    // titre qu'un vrai statut — on ne swap jamais un jour révolu.
    const estPasseNonSaisi = s.date < today() && (!statuses[uid] || statuses[uid] === "—");
    const aTraceActivite = ["✅","⚠️","❌"].includes(statuses[uid])
      || !!sessionNotes[uid]
      || !!sessionRpe[uid]
      || !!manualPerf[uid]
      || estPasseNonSaisi;
    if (aTraceActivite) return null; // séance déjà réalisée, annotée, ou jour révolu — jamais une cible d'échange
    if (effective.type === "REPOS") return {idx:i, uid, date:s.date, label:"Repos"};
    if (hiddenSessions[uid]) return {idx:i, uid, date:s.date, label:effective.type+" (masquee)"};
    // Jour actif normal — libellé avec le vrai type de séance présente,
    // pour que le coureur comprenne qu'il s'agit d'un échange, pas d'un
    // simple déplacement vers du vide.
    return {idx:i, uid, date:s.date, label:effective.type+" — "+(effective.session||"").slice(0,30)};
  }).filter(Boolean);
return slots;
}

function showSessionMenu(week, slotIdx) {
  document.querySelectorAll(".sess-overlay").forEach(m=>m.remove());
  const uid = week.week+"-"+slotIdx;
  const isHidden = !!hiddenSessions[uid];
  const sess = getEffectiveSession(week, slotIdx);

  const overlay = document.createElement("div");
  overlay.className = "sess-overlay";
  overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center;";

  const panel = document.createElement("div");
  panel.style.cssText = "background:var(--bg);border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%;max-width:430px;";

  const t1 = document.createElement("div");
  t1.style.cssText = "color:var(--text);font-size:15px;font-weight:700;margin-bottom:2px;";
  t1.textContent = sess.type+" - "+sess.session.slice(0,40);
  const t2 = document.createElement("div");
  t2.style.cssText = "color:var(--text-muted);font-size:13px;margin-bottom:16px;";
  t2.textContent = week.sessions[slotIdx].date;
  panel.appendChild(t1); panel.appendChild(t2);

  const btnStyle = "width:100%;padding:13px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;text-align:left;display:block;";

  if (!isHidden) {
    // Si ce slot est swappé, proposer d'annuler le swap
    const isSwapped = !!swappedSessions[uid];
    if (isSwapped) {
      const undoBtn = document.createElement("button");
      undoBtn.style.cssText = btnStyle+"background:rgba(var(--warn-rgb),0.13);color:var(--warn);";
      undoBtn.textContent = "Annuler le deplacement";
      undoBtn.addEventListener("click", () => {
        // Nouveau modèle (refonte rotation) : "annuler" = cette position
        // réaffiche son contenu d'origine, sans toucher aux autres
        // positions d'une éventuelle chaîne plus longue (cohérent avec le
        // fait qu'un swap n'est plus une paire figée, mais un maillon
        // indépendant d'une rotation — cf. sourceSwap()/echangerSwap()).
        delete swappedSessions[uid];
        save(clePourPlan("lk_swapped_sessions"), swappedSessions);
        // CORRECTIF (07/08/2026) — même bug et même fix que les deux
        // chemins de création de swap (cf. leur commentaire pour le
        // détail) : "Annuler le déplacement" avait le même oubli de
        // recalcul de ALL_SESSIONS avant render(), troisième et dernier
        // site de mutation de swappedSessions dans ce fichier.
        ALL_SESSIONS = recalculerAllSessions();
        overlay.remove();
        render();
      });
      panel.appendChild(undoBtn);
    }

    // Choix manuel d'activité si ambigu (24/07/2026) — cf.
    // obtenirActivitesAmbigues, matchActivitiesToPlan, renderStatusRow.
    const dateSlotAmbigu = week.sessions[slotIdx]?.date;
    const { ambigu, candidats } = obtenirActivitesAmbigues(uid, dateSlotAmbigu);
    if (ambigu) {
      const choixTitre = document.createElement("div");
      choixTitre.style.cssText = "color:var(--text);font-size:14px;font-weight:700;margin:12px 0 8px;";
      choixTitre.textContent = "❓ Plusieurs activités ce jour — choisis la bonne";
      panel.appendChild(choixTitre);
      candidats.forEach(activite => {
        const dureeMin = Math.round(activite.moving_time / 60);
        const allure = activite.average_speed > 0 ? fmtPace(activite.average_speed) : "—";
        const distKm = activite.distance ? (activite.distance/1000).toFixed(1) : "—";
        const choixBtn = document.createElement("button");
        choixBtn.style.cssText = "width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--border-soft);color:var(--text);font-size:13px;cursor:pointer;margin-bottom:8px;text-align:left;display:flex;justify-content:space-between;align-items:center;";
        const nomEl = document.createElement("span");
        nomEl.style.fontWeight = "600";
        nomEl.textContent = activite.name || "Course";
        const detailEl = document.createElement("span");
        detailEl.style.cssText = "color:var(--text-muted);font-size:12px;";
        detailEl.textContent = `${distKm}km · ${dureeMin}min · ${allure}/km`;
        choixBtn.appendChild(nomEl);
        choixBtn.appendChild(detailEl);
        choixBtn.addEventListener("click", () => {
          choixActiviteAmbigue[uid] = { activityId: activite.id, dateChoix: today(), nbActivitesAuChoix: candidats.length };
          save(clePourPlan("lk_choix_activite_ambigue"), choixActiviteAmbigue);
          const sessionPourValidation = ALL_SESSIONS.find(s => s.uid === uid);
          if (sessionPourValidation && (!statuses[uid] || statuses[uid]==="—")) {
            const auto = autoValidate(sessionPourValidation, activite);
            if (auto) statuses[uid] = auto;
            save(clePourPlan("lk_statuses"), statuses);
            ALL_SESSIONS = recalculerAllSessions(); // cf. correctif 26/07/2026 (bug badge 😴)
            // Cumul km (badge "km cumulés", 05/08/2026) — même correctif que
            // pour l'auto-validation en masse (ligne ~10982) : ce second
            // chemin (choix explicite d'une activité ambiguë) pose aussi un
            // statut hors du clic normal dans renderStatusRow(), donc sans
            // ce recalcul ses km ne seraient jamais comptés non plus.
            if (auto && sessionPourValidation.date) {
              recalculerKmComptesPourUid(uid, sessionPourValidation.date);
              // Estimation 10K (05/08/2026) — même trou que l'auto-validation
              // en masse (cf. son commentaire) : ce chemin pose aussi un
              // statut hors clic manuel, donc sans cet appel l'estimation
              // restait figée si l'activité choisie ici était une séance
              // SEUIL/VMA/SPEC.
              rebuildPredHistory();
            }
          }
          overlay.remove();
          render();
        });
        panel.appendChild(choixBtn);
      });
    }

    const isDone = ["✅","⚠️","❌"].includes(statuses[uid]);
    // Garde renforcée pour le déplacement uniquement (22/07/2026, cf.
    // getAvailableSlots) : une note/RPE/saisie manuelle sans statut posé
    // bloque aussi le déplacement — le bouton "Supprimer cette séance"
    // garde sa propre règle (isDone seul), sémantique différente. Étendu
    // le même jour : un jour PASSÉ sans statut (donc auto-😴) bloque aussi.
    const dateSlot = week.sessions[slotIdx]?.date;
    const estPasseNonSaisi = dateSlot && dateSlot < today() && (!statuses[uid] || statuses[uid] === "—");
    const aTraceActivite = isDone || !!sessionNotes[uid] || !!sessionRpe[uid] || !!manualPerf[uid] || estPasseNonSaisi;
    if (!aTraceActivite) {
      const moveBtn = document.createElement("button");
      moveBtn.style.cssText = btnStyle+"background:rgba(var(--accent-rgb),0.13);color:var(--accent);";
      moveBtn.textContent = "Deplacer cette seance";
      moveBtn.addEventListener("click", () => { overlay.remove(); showMoveMenu(week, slotIdx); });
      panel.appendChild(moveBtn);
    }

    // Bouton "Supprimer cette séance" retiré le 22/07/2026 (demande
    // explicite de Laurent) : une séance ne doit jamais pouvoir disparaître
    // du plan — seul un statut (✅/❌/⚠️/😴) la caractérise. hiddenSessions
    // et showRestoreMenu restent dans le code pour compatibilité avec les
    // séances déjà masquées avant ce changement, mais plus aucun nouveau
    // point d'entrée n'y mène.
  } else {
    const restoreBtn = document.createElement("button");
    restoreBtn.style.cssText = btnStyle+"background:rgba(var(--accent2-rgb),0.13);color:var(--accent2);";
    restoreBtn.textContent = "Restaurer cette seance";
    restoreBtn.addEventListener("click", () => {
      overlay.remove();
      // Verifier si le jour original est libre
      const conflict = !hiddenSessions[uid] && getEffectiveSession(week, slotIdx).type !== "REPOS";
      if (!conflict) {
        delete hiddenSessions[uid];
        save(clePourPlan("lk_hidden_sessions"), hiddenSessions);
        render();
      } else {
        showRestoreMenu(week, slotIdx);
      }
    });
    panel.appendChild(restoreBtn);
  }

  const cancelBtn = document.createElement("button");
  cancelBtn.style.cssText = btnStyle+"background:var(--border-soft);color:var(--text-muted);";
  cancelBtn.textContent = "Annuler";
  cancelBtn.addEventListener("click", () => overlay.remove());
  panel.appendChild(cancelBtn);

  overlay.appendChild(panel);
  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function showMoveMenu(week, slotIdx) {
  const slots = getAvailableSlots(week, slotIdx);
  if (!slots.length) { alert("Aucune autre séance à échanger cette semaine (toutes déjà validées, ou une seule séance dans la semaine)."); return; }

  document.querySelectorAll(".sess-overlay").forEach(m=>m.remove());
  const overlay = document.createElement("div");
  overlay.className = "sess-overlay";
  overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center;";

  const panel = document.createElement("div");
  panel.style.cssText = "background:var(--bg);border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%;max-width:430px;";

  const t1 = document.createElement("div");
  t1.style.cssText = "color:var(--text);font-size:15px;font-weight:700;margin-bottom:16px;";

  const btnStyle = "width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--border-soft);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left;display:block;";

  slots.forEach(slot => {

    btn.style.cssText = btnStyle;
    const dayLabel = new Date(slot.date+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    // Affichage sur deux lignes (22/07/2026) : jour en évidence, contenu de
    // la séance cible en sous-texte — plus lisible qu'une seule ligne
    // compacte depuis que ce menu propose aussi des jours actifs (pas
    // seulement "Repos"), dont le libellé est plus long.
    const ligneJour = document.createElement("div");
    ligneJour.textContent = dayLabel;
    btn.appendChild(ligneJour);
    const ligneDetail = document.createElement("div");
    ligneDetail.style.cssText = "font-size:12px;font-weight:400;color:var(--text-muted);margin-top:2px;";
    ligneDetail.textContent = slot.label;
    btn.appendChild(ligneDetail);
    btn.addEventListener("click", () => {
      const uidA = week.week+"-"+slotIdx;
      const uidB = slot.uid;
      // Nouveau modèle (refonte rotation) : échange physique direct des
      // sources actuellement affichées à uidA et uidB — cf.
      // echangerSwap()/sourceSwap(). Un ré-échange de la même paire
      // annule naturellement (l'algorithme redonne l'identité), pas
      // besoin de cas particulier comme dans l'ancien modèle.
      echangerSwap(uidA, uidB);
      save(clePourPlan("lk_swapped_sessions"), swappedSessions);
      // CORRECTIF (07/08/2026, bug signalé par Laurent : après avoir
      // déplacé une SORTIE LONGUE du dimanche vers un samedi initialement
      // REPOS, le dashboard continuait d'afficher "Repos" pour samedi.
      // Cause : ALL_SESSIONS (construite par recalculerAllSessions(), qui
      // applique déjà getEffectiveSession() pour refléter les swaps —
      // cf. son en-tête) n'était JAMAIS recalculée après avoir posé le
      // nouveau swappedSessions ci-dessus — render() réutilisait donc
      // l'ancien ALL_SESSIONS, calculé avant ce swap, encore basé sur le
      // contenu d'origine des deux slots. Même pattern de bug déjà
      // corrigé ailleurs sur ce fichier pour statuses (cf. correctif
      // 26/07/2026, "bug badge 😴", sur les boutons Annuler/Supprimer de
      // renderManualPerfRow) : toute mutation d'un état source de
      // ALL_SESSIONS doit être suivie d'un recalcul explicite avant tout
      // render(), jamais implicite.
      ALL_SESSIONS = recalculerAllSessions();
      overlay.remove();
      render();
    });
    panel.appendChild(btn);
  });

  const cancelBtn = document.createElement("button");
  cancelBtn.style.cssText = "width:100%;padding:13px;border-radius:10px;border:none;background:rgba(var(--warn-rgb),0.13);color:var(--warn);font-size:14px;font-weight:700;cursor:pointer;display:block;";
  cancelBtn.textContent = "Annuler";
  cancelBtn.addEventListener("click", () => overlay.remove());
  panel.appendChild(cancelBtn);

  overlay.appendChild(panel);
  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function fmtTimeShort(secs) {
  // Même correction que fmtTime (cf. commentaire associé) — format
  // heures/minutes/secondes au-delà de 60 minutes.
  const totalMin = Math.floor(secs/60), s2 = secs%60;
  if (totalMin >= 60) {
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h+"h"+m.toString().padStart(2,"0")+"min"+s2.toString().padStart(2,"0")+"s";
  }
  return totalMin+"min"+s2.toString().padStart(2,"0")+"s";
}

// AIDE
// ══════════════════════════════════════════════════════════════════════════════
// ── Aide (30/07/2026, refonte) ──────────────────────────────────────────
// Le CONTENU (textes, sections) a été extrait dans public/help-content.js
// (import dynamique ci-dessous, même pattern que weather.js/plan-generator.js
// — cf. commentaire en tête de ce fichier sur import()) — demandé par
// Laurent : index.html est un gros fichier, coûteux à repatcher pour un
// simple ajout de texte d'aide. Ce fichier ne s'occupe plus que de
// L'AFFICHAGE (accordéon + recherche), jamais du contenu lui-même.
//
// Accordéon replié par défaut (état en mémoire, jamais persisté — repart
// replié à chaque ouverture de l'aide, cohérent avec un écran consulté
// ponctuellement) + recherche texte en haut qui filtre les items ET
// déplie automatiquement toute section contenant un résultat — combine
// les deux pistes de navigation plutôt que de choisir l'une ou l'autre
// (une recherche seule laisse un mur de texte tant qu'on n'a rien tapé,
// un accordéon seul demande de deviner où chercher).
let _helpContentCache = null;
let _helpSectionsOuvertes = new Set(); // ids de sections dépliées, remis à zéro à chaque montage de l'écran (cf. setView("help"))
let _helpRecherche = "";
let _helpTutoOuvert = null; // id du tuto affiché en vue détail (section "tutos" uniquement), null = grille de tuiles
let _helpOngletActif = "aide"; // "aide" (sections classiques) | "tutos" (grille de tuiles / vue détail) — sélecteur ajouté le 04/08/2026

function renderHelp() {
  const conteneur = el("div",{style:{padding:"0 16px 100px"}}, el("div",{style:{marginTop:"8px"}}));

  if (!_helpContentCache) {
    conteneur.appendChild(el("div",{class:"muted",style:{fontSize:"14px",textAlign:"center",padding:"40px 0"}},"Chargement..."));
    import("/help-content.js").then(mod => {
      _helpContentCache = mod;
      if (view === "help") render(); // ne re-render que si l'utilisateur est toujours sur cet écran
    }).catch(e => {
      console.warn("Chargement de l'aide échoué :", e.message);
    });
    return conteneur;
  }

  const { introText, HELP_SECTIONS, TUTOS_GROUPES } = _helpContentCache;

  // ── Recherche ────────────────────────────────────────────────────────
  const champRecherche = el("input",{type:"text", id:"help-search", name:"help-search",
    placeholder:"Rechercher dans l'aide...", value:_helpRecherche,
    style:{width:"100%", padding:"11px 14px", borderRadius:"10px", border:"1px solid var(--border)",
      background:"var(--bg)", boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",
      color:"var(--text)", fontSize:"14px", marginBottom:"16px"},
    onChange: (e) => { _helpRecherche = e.target.value; render(); }
  });
  champRecherche.addEventListener("input", (e) => {
    _helpRecherche = e.target.value;
    const positionCurseur = e.target.selectionStart;
    render();
    // render() recrée tout le DOM de l'écran (y compris ce champ) — sans
    // restaurer focus + position du curseur, chaque frappe ferait perdre
    // le focus au champ de recherche (30/07/2026, refonte aide).
    const nouveauChamp = document.getElementById("help-search");
    if (nouveauChamp) {
      nouveauChamp.focus();
      nouveauChamp.setSelectionRange(positionCurseur, positionCurseur);
    }
  });

  const requete = _helpRecherche.trim().toLowerCase();

  // Section "tutos" traitée à part (tuiles + vue détail) — le reste des
  // sections garde l'accordéon existant, inchangé (04/08/2026).
  const sectionTutos = HELP_SECTIONS.find(s => s.id === "tutos");
  const sectionsClassiques = HELP_SECTIONS.filter(s => s.id !== "tutos");

  // Rendu d'un item d'aide : la plupart n'ont qu'un texte simple (it.text),
  // rendu tel quel. Les tutos par action peuvent fournir it.blocks — une
  // suite de segments typés (paragraphe, sous-titre, liste, image) — pour
  // une vraie mise en page. it.text reste toujours fourni en parallèle
  // (résumé pour la recherche), donc aucune régression si blocks est
  // absent : fallback intégral sur l'ancien rendu texte brut (04/08/2026).
  const rendreBlocsItem = (blocks) => blocks.map(b => {
    if (b.type === "h") return el("div",{style:{color:"var(--text)",fontSize:"13px",fontWeight:"700",marginTop:"14px",marginBottom:"6px",textTransform:"uppercase",letterSpacing:"0.02em"}}, b.text);
    if (b.type === "img") return el("div",{style:{margin:"4px 0 14px"}},
      el("img",{src:b.src, alt:b.alt||"", style:{display:"block",maxWidth:"260px",width:"100%",borderRadius:"12px",border:"1px solid var(--border)",margin:"0 auto"}}),
      b.caption ? el("div",{class:"muted",style:{fontSize:"12px",textAlign:"center",marginTop:"6px"}}, b.caption) : null
    );
    if (b.type === "list") return el(b.ordered?"ol":"ul",{style:{margin:"0 0 10px",paddingLeft:"20px",display:"flex",flexDirection:"column",gap:"6px"}},
      ...b.items.map(li => el("li",{class:"muted",style:{fontSize:"14px",lineHeight:"1.5"}}, li))
    );
    // "p" par défaut
    return el("div",{class:"muted",style:{fontSize:"14px",lineHeight:"1.6",marginBottom:"10px"}}, b.text);
  });

  // ── Sections classiques en accordéon (comportement inchangé) ──────────
  const sectionsRendues = sectionsClassiques.map(section => {
    let itemsAffiches = section.items;
    let sectionMatche = false;

    if (requete) {
      itemsAffiches = section.items.filter(it =>
        it.title.toLowerCase().includes(requete) || it.text.toLowerCase().includes(requete)
      );
      sectionMatche = itemsAffiches.length > 0;
      if (!sectionMatche) return null; // rien à montrer pour cette section pendant la recherche
    }

    const estOuverte = requete ? true : _helpSectionsOuvertes.has(section.id);

    const enTete = el("div",{id:"help-section-"+section.id, style:{
        display:"flex", alignItems:"center", justifyContent:"space-between",
        padding:"12px 4px", cursor:"pointer"
      },
      onClick: () => {
        if (requete) return; // pas de repli pendant une recherche, tout reste ouvert
        if (_helpSectionsOuvertes.has(section.id)) _helpSectionsOuvertes.delete(section.id);
        else _helpSectionsOuvertes.add(section.id);
        render();
      }
    },
      el("span",{style:{display:"flex", alignItems:"center", gap:"8px", fontSize:"15px", fontWeight:"700", color:"var(--text)"}},
        section.icon, section.title,
        requete ? el("span",{class:"muted", style:{fontSize:"12px", fontWeight:"500"}}, "("+itemsAffiches.length+")") : null
      ),
      requete ? null : el("span",{class:"muted", style:{fontSize:"14px", transform: estOuverte ? "rotate(90deg)" : "none", transition:"transform 0.15s"}}, "›")
    );

    const corps = estOuverte ? el("div",{style:{marginBottom:"8px"}}, card(
      ...itemsAffiches.map(it => el("div",{style:{marginBottom:"12px",paddingBottom:"12px",borderBottom:"1px solid var(--border)"}},
        el("div",{style:{color:"var(--text)",fontSize:"15px",fontWeight:"600",marginBottom:"4px"}},it.title),
        it.blocks
          ? el("div",{}, ...rendreBlocsItem(it.blocks))
          : el("div",{class:"muted",style:{fontSize:"14px",lineHeight:"1.6"}},it.text)
      ))
    )) : null;

    return el("div",{style:{borderBottom: estOuverte ? "none" : "1px solid var(--border)"}}, enTete, corps);
  }).filter(Boolean);

  // ── Section "tutos" : tuiles groupées, vue détail au clic ─────────────
  // Pendant une recherche, les tutos matchés s'affichent en résultats plats
  // (même traitement que les sections classiques) — la navigation en
  // tuiles n'a de sens que hors recherche, où l'utilisateur explore plutôt
  // qu'il ne cherche un mot précis (04/08/2026).
  let blocTutos = null;
  if (sectionTutos) {
    if (requete) {
      const itemsMatches = sectionTutos.items.filter(it =>
        it.title.toLowerCase().includes(requete) || it.text.toLowerCase().includes(requete)
      );
      if (itemsMatches.length > 0) {
        const enTete = el("div",{style:{display:"flex", alignItems:"center", gap:"8px", padding:"12px 4px", fontSize:"15px", fontWeight:"700", color:"var(--text)"}},
          sectionTutos.icon, sectionTutos.title,
          el("span",{class:"muted", style:{fontSize:"12px", fontWeight:"500"}}, "("+itemsMatches.length+")")
        );
        const corps = el("div",{style:{marginBottom:"8px"}}, card(
          ...itemsMatches.map(it => el("div",{style:{marginBottom:"12px",paddingBottom:"12px",borderBottom:"1px solid var(--border)"}},
            el("div",{style:{color:"var(--text)",fontSize:"15px",fontWeight:"600",marginBottom:"4px"}},it.title),
            it.blocks
              ? el("div",{}, ...rendreBlocsItem(it.blocks))
              : el("div",{class:"muted",style:{fontSize:"14px",lineHeight:"1.6"}},it.text)
          ))
        ));
        blocTutos = el("div",{}, enTete, corps);
      }
    } else if (_helpTutoOuvert) {
      // ── Vue détail d'un tuto ──────────────────────────────────────────
      // Pas de bouton retour ici : le header sticky de l'écran Aide (cf.
      // backBtn plus bas, "‹") ramène déjà à la liste des tuiles quand un
      // tuto est ouvert, et affiche le titre du tuto — évite un second
      // bouton retour perdu dans le contenu (04/08/2026).
      const it = sectionTutos.items.find(i => i.id === _helpTutoOuvert);
      if (it) {
        const corps = card(
          it.blocks
            ? el("div",{}, ...rendreBlocsItem(it.blocks))
            : el("div",{class:"muted",style:{fontSize:"14px",lineHeight:"1.6"}},it.text)
        );
        blocTutos = el("div",{style:{marginBottom:"8px"}}, corps);
      }
    } else {
      // ── Grille de tuiles groupées par thème ────────────────────────────
      const itemsParId = Object.fromEntries(sectionTutos.items.map(it => [it.id, it]));
      const groupesRendus = (TUTOS_GROUPES || [])
        .map(groupe => {
          const itemsDuGroupe = groupe.itemIds.map(id => itemsParId[id]).filter(Boolean);
          if (itemsDuGroupe.length === 0) return null; // groupe pas encore alimenté, pas de tuile morte
          return el("div",{style:{marginBottom:"18px"}},
            el("div",{class:"muted", style:{fontSize:"13px", fontWeight:"700", textTransform:"uppercase", letterSpacing:"0.02em", marginBottom:"8px", display:"flex", alignItems:"center", gap:"6px"}},
              groupe.icon, groupe.label
            ),
            el("div",{style:{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px"}},
              ...itemsDuGroupe.map(it => el("div",{style:{
                  background:"var(--bg)", border:"1px solid var(--border)", borderRadius:"12px",
                  padding:"12px 10px", cursor:"pointer",
                  boxShadow:"0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)",
                  display:"flex", flexDirection:"column", justifyContent:"flex-start", height:"112px", overflow:"hidden"
                },
                feedback:true,
                onClick: () => { _helpTutoOuvert = it.id; _helpOngletActif = "tutos"; render(); }
              },
                el("div",{style:{fontSize:"20px", marginBottom:"5px"}}, it.icon || "📌"),
                el("div",{style:{color:"var(--text)", fontSize:"12.5px", fontWeight:"600", lineHeight:"1.25", overflowWrap:"break-word", wordBreak:"break-word"}}, it.title)
              ))
            )
          );
        }).filter(Boolean);
      blocTutos = el("div",{style:{marginBottom:"8px"}}, ...groupesRendus);
    }
  }

  const resultatsVides = requete && sectionsRendues.length === 0 && !blocTutos
    ? el("div",{class:"muted",style:{fontSize:"14px",textAlign:"center",padding:"30px 0"}},"Aucun résultat pour \""+_helpRecherche+"\"")
    : null;

  const enVueDetailTuto = !requete && !!_helpTutoOuvert;

  // ── Sélecteur d'onglets Aide / Tutos ───────────────────────────────────
  // Ajouté le 04/08/2026 (demande Laurent) : sections classiques et tutos
  // par action ne s'affichent plus l'un à la suite de l'autre en continu,
  // l'un OU l'autre selon l'onglet choisi. Masqué pendant une recherche
  // (résultats transversaux affichés ensemble, comme avant) et en vue
  // détail d'un tuto (le bouton retour du header suffit, cf. backBtn).
  const selecteurOnglets = (requete || enVueDetailTuto) ? null : el("div",{style:{
      display:"flex", gap:"4px", background:"var(--border-soft)", borderRadius:"10px", padding:"3px", marginBottom:"16px"
    }},
    ...[
      { id:"aide", label:"Aide" },
      { id:"tutos", label:"Tutos" },
    ].map(onglet => el("button",{style:{
        flex:"1", border:"none", borderRadius:"8px", padding:"9px", cursor:"pointer",
        fontSize:"14px", fontWeight:"700",
        background: _helpOngletActif===onglet.id ? "var(--bg)" : "transparent",
        color: _helpOngletActif===onglet.id ? "var(--text)" : "var(--text-muted)",
        boxShadow: _helpOngletActif===onglet.id ? "0 1px 3px var(--shadow1), 0 1px 2px var(--shadow2)" : "none",
      },
      feedback:true,
      onClick: () => { _helpOngletActif = onglet.id; render(); }
    }, onglet.label))
  );

  if (!enVueDetailTuto) conteneur.appendChild(champRecherche);
  if (selecteurOnglets) conteneur.appendChild(selecteurOnglets);
  if (resultatsVides) conteneur.appendChild(resultatsVides);

  // Hors recherche : un seul des deux blocs s'affiche, selon l'onglet actif.
  // Pendant une recherche : les deux s'affichent ensemble (transversal),
  // comportement inchangé par rapport à avant l'ajout des onglets.
  const afficherTutos = requete ? !!blocTutos : (_helpOngletActif === "tutos");
  const afficherAide = requete ? sectionsRendues.length > 0 : (_helpOngletActif === "aide");

  if (afficherTutos && blocTutos) conteneur.appendChild(blocTutos);
  if (afficherAide) sectionsRendues.forEach(s => conteneur.appendChild(s));

  return conteneur;
}

function renderSettings() {
  // Section compte utilisateur (Supabase) — ajoutée le 13 juillet 2026,
  // chantier v2.5 auth (inventaire §8bis). Oubliée lors de l'intégration
  // initiale de l'écran de connexion : LkAuth.deconnecter() existait déjà
  // mais aucun bouton n'y donnait accès dans l'interface.
  const accountSection = el("div", {style:{marginBottom:"24px"}},
    el("div",{class:"label"},"👤 Compte"),
    card(
      el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
        el("div",{style:{color:"var(--text)",fontSize:"15px"}},
          window.__UTILISATEUR__?.email || "Connecté"
        ),
        el("button",{style:{background:"rgba(var(--warn-rgb),0.13)",border:"1px solid rgba(var(--warn-rgb),0.33)",borderRadius:"8px",padding:"8px 14px",color:"var(--warn)",fontWeight:"700",fontSize:"14px",cursor:"pointer"},
          onClick: async ()=>{
            if (!confirm("Se déconnecter de Yoria ?")) return;
            await LkAuth.deconnecter();
            window.location.reload();
          }
        },"Se déconnecter")
      )
    )
  );

  // Section "☁️ Sauvegarde cloud" retirée le 13 juillet 2026 — redondante
  // avec la synchro Supabase (table integrations, cf. sync-storage.js).
  // chargerPlans()/githubToken/gistId restent utilisés en interne (Gist),
  // seule l'UI manuelle de gestion du token est retirée.
  const cloudSection = null;

  // ── Thème clair / sombre ─────────────────────────────────────────────
  const themeActuel = localStorage.getItem('lk_theme') || 'light';
  // Apparence (31/07/2026, demande de Laurent) — auparavant une carte
  // pleine largeur avec 2 boutons Clair/Sombre, mêlée au groupe "Compte et
  // abonnement" (logique bancale : un réglage d'affichage général n'a
  // rien à voir avec l'identité du compte ou la facturation). Remplacée
  // par un simple bouton icône toggle, discret, intégré à droite de
  // l'en-tête de l'app (appHeaderEl ci-dessous) plutôt qu'une section à
  // part entière — c'est un réglage qu'on ajuste rarement mais qu'on veut
  // pouvoir trouver vite, sans lui donner l'importance visuelle d'une
  // vraie section de compte.
  // Fond adapté au symbole affiché (31/07/2026, demande de Laurent : "plus
  // visible, blanc pour le soleil, noir pour la lune") — plutôt qu'un fond
  // neutre fixe (--border-soft), le fond du bouton contraste maintenant
  // avec l'icône elle-même. iconeThemeAffichee = ce que MONTRE le bouton
  // (pas le thème actif) : on affiche l'icône de la DESTINATION du clic
  // (🌙 si on est en clair, pour basculer en sombre), donc le fond suit
  // logiquement cette même icône affichée, pas themeActuel directement.
  const iconeThemeAffichee = themeActuel === "light" ? "🌙" : "☀️";
  const themeToggleBtn = el("button",{style:{
    marginLeft:"auto", flexShrink:"0", width:"36px", height:"36px", borderRadius:"50%",
    border:"1px solid var(--border)",
    background: iconeThemeAffichee === "☀️" ? "#F8FAFC" : "#0F172A",
    fontSize:"16px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center"
  }, onClick: ()=>{
    const nouveauTheme = themeActuel === "light" ? "dark" : "light";
    localStorage.setItem('lk_theme', nouveauTheme);
    document.documentElement.setAttribute('data-theme', nouveauTheme);
    // Cohérent avec le script synchrone de chargement initial (cf. son
    // commentaire, tout en tête du <head>) — la bascule manuelle du
    // thème doit aussi maintenir cette balise à jour.
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');
    if (themeColorMeta) themeColorMeta.setAttribute('content', nouveauTheme === 'dark' ? '#0D1117' : '#F8FAFC');
    render();
  }}, iconeThemeAffichee);

  // ── Profil coureur + Objectif + PPS ─────────────────────────────────────
  const categorieFFA = calculerCategorieAgeFFA(profilCoureur.anneeNaissance, today());
  const estAnniv = estAnniversaireAujourdhui(profilCoureur.dateNaissance);
  const profileSection = el("div",{style:{marginBottom:"16px"}},
    el("div",{class:"label"},"👤 Profil & objectif"),
    estAnniv ? el("div",{style:{background:"rgba(var(--accent-rgb),0.13)",border:"1px solid rgba(var(--accent-rgb),0.27)",borderRadius:"10px",padding:"10px 14px",marginBottom:"8px",fontSize:"14px",color:"var(--accent)",fontWeight:"700"}},"🎂 Joyeux anniversaire !") : null,
    (()=>{
      const wrap = document.createElement("div");
      wrap.style.cssText = "background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;";
      const tbl = document.createElement("table");
      tbl.style.cssText = "width:100%;border-collapse:collapse;";
      const rows = [
        {label:"Prénom", id:"inp-prenom", type:"text", unit:"", val:profilCoureur.prenom||""},
        {label:"Nom", id:"inp-nom", type:"text", unit:"", val:profilCoureur.nom||""},
        {label:"Date de naissance", id:"inp-date-naissance", type:"date", unit:"", val:profilCoureur.dateNaissance||"", width:"140px"},
        {label:"separator"},
        {label:"Poids", id:"inp-poids", type:"number", unit:"kg", val:runnerWeight||""},
        {label:"Taille", id:"inp-taille", type:"number", unit:"cm", val:runnerHeight||""},
        {label:"FC max", id:"inp-fcmax", type:"number", unit:"bpm", val:runnerFcMax||181},
        {label:"FC repos", id:"inp-fcrepos", type:"number", unit:"bpm", val:profilCoureur.fcRepos||""},
        {label:"separator"},
        {label:"Objectif", id:"inp-goal", type:"text", unit:fmtPace(DISTANCE_M_REFERENCE/raceGoalTime)+"/km", val: raceGoalTime >= 3600
          ? Math.floor(raceGoalTime/3600)+":"+Math.floor((raceGoalTime%3600)/60).toString().padStart(2,"0")+":"+(raceGoalTime%60).toString().padStart(2,"0")
          : Math.floor(raceGoalTime/60)+":"+(raceGoalTime%60).toString().padStart(2,"0"), color:"var(--accent)"},
      ];
      rows.forEach((r,i)=>{
        const tr = document.createElement("tr");
        if (r.label==="separator") {
          const td = document.createElement("td");
          td.colSpan = 3;
          td.style.cssText = "padding:0;border-top:1px solid var(--border);";
          tr.appendChild(td);
          tbl.appendChild(tr);
          return;
        }
        if (i>0) tr.style.cssText = "border-top:1px solid var(--border);";
        const tdLabel = document.createElement("td");
        tdLabel.style.cssText = "padding:8px 0;color:var(--text-muted);font-size:15px;";
        tdLabel.textContent = r.label;
        const tdInput = document.createElement("td");
        tdInput.style.cssText = "padding:8px 0;text-align:right;";
        const inp = document.createElement("input");
        inp.type = r.type; inp.id = r.id;
        const inputColor = r.color || "var(--text)";
        const inputWidth = r.width || "80px";
        inp.style.cssText = "width:"+inputWidth+";background:var(--border-soft);border:1px solid "+(r.color?"rgba(var(--accent-rgb),0.27)":"var(--border)")+";border-radius:6px;padding:5px 8px;color:"+inputColor+";font-size:15px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums;font-weight:"+(r.color?"700":"400")+";";
        inp.value = r.val;
        // Auto-sauvegarde à la sortie du champ (31/07/2026, demande de
        // Laurent : "les RP devraient être autovalidés dès qu'ils sont
        // saisis... dans profil coureur pourrait-on faire la même chose ?")
        // — remplace le bouton "Enregistrer" global unique par une
        // sauvegarde individuelle par champ. Déclenchée sur 'change' (donc
        // à la perte de focus / touche Entrée pour un <input>), pas
        // 'input' (à chaque frappe) : sauvegarderProfilCoureur() fait un
        // vrai appel réseau Supabase (cf. son commentaire), le déclencher
        // à chaque lettre tapée sur prénom/nom aurait été excessif —
        // confirmé explicitement par Laurent avant d'implémenter ainsi.
        // Logique de lecture reprise telle quelle depuis l'ancien
        // handler unique de saveBtn (ci-dessous), juste répartie par id de
        // champ plutôt que tout lu d'un coup au clic sur un bouton commun.
        inp.addEventListener("change", avecRetourTactile(()=>{
          if (r.id === "inp-prenom") { profilCoureur.prenom = inp.value.trim(); sauvegarderProfilCoureur(); }
          else if (r.id === "inp-nom") { profilCoureur.nom = inp.value.trim(); sauvegarderProfilCoureur(); }
          else if (r.id === "inp-date-naissance") {
            profilCoureur.dateNaissance = inp.value || null;
            // anneeNaissance reste dérivée automatiquement de dateNaissance
            // — cf. commentaire original sur ce point, inchangé.
            profilCoureur.anneeNaissance = profilCoureur.dateNaissance ? parseInt(profilCoureur.dateNaissance.slice(0,4)) : null;
            sauvegarderProfilCoureur();
            render(); // catégorie FFA/anniversaire dépendent de la date de naissance
          }
          else if (r.id === "inp-poids") { runnerWeight = parseInt(inp.value)||null; profilCoureur.poids = runnerWeight; sauvegarderProfilCoureur(); }
          else if (r.id === "inp-taille") { runnerHeight = parseInt(inp.value)||null; profilCoureur.taille = runnerHeight; sauvegarderProfilCoureur(); }
          else if (r.id === "inp-fcmax") { runnerFcMax = parseInt(inp.value)||181; profilCoureur.fcMax = runnerFcMax; sauvegarderProfilCoureur(); }
          else if (r.id === "inp-fcrepos") { profilCoureur.fcRepos = parseInt(inp.value)||null; sauvegarderProfilCoureur(); }
          else if (r.id === "inp-goal") {
            // Accepte "M:SS" (sous l'heure) et "H:MM:SS" (au-delà) — même
            // logique que l'ancien handler saveBtn, inchangée.
            const parts = inp.value.split(":").map(Number);
            let s = null;
            if (parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])) s = parts[0]*60+parts[1];
            else if (parts.length===3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) s = parts[0]*3600+parts[1]*60+parts[2];
            if (s!==null && s>0) { raceGoalTime=s; save(clePourPlan("lk_race_goal"),raceGoalTime); render(); } // allure/km affichée dépend de raceGoalTime
          }
        }));
        tdInput.appendChild(inp);
        const tdUnit = document.createElement("td");
        tdUnit.style.cssText = "padding:8px 0 8px 8px;color:var(--text-muted);font-size:14px;width:36px;white-space:nowrap;";
        tdUnit.textContent = r.unit;
        tr.appendChild(tdLabel); tr.appendChild(tdInput); tr.appendChild(tdUnit);
        tbl.appendChild(tr);
      });
      wrap.appendChild(tbl);
      if (categorieFFA) {
        const catRow = document.createElement("div");
        catRow.style.cssText = "margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);";
        catRow.textContent = "Catégorie FFA saison en cours : "+categorieFFA.label+" ("+categorieFFA.code+")";
        wrap.appendChild(catRow);
      }
      return wrap;
    })(),
  );

  // ── Niveau du coureur (v2.8, retiré du wizard — §17.7) ────────────────
  // "Grand débutant" (v2.8, §17.9 — correction du 14/07/2026 : ce n'est
  // PAS un choix du wizard Mode Forme, comme envisagé un temps, mais bien
  // une valeur de ce sélecteur de niveau, au même titre que les 3 autres.
  // Un profil "grand-debutant" ne peut déclencher qu'un plan Mode Forme
  // (le wizard "Objectif course" doit rester inaccessible/inadapté pour
  // ce niveau — à traiter au moment de router vers generatePlanMarcheCourse
  // via plan-forme.js, cf. §17.1).
  const NIVEAUX_LABELS = { "grand-debutant": "Je n'ai jamais couru", debutant: "Débutant", intermediaire: "Intermédiaire", confirme: "Confirmé" };
  const niveauSection = el("div", {style:{marginBottom:"16px"}},
    el("div",{class:"label"},"🏃 Niveau"),
    card(
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}},
        ...Object.entries(NIVEAUX_LABELS).map(([val, lbl]) => {
          const actif = profilCoureur.niveau === val;
          return el("button",{id:"niveau-btn-"+val, style:{
            padding:"10px 6px",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"700",
            border: actif ? "1px solid var(--accent)" : "1px solid var(--border)",
            background: actif ? "rgba(var(--accent-rgb),0.13)" : "transparent",
            color: actif ? "var(--accent)" : "var(--text-muted)"
          }, onClick: ()=>{
            // BUG CORRIGÉ (20/07/2026, signalé par Laurent — profil perdu à
            // répétition) : ce clic appelait auparavant sauvegarderProfilCoureur()
            // immédiatement, qui envoie tout profilCoureur EN MÉMOIRE vers
            // Supabase à cet instant précis. Or les champs texte du formulaire
            // (prénom, nom, poids, taille...) ne sont recopiés dans
            // profilCoureur qu'au clic sur le bouton "Enregistrer les
            // paramètres" plus bas (cf. saveBtn.addEventListener) — pas à
            // chaque frappe. Si l'utilisateur tapait son nom/prénom/poids/
            // taille PUIS cliquait sur un bouton Niveau avant de cliquer sur
            // "Enregistrer", ce clic sauvegardait un profil avec le nouveau
            // niveau mais l'ANCIEN nom/prénom/poids/taille (souvent vides),
            // écrasant silencieusement Supabase avec des données incomplètes
            // avant même que l'utilisateur ait fini de remplir le formulaire.
            // Fix : mettre à jour uniquement l'état local + réafficher (pour
            // le highlight visuel du bouton actif) ; la vraie sauvegarde
            // n'a lieu qu'au clic explicite sur "Enregistrer les paramètres",
            // qui lit alors TOUS les champs du formulaire y compris le niveau.
            profilCoureur.niveau = val;
            render();
